  --ink3: #6b7499;
  --line: #e1e5f4;
  --line2: #eceffa;
  --zebra: #fbfbff;
  --hover: #eef1ff;
  --head: #f6f7fe;
  --input: #fff;
  --tint: rgba(42, 75, 245, 0.09);
  /* حالات */
  --ok: #00a389;
  --ok-bg: #e0f7f3;
  --warn: #c27400;
  --warn-bg: #fff3df;
  --bad: #e5484d;
  --bad-bg: #fdecec;
  /* الرسوم */
  --chart1: #2a4bf5;
  --chart2: #b010e2;
  --chart3: #6a2cf0;
  --chart4: #a8b0e0;
  --chart5: #12d3f5;
  --chart6: #f5a524;
  /* المقاسات */
  --r-s: 10px;
  --r: 14px;
  --r-l: 18px;
  --sp: 16px;
  --side-w: 264px;
  --top-h: 68px;
  --sh-1: 0 1px 2px rgba(18, 26, 79, 0.04), 0 1px 3px rgba(18, 26, 79, 0.06);
  --sh-2: 0 8px 24px rgba(18, 26, 79, 0.08), 0 2px 6px rgba(18, 26, 79, 0.04);
  --sh-3: 0 24px 48px rgba(11, 17, 96, 0.18);
  --neu: 0 1px 2px rgba(18, 26, 79, 0.05);
  --neu-in: none;
  --font:
    'Tajawal', 'IBM Plex Sans Arabic', 'Cairo', 'Segoe UI', 'SF Arabic', 'Geeza Pro', 'Noto Sans Arabic',
    Tahoma, Arial, sans-serif;
  --font-head: 'Tajawal', 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', 'Noto Sans Arabic', Tahoma, sans-serif;
  --font-num: 'Montserrat', 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --royal: #6b8bff;
  --royal-d: #5372ff;
  --link: #8ea6ff;
  --bg: #070a2e;
  --bg2: #0a0e3a;
  --card: #0e1342;
  --card2: #121852;
  --glass: rgba(14, 19, 66, 0.88);
  --ink: #eaedff;
  --ink2: #b6bde6;
  --ink3: #8a92c2;
  --line: #222a6a;
  --line2: #1a2160;
  --zebra: #10154a;
  --hover: #1a2068;
  --head: #111650;
  --input: #0a0e3a;
  --tint: rgba(107, 139, 255, 0.14);
  --ok: #2fd4b5;
  --ok-bg: #0b3a3d;
  --warn: #ffb547;
  --warn-bg: #3b2a10;
  --bad: #ff6b70;
  --bad-bg: #3f1622;
  --chart1: #6b8bff;
  --chart2: #2fd4b5;
  --chart3: #b45cf5;
  --chart4: #525c9e;
  --chart5: #3fe0ff;
  --chart6: #ffb547;
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh-2: 0 8px 24px rgba(0, 0, 0, 0.35);
  --sh-3: 0 24px 48px rgba(0, 0, 0, 0.55);
  --neu: none;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  font: 15px/1.6 var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: var(--font-head);
  text-wrap: balance;
}
a {
  color: var(--link);
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
[hidden] {
  display: none !important;
}
.num,
td.num,
th.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  text-align: left;
  direction: ltr;
}
input.num {
  text-align: left;
}
:focus-visible {
  outline: 2px solid var(--royal);
  outline-offset: 2px;
}
/* أزرار */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  padding: 8px 16px;
  border-radius: var(--r-s);
  cursor: pointer;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  box-shadow: var(--neu);
  transition:
    background 0.15s,
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.15s var(--ease);
}
.btn .ic {
  width: 16px;
  height: 16px;
  stroke-width: 2.2;
}
.btn:hover {
  background: var(--card2);
  border-color: color-mix(in srgb, var(--royal) 35%, var(--line));
}
.btn:active {
  transform: translateY(1px);
}
.btn.sm {
  padding: 6px 12px;
  font-size: 13.5px;
}
.btn.lg {
  padding: 11px 18px;
  font-size: 15.5px;
}
.btn.primary {
  background: var(--royal);
  border-color: var(--royal);
  color: #fff;
  box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--royal) 70%, transparent);
}
.btn.primary:hover {
  background: var(--royal-d);
  border-color: var(--royal-d);
}
.btn.danger {
  background: var(--bad);
  border-color: var(--bad);
  color: #fff;
}
.btn.ghost-danger {
  color: var(--bad);
  border-color: color-mix(in srgb, var(--bad) 35%, transparent);
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}
.link {
  background: none;
  border: 0;
  color: var(--link);
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
}
.icon-btn {
  background: none;
  border: 0;
  cursor: pointer;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: inline-grid;
  place-items: center;
  font-size: 16px;
  color: var(--ink2);
  text-decoration: none;
  position: relative;
  transition:
    background 0.15s,
    color 0.15s;
}
.icon-btn:hover {
  background: var(--hover);
  color: var(--royal);
}
.icon-btn .ic {
  width: 20px;
  height: 20px;
}
.ia {
  width: 30px;
  height: 30px;
  display: inline-grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ink3);
  cursor: pointer;
  margin-inline-start: 2px;
  transition:
    background 0.12s,
    color 0.12s;
}
.ia svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ia:hover {
  background: var(--tint);
  color: var(--royal);
}
.ia.danger:hover {
  background: var(--bad-bg);
  color: var(--bad);
}
/* حقول */
.fld {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.fld > span {
  font-size: 13px;
  color: var(--ink2);
  font-weight: 600;
}
.fld small {
  color: var(--ink3);
  font-size: 12px;
}
.req {
  color: var(--bad);
}
.fld input,
.fld select,
.fld textarea,
.lines input,
.lines select,
.tbl-q,
.num-grid input,
.mini input,
.mini-s {
  width: 100%;
  background: var(--input);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 8px 12px;
  min-height: 40px;
  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}
.fld input:hover,
.fld select:hover,
.fld textarea:hover {
  border-color: color-mix(in srgb, var(--royal) 30%, var(--line));
}
.fld input:focus,
.fld select:focus,
.fld textarea:focus,
.lines input:focus,
.lines select:focus,
.tbl-q:focus {
  outline: 0;
  border-color: var(--royal);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--royal) 18%, transparent);
}
.fld input[readonly],
.lines input[readonly] {
  background: var(--card2);
  color: var(--ink2);
}
.chk {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 14px;
}
.chk input {
  accent-color: var(--royal);
  width: 16px;
  height: 16px;
}
.chk.full,
.fld.full {
  grid-column: 1/-1;
}
.grid-form {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}
.form-actions {
  margin-top: 16px;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.img-fld img {
  max-height: 64px;
  display: block;
  margin-bottom: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
/* الافتتاحية والدخول */
#splash {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: var(--grad-ne);
  color: #fff;
  transition:
    opacity 0.4s,
    visibility 0.4s;
}
#splash.out {
  opacity: 0;
  visibility: hidden;
}
.sp-stage {
  text-align: center;
  animation: spIn 0.6s var(--ease);
}
.sp-stage img {
  width: 132px;
  filter: drop-shadow(0 18px 30px rgba(18, 211, 245, 0.35));
}
.sp-stage h1 {
  font-size: 40px;
  font-weight: 800;
  margin-top: 12px;
  line-height: 1.1;
}
.sp-stage h1 span {
  font-family: var(--font-num);
  color: var(--cyan);
  letter-spacing: 0.06em;
}
.sp-stage p {
  color: #c3c9f5;
  margin-top: 8px;
}
.sp-load {
  width: 160px;
  height: 3px;
  margin: 22px auto 0;
  background: rgba(255, 255, 255, 0.14);
  border-radius: 9px;
  overflow: hidden;
}
.sp-load i {
  display: block;
  height: 100%;
  width: 40%;
  background: var(--grad-bc);
  border-radius: 9px;
  animation: spLoad 1.1s var(--ease) infinite;
}
@keyframes spIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.96);
  }
}
@keyframes spLoad {
  from {
    transform: translateX(-260%);
  }
  to {
    transform: translateX(260%);
  }
}
#login {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(
      900px 500px at 100% 0%,
      color-mix(in srgb, var(--royal) 10%, transparent),
      transparent 60%
    ),
    var(--bg);
}
.login-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  width: min(1020px, 100%);
  min-height: 600px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--sh-3);
  overflow: hidden;
}
.login-art {
  position: relative;
  background: var(--grad-ne);
  color: #fff;
  padding: 44px 44px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
}
.login-art::before {
  content: '';
  position: absolute;
  width: 460px;
  height: 460px;
  inset-inline-start: -160px;
  bottom: -220px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(18, 211, 245, 0.35), transparent);
}
.login-art::after {
  content: '';
  position: absolute;
  inset-inline: -10% -10%;
  bottom: 70px;
  height: 120px;
  border-top: 2px solid rgba(18, 211, 245, 0.35);
  border-radius: 50%;
  transform: rotate(-6deg);
}
.la-brand,
.login-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.la-brand img {
  width: 64px;
}
.la-brand span,
.login-logo span,
.side-brand span {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.la-brand b,
.login-logo b,
.side-brand b {
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 30px;
}
.la-brand i,
.login-logo i,
.side-brand i {
  font-style: normal;
  font-family: var(--font-num);
  font-weight: 800;
  letter-spacing: 0.16em;
  font-size: 15px;
  color: var(--cyan);
  margin-top: 4px;
}
.login-art h2 {
  font-size: 32px;
  font-weight: 800;
  line-height: 1.35;
  margin-top: 26px;
  position: relative;
}
.login-art h2 em {
  font-style: normal;
  background: var(--grad-bc);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.login-art > p {
  color: #c3c9f5;
  font-size: 15.5px;
}
.login-art ul {
  list-style: none;
  padding: 0;
  margin: 10px 0 0;
  display: grid;
  gap: 12px;
  position: relative;
}
.login-art li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
}
.login-art li .ic {
  width: 22px;
  height: 22px;
  padding: 4px;
  border-radius: 50%;
  background: var(--grad-bc);
  color: #fff;
  stroke-width: 3;
}
.la-bars {
  direction: ltr;
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 92px;
  position: relative;
}
.la-bars u {
  width: 26px;
  border-radius: 7px 7px 2px 2px;
  background: linear-gradient(180deg, rgba(18, 211, 245, 0.85), rgba(42, 75, 245, 0.25));
}
.la-bars u:nth-child(1) {
  height: 28%;
}
.la-bars u:nth-child(2) {
  height: 44%;
}
.la-bars u:nth-child(3) {
  height: 58%;
}
.la-bars u:nth-child(4) {
  height: 78%;
}
.la-bars u:nth-child(5) {
  height: 100%;
}
.login-box {
  padding: 48px 48px 36px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  justify-content: center;
}
.login-logo {
  display: none;
}
.login-logo img {
  width: 52px;
}
.login-logo b {
  color: var(--navy);
  font-size: 26px;
}
:root[data-theme='dark'] .login-logo b {
  color: #fff;
}
.login-box h1 {
  font-size: 26px;
  font-weight: 800;
}
.login-box .sub {
  color: var(--ink3);
  margin-top: -8px;
  margin-bottom: 6px;
}
.pw {
  position: relative;
  display: block;
}
.pw input {
  padding-inline-end: 64px;
}
.pw .link {
  position: absolute;
  inset-inline-end: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  text-decoration: none;
  font-weight: 600;
}
.demo-note {
  background: var(--tint);
  border: 1px dashed color-mix(in srgb, var(--royal) 40%, transparent);
  padding: 10px 14px;
  border-radius: var(--r-s);
  font-size: 13.5px;
}
.fine {
  font-size: 12.5px;
  color: var(--ink3);
}
/* الهيكل: شريط جانبي داكن بكامل الارتفاع وشريط علوي فاتح */
#app {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  grid-template-rows: var(--top-h) minmax(0, 1fr);
  height: 100dvh;
  transition: grid-template-columns 0.2s var(--ease);
}
[data-nav='mini'] #app {
  --side-w: 80px;
}
.ic {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
/* الشريط العلوي */
#top {
  grid-column: 2;
  grid-row: 1;
  background: var(--glass);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 0;
  padding-inline: 24px;
  min-width: 0;
  z-index: 25;
  position: relative;
}
.brand {
  display: none;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-family: var(--font-head);
  font-size: 19px;
  font-weight: 800;
  white-space: nowrap;
  color: var(--navy);
}
:root[data-theme='dark'] .brand {
  color: #fff;
}
.brand img {
  height: 30px;
}
.brand b {
  font-family: var(--font-num);
  color: var(--royal);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.08em;
}
.search {
  position: relative;
  flex: 1;
  max-width: 460px;
  min-width: 80px;
}
.search > .ic {
  position: absolute;
  inset-inline-start: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink3);
  pointer-events: none;
}
.search input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--card2);
  border-radius: 12px;
  padding-block: 9px;
  padding-inline: 40px 42px;
  transition:
    border-color 0.15s,
    box-shadow 0.15s,
    background 0.15s;
}
.search input::placeholder {
  color: var(--ink3);
}
.search input:focus {
  outline: 0;
  background: var(--card);
  border-color: var(--royal);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--royal) 16%, transparent);
}
.search kbd {
  position: absolute;
  inset-inline-end: 10px;
  top: 50%;
  transform: translateY(-50%);
}
#gresults {
  position: absolute;
  top: calc(100% + 8px);
  inset-inline: 0;
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-3);
  z-index: 30;
  max-height: 380px;
  overflow: auto;
  padding: 6px;
}
#gresults a {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 9px;
  text-decoration: none;
  color: var(--ink);
}
#gresults a:hover {
  background: var(--hover);
}
#gresults small {
  color: var(--ink3);
}
#gresults p {
  padding: 10px 12px;
}
.top-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-inline-start: auto;
  min-width: 0;
}
.co {
  white-space: nowrap;
  overflow: hidden;
  max-width: 200px;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink2);
  padding-inline-end: 8px;
  margin-inline-end: 2px;
  border-inline-end: 1px solid var(--line);
}
.co img {
  height: 26px;
  border-radius: 6px;
}
.co strong {
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}
.br-sel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 0 10px;
  height: 38px;
  color: var(--ink3);
  background: var(--card);
}
.br-sel select {
  border: 0;
  background: none;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  max-width: 150px;
  cursor: pointer;
}
.br-sel select:focus {
  outline: 0;
}
.br-sel:focus-within {
  border-color: var(--royal);
}
.scale {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  height: 34px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}
.scale.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.scale.bad {
  background: var(--bad);
  color: #fff;
}
#clock {
  font-size: 12.5px;
  color: var(--ink3);
  white-space: nowrap;
  padding-inline: 6px;
  font-variant-numeric: tabular-nums;
}
.bell b {
  position: absolute;
  top: 3px;
  inset-inline-end: 3px;
  background: var(--bad);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  min-width: 17px;
  height: 17px;
  line-height: 17px;
  border-radius: 9px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--card);
  font-family: var(--font-num);
}
.user {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 4px 6px 4px 10px;
  cursor: pointer;
  white-space: nowrap;
  line-height: 1.25;
  text-align: start;
  margin-inline-start: 4px;
}
.user:hover {
  background: var(--hover);
}
.av {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--grad-bp);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.02em;
}
.u-t strong {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
}
.u-t small {
  font-size: 12px;
  color: var(--ink3);
}
/* الشريط الجانبي */
#side {
  grid-column: 1;
  grid-row: 1 / 3;
  background:
    radial-gradient(420px 260px at 50% 0%, rgba(42, 75, 245, 0.22), transparent 70%),
    linear-gradient(180deg, #0b1160, #090d40);
  color: #c3c9f5;
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: 30;
  padding: 0 12px;
}
:root[data-theme='dark'] #side {
  background:
    radial-gradient(420px 260px at 50% 0%, rgba(42, 75, 245, 0.18), transparent 70%),
    linear-gradient(180deg, #05072a, #030a20);
  border-inline-end: 1px solid var(--line);
}
.side-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--top-h);
  padding: 0 8px;
  text-decoration: none;
  color: #fff;
  flex: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  margin-bottom: 10px;
}
.side-brand img {
  width: 44px;
  filter: drop-shadow(0 6px 14px rgba(18, 211, 245, 0.3));
}
.side-brand b {
  font-size: 23px;
}
.side-brand i {
  font-size: 12px;
}
#side nav {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 8px;
}
#side a {
  text-decoration: none;
  color: inherit;
}
.nav-l,
#side summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 11px;
  cursor: pointer;
  font-weight: 500;
  font-size: 14.5px;
  list-style: none;
  color: #c3c9f5;
  white-space: nowrap;
  transition:
    background 0.15s,
    color 0.15s;
}
.nav-l .ic,
#side summary .ic {
  width: 20px;
  height: 20px;
  opacity: 0.9;
}
#side summary::-webkit-details-marker {
  display: none;
}
#side summary::after {
  content: '';
  width: 6px;
  height: 6px;
  border: solid currentColor;
  border-width: 0 1.6px 1.6px 0;
  transform: rotate(135deg);
  margin-inline-start: auto;
  transition: transform 0.16s;
  opacity: 0.7;
}
#side details[open] > summary::after {
  transform: rotate(45deg);
}
.nav-l:hover,
#side summary:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
}
#side details.cur > summary {
  color: #fff;
}
#side details.cur > summary .ic {
  color: var(--cyan);
  opacity: 1;
}
.nav-l.on {
  background: var(--grad-bc);
  color: #fff !important;
  box-shadow: 0 8px 20px -8px rgba(18, 211, 245, 0.65);
}
.panel-nav {
  padding: 2px 0 8px;
  animation: navIn 0.16s var(--ease);
}
@keyframes navIn {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
}
.panel-nav a {
  display: block;
  padding: 7px 14px;
  margin-inline-start: 22px;
  border-inline-start: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 13.8px;
  color: #9aa3e0 !important;
  transition: color 0.15s;
}
.panel-nav a:hover {
  color: #fff !important;
}
.panel-nav a.on {
  color: #fff !important;
  font-weight: 600;
  border-inline-start: 2px solid var(--cyan);
  background: linear-gradient(to left, rgba(18, 211, 245, 0.14), transparent);
  border-start-end-radius: 9px;
  border-end-end-radius: 9px;
}
.panel-nav h3 {
  font-family: var(--font);
  font-size: 11.5px;
  letter-spacing: 0.02em;
  color: #7d88d6;
  margin: 10px 36px 3px 0;
  font-weight: 700;
}
.side-foot {
  flex: none;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  padding: 10px 0 12px;
  display: grid;
  gap: 8px;
}
.side-slogan {
  margin: 0 4px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 13px;
  color: #c3c9f5;
  background: linear-gradient(135deg, rgba(42, 75, 245, 0.25), rgba(140, 31, 230, 0.22));
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.side-slogan b {
  color: #fff;
}
.side-toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  background: none;
  border: 0;
  padding: 8px 12px;
  border-radius: 10px;
  color: #949ddb;
  cursor: pointer;
  font-size: 13.5px;
  white-space: nowrap;
}
.side-toggle .ic {
  transition: transform 0.2s;
  transform: rotate(180deg);
}
.side-toggle:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}
.side-note {
  display: none;
}
.menu {
  display: none;
}
[data-nav='mini'] #side {
  padding: 0 10px;
}
[data-nav='mini'] #side nav {
  overflow: visible;
}
[data-nav='mini'] .side-brand {
  justify-content: center;
  padding: 0;
}
[data-nav='mini'] .side-brand span,
[data-nav='mini'] .side-slogan,
[data-nav='mini'] .nav-l span,
[data-nav='mini'] #side summary span,
[data-nav='mini'] #side summary::after,
[data-nav='mini'] .side-toggle span {
  display: none;
}
[data-nav='mini'] .nav-l,
[data-nav='mini'] #side summary {
  justify-content: center;
  padding: 11px;
}
[data-nav='mini'] .side-toggle {
  justify-content: center;
}
[data-nav='mini'] .side-toggle .ic {
  transform: none;
}
[data-nav='mini'] #side details {
  position: relative;
}
[data-nav='mini'] .panel-nav {
  position: absolute;
  top: 0;
  inset-inline-start: calc(100% + 12px);
  width: 250px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-3);
  padding: 8px;
  max-height: 70vh;
  overflow: auto;
  z-index: 40;
}
[data-nav='mini'] .panel-nav a {
  margin: 0;
  border: 0;
  border-radius: 8px;
  color: var(--ink2) !important;
}
[data-nav='mini'] .panel-nav a:hover,
[data-nav='mini'] .panel-nav a.on {
  color: var(--royal) !important;
  background: var(--hover);
}
[data-nav='mini'] .panel-nav h3 {
  margin: 6px 12px 2px;
  color: var(--ink3);
}
/* منطقة المحتوى */
#main {
  grid-column: 2;
  grid-row: 2;
  overflow: auto;
  padding-block: 24px 48px;
  padding-inline: 28px;
  min-width: 0;
}
#main.page-in {
  animation: pageIn 0.22s var(--ease);
}
@keyframes pageIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.page-head h1 {
  font-size: 25px;
  line-height: 1.3;
  font-weight: 800;
  color: var(--ink);
}
.page-head p {
  color: var(--ink3);
  font-size: 13.5px;
}
.head-tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
/* لوحة التحكم والمؤشرات */
.dash-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.eyebrow {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--royal);
}
.dash-hero h1 {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.25;
}
.dash-hero .muted {
  font-size: 13.5px;
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}
.kpi {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas:
    'i t'
    'v v'
    'f f';
  align-items: center;
  gap: 4px 12px;
  padding: 18px 18px 16px;
  border-radius: var(--r-l);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--sh-1);
  text-decoration: none;
  color: var(--ink);
  overflow: hidden;
  min-width: 0;
  transition:
    box-shadow 0.2s,
    transform 0.2s var(--ease),
    border-color 0.2s;
}
.kpi:hover {
  box-shadow: var(--sh-2);
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--royal) 25%, var(--line));
}
.kpi > i {
  grid-area: i;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--grad-bc);
  color: #fff;
  box-shadow: 0 8px 16px -8px rgba(42, 75, 245, 0.6);
}
.kpi > i .ic {
  width: 21px;
  height: 21px;
  stroke-width: 1.9;
}
.kpi.k-pur > i {
  background: linear-gradient(135deg, #12d3f5, #2a4bf5);
  box-shadow: 0 8px 16px -8px rgba(18, 211, 245, 0.6);
}
.kpi.k-pro > i {
  background: var(--grad-bp);
  box-shadow: 0 8px 16px -8px rgba(140, 31, 230, 0.55);
}
.kpi.k-exp > i {
  background: linear-gradient(135deg, #141a8a, #2a4bf5);
  box-shadow: 0 8px 16px -8px rgba(20, 26, 138, 0.6);
}
.kpi > span {
  grid-area: t;
  font-size: 13.5px;
  color: var(--ink3);
  font-weight: 600;
}
.kpi strong {
  grid-area: v;
  font-family: var(--font-num);
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  text-align: right;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.k-foot {
  grid-area: f;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}
.delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-style: normal;
  font-family: var(--font-num);
  font-size: 12.5px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--line2);
  color: var(--ink3);
  white-space: nowrap;
}
.delta small {
  font-family: var(--font);
  font-weight: 500;
  color: var(--ink3);
  margin-inline-start: 4px;
}
.delta .ic {
  width: 13px;
  height: 13px;
  stroke-width: 2.6;
}
.delta.up {
  background: var(--ok-bg);
  color: var(--ok);
}
.delta.down {
  background: var(--bad-bg);
  color: var(--bad);
}
.spark {
  flex: 0 1 110px;
  min-width: 50px;
  height: 32px;
}
.spark polyline {
  fill: none;
  stroke: var(--royal);
  stroke-width: 2;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.spark polygon {
  fill: color-mix(in srgb, var(--royal) 12%, transparent);
}
.k-pur .spark polyline {
  stroke: var(--teal);
}
.k-pur .spark polygon {
  fill: color-mix(in srgb, var(--teal) 14%, transparent);
}
.k-pro .spark polyline {
  stroke: var(--purple);
}
.k-pro .spark polygon {
  fill: color-mix(in srgb, var(--purple) 12%, transparent);
}
.neg {
  color: var(--bad);
}
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.kpi.sm {
  grid-template-areas:
    'i t'
    'i v';
  padding: 12px 14px;
  gap: 0 12px;
  border-radius: var(--r);
}
.kpi.sm > i {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--tint);
  color: var(--royal);
  box-shadow: none;
}
.kpi.sm > i .ic {
  width: 19px;
  height: 19px;
}
.kpi.sm strong {
  font-size: 17px;
  margin: 0;
}
.kpi.sm > span {
  font-size: 12.5px;
}
.kpi-inv {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 12px 16px;
  border-radius: var(--r);
  background: var(--grad-ne);
  color: #fff;
  text-decoration: none;
  min-width: 0;
  box-shadow: var(--sh-1);
}
.kpi-inv span {
  font-size: 12.5px;
  color: #c3c9f5;
  font-weight: 600;
}
.kpi-inv b {
  font-size: 18px;
  font-weight: 700;
  text-align: right;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpis > * {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 16px;
  box-shadow: var(--sh-1);
  min-width: 0;
}
.kpis span {
  display: block;
  font-size: 13px;
  color: var(--ink3);
  font-weight: 600;
}
.kpis strong {
  font-family: var(--font-num);
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  display: block;
  text-align: right;
}
.dash-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 18px 20px;
  min-width: 0;
  box-shadow: var(--sh-1);
}
.panel h2 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 10px;
}
.p-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 12px;
}
.p-head h2 {
  margin: 0;
}
.p-head small {
  color: var(--ink3);
  font-size: 12.5px;
}
.p-link {
  margin-inline-start: auto;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.p-head .count {
  margin-inline-start: auto;
  min-width: 24px;
  height: 24px;
  border-radius: 99px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  background: var(--bad-bg);
  color: var(--bad);
  padding: 0 7px;
}
.h-note {
  font-size: 12.5px;
  color: var(--ink3);
  font-weight: 400;
  margin-inline-start: 8px;
}
.span2 {
  grid-column: span 2;
}
.muted {
  color: var(--ink3);
  font-size: 14px;
}
.lead {
  font-size: 15.5px;
}
.sec {
  font-size: 17px;
  margin: 22px 0 10px;
}
.panel .btn {
  margin-top: 8px;
}
.chart-box {
  height: 260px;
  position: relative;
}
.chart-box.donut {
  height: 260px;
}
.lsvg {
  display: block;
  direction: ltr;
}
.lsvg .gl {
  stroke: var(--line2);
  stroke-dasharray: 3 4;
}
.lsvg .tk {
  font-size: 11px;
  fill: var(--ink3);
  font-family: var(--font-num);
}
.lsvg [data-tip],
.dn [data-tip] {
  cursor: pointer;
}
.lsvg path[data-tip]:hover {
  opacity: 0.8;
}
.dn-wrap {
  display: flex;
  align-items: center;
  gap: 18px;
  height: 100%;
}
.dn {
  width: 150px;
  flex: none;
}
.dn circle:hover {
  stroke-width: 23;
}
.dn-v {
  font: 700 17px var(--font-num);
  fill: var(--ink);
}
.dn-l {
  font-size: 11px;
  fill: var(--ink3);
  font-family: var(--font);
}
.dn-lg {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 7px;
  flex: 1;
  min-width: 0;
  font-size: 13px;
}
.dn-lg li {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dn-lg i {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  flex: none;
}
.dn-lg span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink2);
}
.dn-lg b {
  font-family: var(--font-num);
  font-weight: 700;
}
.legend {
  display: flex;
  gap: 18px;
  justify-content: center;
  font-size: 12.5px;
  color: var(--ink2);
  height: 30px;
  align-items: center;
}
.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-inline-end: 6px;
  vertical-align: -1px;
}
#tip {
  position: fixed;
  z-index: 120;
  background: var(--navy);
  color: #fff;
  font-size: 12.5px;
  padding: 5px 10px;
  border-radius: 8px;
  pointer-events: none;
  box-shadow: var(--sh-2);
  white-space: nowrap;
}
/* مؤشرات الأداء */
.perf {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 15px;
}
.perf div {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
}
.perf div b {
  font-weight: 700;
}
.perf i {
  display: block;
  height: 7px;
  border-radius: 9px;
  background: var(--line2);
  margin: 6px 0 3px;
  overflow: hidden;
}
.perf u {
  display: block;
  height: 100%;
  border-radius: 9px;
  background: var(--grad-bc);
}
.perf li:nth-child(2) u {
  background: var(--grad-bp);
}
.perf li:nth-child(3) u {
  background: linear-gradient(90deg, #12d3f5, #2a4bf5);
}
.perf li:nth-child(4) u {
  background: linear-gradient(90deg, #141a8a, #2a4bf5);
}
.perf small {
  color: var(--ink3);
  font-size: 12px;
}
/* المهام والإجراءات السريعة */
.tasks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.tasks a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 11px;
  text-decoration: none;
  color: var(--ink);
  background: var(--card2);
  border: 1px solid var(--line2);
  font-size: 13.5px;
  transition:
    border-color 0.15s,
    background 0.15s;
}
.tasks a:hover {
  border-color: color-mix(in srgb, var(--royal) 30%, var(--line));
  background: var(--hover);
}
.tasks i {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex: none;
  background: var(--warn-bg);
  color: var(--warn);
}
.tasks .bad i {
  background: var(--bad-bg);
  color: var(--bad);
}
.tasks span {
  min-width: 0;
}
.all-done {
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 26px 0;
  color: var(--ink3);
  font-size: 13.5px;
}
.all-done .ic {
  width: 40px;
  height: 40px;
  padding: 9px;
  border-radius: 50%;
  background: var(--ok-bg);
  color: var(--ok);
  stroke-width: 2.4;
}
.quick {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
}
.q-tile {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 14px 6px 12px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  transition:
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.15s var(--ease);
}
.q-tile:hover {
  border-color: color-mix(in srgb, var(--royal) 40%, var(--line));
  box-shadow: var(--sh-2);
  transform: translateY(-2px);
}
.q-tile i {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--tint);
  color: var(--royal);
}
.q-tile i .ic {
  width: 20px;
  height: 20px;
}
.panel .tbl-scroll {
  overflow-x: auto;
  margin-inline: -8px;
}
.dash-t td {
  padding-block: 10px;
}
.dash-t .memo {
  color: var(--ink2);
  max-width: min(320px, 40vw);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rows {
  list-style: none;
  margin: 0;
  padding: 0;
}
.rows li {
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 9px 0;
  border-bottom: 1px solid var(--line2);
  font-size: 14px;
}
.rows li:last-child {
  border: 0;
}
.rows span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink2);
}
.rows small {
  color: var(--ink3);
  white-space: nowrap;
}
.rows li > a {
  white-space: nowrap;
  font-weight: 600;
  text-decoration: none;
}
.rows b {
  font-weight: 700;
  margin-inline-start: auto;
  white-space: nowrap;
}
.banner {
  padding: 10px 16px;
  border-radius: var(--r-s);
  margin-bottom: 14px;
  font-size: 14px;
}
.banner.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.banner.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
/* قوالب الدليل */
.tpl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.tpl {
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.tpl.on {
  border-color: var(--royal);
  box-shadow: 0 0 0 3px var(--tint);
}
.tpl header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tpl h3 {
  font-size: 16px;
}
.tpl-tops {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 4px;
  font-size: 13.5px;
}
.tpl-tops li {
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.tpl-tops b {
  font-family: var(--font-num);
  color: var(--royal);
  min-width: 14px;
}
.tpl-tops small {
  margin-inline-start: auto;
  color: var(--ink3);
}
.tpl .btn {
  margin-top: auto;
  align-self: flex-start;
}
/* جداول */
.tbl-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: var(--sh-1);
}
.tbl-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line2);
  align-items: center;
}
.tbl-q {
  max-width: 260px;
  min-height: 34px;
  padding: 5px 10px;
}
.mini {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--ink3);
}
.mini input,
.mini-s {
  width: auto;
  min-height: 34px;
  padding: 4px 8px;
}
.tbl-end {
  margin-inline-start: auto;
  display: flex;
  gap: 6px;
}
.tbl-box > .tbl-scroll {
  overflow: auto;
  max-height: calc(100dvh - 275px);
}
.modal .tbl-scroll {
  overflow-x: auto;
}
.sched {
  max-height: 320px;
  overflow: auto;
}
.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 14px;
}
.tbl th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--head);
  color: var(--ink2);
  font-weight: 600;
  text-align: right;
  padding: 10px 12px;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}
.tbl th.num {
  text-align: left;
}
th.sortable {
  cursor: pointer;
  user-select: none;
}
th.sortable:hover {
  color: var(--royal);
}
.tbl td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--line2);
  vertical-align: middle;
}
.tbl tbody tr:nth-child(even) td {
  background: var(--zebra);
}
.tbl tbody tr:last-child td {
  border-bottom: 0;
}
.tbl tbody tr:hover td {
  background: var(--hover);
}
.tbl tfoot th {
  position: sticky;
  bottom: 0;
  background: var(--head);
  border-top: 2px solid var(--line);
  border-bottom: 0;
}
.tbl tr.grp td {
  font-weight: 600;
}
.tbl td.acts {
  white-space: nowrap;
  text-align: left;
  width: 1%;
}
.tbl .empty {
  text-align: center;
  color: var(--ink3);
  padding: 34px 12px;
}
.empty .btn {
  margin-top: 10px;
}
.empty-ic {
  width: 54px;
  height: 54px;
  fill: none;
  stroke: var(--ink3);
  stroke-width: 1.5;
  opacity: 0.6;
  margin-bottom: 6px;
}
.thumb {
  width: 34px;
  height: 34px;
  object-fit: cover;
  border-radius: 6px;
}
.tbl.lines td {
  padding: 5px 6px;
  vertical-align: top;
}
.tbl.lines tbody tr:nth-child(even) td,
.tbl.lines tbody tr:hover td {
  background: none;
}
.tbl.lines select {
  min-width: 170px;
}
.tbl.lines input.num {
  min-width: 84px;
}
.tbl.pay input.num {
  min-width: 90px;
}
.avail {
  display: block;
  color: var(--ink3);
  font-size: 11.5px;
  margin-top: 2px;
}
.matrix td,
.matrix th {
  text-align: center;
}
.matrix td:first-child,
.matrix th:first-child {
  text-align: right;
  white-space: nowrap;
}
.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 8px;
  font-size: 13px;
  color: var(--ink2);
  border-top: 1px solid var(--line2);
}
.tag {
  display: inline-block;
  padding: 1px 10px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
}
.tag.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.tag.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
.tag.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.tag.muted {
  background: var(--line2);
  color: var(--ink2);
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 12px;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-1);
}
.filters .fld {
  width: 190px;
}
.op-info {
  font-size: 14px;
  padding-bottom: 8px;
}
.back {
  font-size: 13.5px;
  display: inline-block;
  margin-bottom: 8px;
}
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
  overflow-x: auto;
}
.tabs button {
  background: none;
  border: 0;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--ink2);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tabs button.on {
  color: var(--royal);
  border-color: var(--gold);
  font-weight: 600;
}
.rep-groups {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.rep-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 18px;
  box-shadow: var(--sh-1);
}
.rep-groups h2 {
  font-size: 15.5px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--gold);
  margin-bottom: 6px;
}
.rep-groups a {
  display: block;
  padding: 6px 0;
  text-decoration: none;
  border-bottom: 1px solid var(--line2);
  color: var(--ink);
}
.rep-groups a:hover {
  color: var(--royal);
}
.empty-page {
  text-align: center;
  padding: 48px 12px;
  color: var(--ink2);
}
.empty-page .btn {
  margin-top: 12px;
}
/* نوافذ */
.modal-wrap {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 58, 0.5);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 4vh 12px;
  z-index: 50;
  overflow: auto;
  perspective: 1200px;
}
.modal {
  background: var(--card);
  border-radius: var(--r-l);
  width: min(520px, 100%);
  display: flex;
  flex-direction: column;
  max-height: 92vh;
  box-shadow: var(--sh-3);
  border: 1px solid var(--line);
  animation: modalIn 0.2s var(--ease);
}
@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(14px) rotateX(-5deg) scale(0.985);
  }
}
.modal.wide {
  width: min(1040px, 100%);
}
.modal header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
}
.modal h3 {
  font-size: 17px;
}
.modal-body {
  padding: 16px 18px;
  overflow: auto;
  flex: 1;
}
.modal footer {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 18px;
  border-top: 1px solid var(--line);
  background: var(--card2);
  border-radius: 0 0 var(--r-l) var(--r-l);
}
.meta {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin: 0 0 12px;
}
.meta dt {
  font-size: 12.5px;
  color: var(--ink3);
}
.meta dd {
  margin: 0;
  font-weight: 500;
}
.keys {
  margin: 0;
}
.keys div {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--line2);
}
.keys dd {
  margin: 0;
}
kbd {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 8px;
  font: 13px var(--font);
  direction: ltr;
  display: inline-block;
}
.doc-tot {
  display: flex;
  gap: 24px;
  justify-content: space-between;
  margin: 12px 0;
  flex-wrap: wrap;
}
.doc-tot > div:first-child {
  flex: 1;
  min-width: 220px;
  display: grid;
  gap: 10px;
  align-content: start;
  max-width: 340px;
}
.doc-tot dl {
  margin: 0;
  width: 300px;
  max-width: 100%;
}
.doc-tot dl div {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 14px;
}
.doc-tot dd {
  margin: 0;
  font-variant-numeric: tabular-nums;
  direction: ltr;
}
.doc-tot .grand {
  border-top: 2px solid var(--ink);
  font-weight: 700;
  font-size: 16px;
  margin-top: 4px;
  padding-top: 6px;
}
.je-tot {
  margin: 10px 0;
  padding: 8px 12px;
  border-radius: var(--r-s);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.je-tot.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.je-tot.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.bar {
  margin-bottom: 10px;
  max-width: 340px;
}
.hint-box {
  background: var(--line2);
  padding: 8px 12px;
  border-radius: var(--r-s);
  font-size: 13.5px;
  margin-bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.doc-links {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 14px;
  margin-top: 10px;
}
.att {
  font-size: 14px;
  margin-top: 8px;
}
.alloc {
  margin-top: 12px;
}
.alloc summary {
  cursor: pointer;
  color: var(--royal);
  margin-bottom: 8px;
}
.notif {
  list-style: none;
  margin: 0;
  padding: 0;
}
.notif li {
  padding: 8px 10px;
  border-inline-start: 3px solid var(--line);
  margin-bottom: 6px;
  background: var(--card2);
  border-radius: 6px;
}
.notif li.bad {
  border-color: var(--bad);
}
.notif li.warn {
  border-color: var(--warn);
}
.checks {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.checks li {
  display: flex;
  gap: 10px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line2);
  align-items: baseline;
  flex-wrap: wrap;
}
.checks li:last-child {
  border: 0;
}
.checks b {
  width: 20px;
}
.checks .ok b {
  color: var(--ok);
}
.checks .bad b {
  color: var(--bad);
}
.checks small {
  color: var(--ink3);
  margin-inline-start: auto;
  font-variant-numeric: tabular-nums;
}
.settings {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.num-grid {
  display: grid;
  gap: 6px;
}
.num-grid > div {
  display: grid;
  grid-template-columns: 1fr 90px 90px;
  gap: 6px;
  align-items: center;
  font-size: 14px;
}
.link-row {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}
.imp {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}
.imp > div {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 10px;
  background: var(--card2);
  border-radius: var(--r-s);
}
.imp strong {
  width: 100%;
}
.imp .btn {
  margin: 0;
}
#toasts {
  position: fixed;
  bottom: 18px;
  inset-inline-start: 18px;
  z-index: 150;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(420px, calc(100vw - 36px));
}
.toast {
  background: var(--ok);
  color: #fff;
  padding: 10px 16px;
  border-radius: 10px;
  box-shadow: var(--sh-3);
  font-size: 14.5px;
  animation: spUp 0.22s var(--ease);
}
:root[data-theme='dark'] .toast {
  color: #08231a;
}
.toast.err {
  background: #c5322a;
  color: #fff;
}
.toast.warn {
  background: #b86a12;
  color: #fff;
}
#busybar {
  position: fixed;
  top: 0;
  inset-inline: 0;
  height: 3px;
  z-index: 160;
  background: linear-gradient(90deg, var(--teal), var(--gold));
  transform: scaleX(0);
  transform-origin: right;
}
.busy #busybar {
  animation: busy 1s ease-in-out infinite;
}
@keyframes busy {
  0% {
    transform: scaleX(0);
  }
  60% {
    transform: scaleX(0.8);
  }
  100% {
    transform: scaleX(1);
    opacity: 0.3;
  }
}
.banner.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
.ro-tag {
  background: var(--warn);
  color: #fff;
  border-radius: 99px;
  padding: 2px 10px;
  font-size: 12.5px;
  white-space: nowrap;
}
.chain {
  list-style: none;
  margin: 0;
  padding: 0;
}
.chain li {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  padding: 7px 10px;
  border-inline-start: 3px solid var(--gold);
  background: var(--card2);
  margin-bottom: 6px;
  border-radius: 6px;
}
.chain b {
  margin-inline-start: auto;
}
.je-in {
  margin-top: 12px;
}
.je-in summary {
  cursor: pointer;
  color: var(--link);
  margin-bottom: 8px;
}
.lot-b {
  display: block;
  font-size: 12px;
  margin-top: 3px;
}
.unit-s {
  margin-top: 4px;
  min-height: 30px !important;
  padding: 2px 6px !important;
  font-size: 13px;
}
.pr-qr {
  margin-bottom: 6px;
}
.pr-qr svg {
  display: block;
}
.th-c .pr-qr {
  display: flex;
  justify-content: center;
  margin: 4px 0;
}
.skeleton {
  display: grid;
  gap: 12px;
  padding: 8px;
}
.skeleton i {
  height: 26px;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--line2), var(--card2), var(--line2));
  background-size: 200% 100%;
  animation: skel 1s linear infinite;
}
.skeleton i:first-child {
  height: 44px;
  width: 40%;
}
@keyframes skel {
  to {
    background-position: -200% 0;
  }
}
/* طباعة و PDF: ألوان ثابتة في كل الأوضاع */
#print-root {
  display: none;
}
.pdf-host {
  position: fixed;
  inset-inline-start: -10000px;
  top: 0;
  width: 794px;
  background: #fff;
}
.doc-print {
  --ink: #111;
  --ink2: #333;
  --ink3: #555;
  --line: #bbb;
  --line2: #ddd;
  --head: #e8ebfa;
  --zebra: #fff;
  --hover: #fff;
  --card: #fff;
  --ok: #111;
  --ok-bg: #fff;
  --warn: #111;
  --warn-bg: #fff;
  --bad: #111;
  --bad-bg: #fff;
  background: #fff;
  color: #111;
  padding: 8px 4px;
  font: 13.5px/1.55 var(--font);
  width: 794px;
  direction: rtl;
}
.doc-print .tbl-box {
  border: 0;
  border-radius: 0;
  overflow: visible;
  box-shadow: none;
}
.doc-print .tbl-box > .tbl-scroll,
.doc-print .tbl-scroll {
  overflow: visible;
  max-height: none;
}
.doc-print .tbl {
  font-size: 12.5px;
  border-collapse: collapse;
}
.doc-print .tbl th {
  position: static;
  white-space: normal;
  padding: 6px 8px;
  border: 1px solid #bbb;
}
.doc-print .tbl td,
.doc-print .tbl tbody tr:last-child td {
  padding: 5px 8px;
  border: 1px solid #ccc;
}
.doc-print a {
  color: inherit;
  text-decoration: none;
}
.doc-print .btn,
.doc-print button {
  display: none;
}
.doc-print .tag {
  padding: 0;
}
.pr-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 3px solid #151b66;
  padding-bottom: 10px;
  margin-bottom: 12px;
}
.pr-head img {
  max-height: 56px;
  display: block;
  margin-bottom: 4px;
}
.pr-head strong {
  display: block;
  font-size: 17px;
  color: #151b66;
}
.pr-head small {
  display: block;
  color: #333;
}
.pr-title {
  text-align: left;
}
.pr-title h2 {
  font-size: 20px;
  color: #151b66;
}
.pr-party {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 22px;
  margin-bottom: 10px;
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
}
.signs {
  display: flex;
  justify-content: space-between;
  margin-top: 40px;
  font-size: 13px;
}
.pr-foot {
  margin-top: 18px;
  text-align: center;
  color: #444;
  font-size: 12.5px;
  border-top: 1px solid #bbb;
  padding-top: 6px;
}
.doc-print.thermal {
  width: 72mm;
  font-size: 11.5px;
  padding: 0;
}
.th-c {
  text-align: center;
  display: flex;
  flex-direction: column;
  margin-bottom: 6px;
}
.th-c strong {
  font-size: 14px;
}
.th-c b {
  margin-top: 3px;
}
.th-t {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.th-t th,
.th-t td {
  padding: 2px 1px;
  border-bottom: 1px dashed #777;
  text-align: right;
}
.th-t td:last-child,
.th-t th:last-child {
  text-align: left;
  direction: ltr;
}
.th-s {
  margin: 6px 0;
}
.th-s div {
  display: flex;
  justify-content: space-between;
}
.th-s dd {
  margin: 0;
}
.th-s .g {
  font-weight: 700;
  font-size: 13px;
  border-top: 1px solid #000;
  margin-top: 3px;
  padding-top: 3px;
}
@media print {
  body.printing > *:not(#print-root) {
    display: none !important;
  }
  body.printing {
    background: #fff;
    overflow: visible;
    height: auto;
  }
  body.printing #print-root {
    display: block;
  }
  .doc-print {
    width: auto;
  }
  .doc-print.thermal {
    width: 72mm;
  }
  html,
  body {
    height: auto;
  }
  tr {
    break-inside: avoid;
  }
}
/* استجابة */
@media (max-width: 1440px) {
  .co,
  #clock {
    display: none;
  }
  .dash-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 1200px) {
  .scale span,
  .u-t {
    display: none;
  }
  .kpi-grid,
  .kpis,
  .kpi-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .kpi-inv {
    grid-column: 1 / -1;
  }
  .rep-groups {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 900px) {
  #app,
  [data-nav='mini'] #app {
    --top-h: 60px;
    grid-template-columns: minmax(0, 1fr);
  }
  #top {
    grid-column: 1;
    padding-inline: max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-left, 0px));
    gap: 6px;
  }
  #main {
    grid-column: 1;
    padding-block: 18px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #side {
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    width: 286px;
    z-index: 40;
    transform: translateX(100%);
    transition: transform 0.2s var(--ease);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .side-open #side {
    transform: none;
    box-shadow: 0 0 0 100vmax rgba(7, 10, 46, 0.55);
  }
  .menu {
    display: inline-grid;
  }
  .brand {
    display: flex;
  }
  .brand span,
  .br-sel .ic,
  .user,
  .scale {
    display: none;
  }
  .br-sel {
    padding: 0 4px;
  }
  .br-sel select {
    max-width: 92px;
  }
  .search kbd {
    display: none;
  }
  .search input {
    padding-inline-end: 12px;
  }
  .side-note {
    display: block;
    font-size: 12px;
    color: #7d88d6;
    padding: 0 12px;
  }
  .side-toggle {
    display: none;
  }
  .dash-grid,
  .settings {
    grid-template-columns: minmax(0, 1fr);
  }
  .span2 {
    grid-column: auto;
  }
  .kpi strong {
    font-size: 20px;
  }
  .kpi.sm strong {
    font-size: 15.5px;
  }
  .login-wrap {
    grid-template-columns: minmax(0, 1fr);
    min-height: 0;
  }
  .login-art {
    display: none;
  }
  .login-logo {
    display: flex;
  }
  .login-box {
    padding: 32px 24px 26px;
  }
  .filters .fld {
    width: calc(50% - 6px);
  }
  .tbl-box > .tbl-scroll {
    max-height: none;
  }
  .tbl-box > .tbl-scroll > .tbl:not(.rep):not(.matrix) thead {
    display: none;
  }
  .tbl-box > .tbl-scroll > .tbl:not(.rep):not(.matrix) tr {
    display: block;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .tbl-box > .tbl-scroll > .tbl:not(.rep):not(.matrix) td {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    border: 0;
    padding: 3px 0;
    background: none !important;
    width: auto;
  }
  .tbl-box > .tbl-scroll > .tbl:not(.rep):not(.matrix) td[data-l]::before {
    content: attr(data-l);
    color: var(--ink3);
    font-size: 13px;
  }
  .tbl-box > .tbl-scroll > .tbl:not(.rep):not(.matrix) td[data-l='']::before {
    content: none;
  }
  .tbl .empty {
    display: block !important;
  }
  .ia {
    width: 38px;
    height: 38px;
  }
  .tbl.lines thead {
    display: none;
  }
  .tbl.lines tr {
    display: block;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .tbl.lines td {
    display: block;
    border: 0;
  }
  .tbl.lines td[data-l]::before {
    content: attr(data-l);
    display: block;
    font-size: 12.5px;
    color: var(--ink3);
  }
  .tbl.lines select {
    min-width: 0;
  }
  .modal-wrap {
    padding: 0;
  }
  .modal {
    max-height: 100dvh;
    height: 100dvh;
    border-radius: 0;
  }
  .modal-wrap .modal:not(.wide) {
    height: auto;
    max-height: 100dvh;
    margin: auto 12px;
    border-radius: var(--r);
  }
  .modal footer {
    border-radius: 0;
  }
  .doc-tot {
    flex-direction: column;
  }
  .doc-tot dl {
    width: 100%;
  }
  .doc-tot > div:first-child {
    max-width: none;
  }
  .tbl-end {
    margin-inline-start: 0;
  }
}
@media (max-width: 520px) {
  .kpi-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .dash-hero h1 {
    font-size: 24px;
  }
  .head-tools {
    width: 100%;
  }
  .page-head {
    align-items: stretch;
  }
  .rep-groups {
    grid-template-columns: 1fr;
  }
  .filters .fld {
    width: 100%;
  }
  .search {
    min-width: 60px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  .kpi,
  .q-tile {
    transform: none !important;
  }
}

.exp-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.imp-help {
  width: 100%;
  color: var(--ink3);
  font-size: 12.5px;
  line-height: 1.5;
}
.imp .chk,
.imp .mini {
  width: 100%;
}

/* ===== هوية فلوريكس: الكلمة الشعارية والتدرج ===== */
.la-brand b,
.login-logo b,
.side-brand b,
.sp-stage h1 {
  font-family: var(--font-num);
  font-weight: 800;
  letter-spacing: 0.02em;
}
.la-brand b em,
.login-logo b em,
.side-brand b em,
.sp-stage h1 span,
.brand b {
  font-style: normal;
  background: linear-gradient(90deg, #4f6bff, #c13cf5);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.la-brand i,
.login-logo i,
.side-brand i {
  font-family: var(--font-head);
  letter-spacing: 0;
  font-weight: 700;
  color: #a9b4ff;
  display: flex;
  align-items: center;
  gap: 6px;
}
.la-brand i::before,
.la-brand i::after,
.login-logo i::before,
.login-logo i::after,
.side-brand i::before,
.side-brand i::after {
  content: '';
  width: 14px;
  height: 2px;
  border-radius: 2px;
  background: var(--grad-fx);
}
.login-logo i {
  color: var(--ink3);
}
.sp-stage p {
  font-family: var(--font-num);
  letter-spacing: 0.04em;
}

/* ===== أشكال فلوريكس: التدرج، الشريط الترحيبي، الأزرار ===== */
:root {
  --r: 16px;
  --r-l: 20px;
}
.btn.primary {
  background: linear-gradient(120deg, #1f8cff, #2a4bf5 45%, #7a2cf0);
  border-color: transparent;
  box-shadow: 0 8px 20px -6px rgba(106, 44, 240, 0.5);
}
.btn.primary:hover {
  background: linear-gradient(120deg, #1a7df0, #1d36d6 45%, #6a2cf0);
  border-color: transparent;
}
.nav-l.on {
  background: var(--grad-fx);
  box-shadow: 0 10px 24px -8px rgba(106, 44, 240, 0.7);
}
#top::after {
  content: '';
  position: absolute;
  inset: auto 0 -1px 0;
  height: 2px;
  background: var(--grad-fx);
  opacity: 0.8;
}
.page-head h1 {
  display: flex;
  align-items: center;
  gap: 10px;
}
.page-head h1::before {
  content: '';
  flex: none;
  width: 6px;
  height: 26px;
  border-radius: 6px;
  background: var(--grad-fx);
}
.dash-hero {
  position: relative;
  overflow: hidden;
  align-items: center;
  padding: 26px 28px;
  border-radius: 22px;
  color: #fff;
  background:
    radial-gradient(520px 260px at 0% 130%, rgba(176, 16, 226, 0.75), transparent 60%),
    radial-gradient(520px 300px at 100% -40%, rgba(18, 211, 245, 0.7), transparent 60%),
    linear-gradient(120deg, #0b1160, #2a4bf5 68%, #6a2cf0);
  box-shadow: 0 18px 40px -12px rgba(42, 75, 245, 0.45);
}
.dash-hero::before,
.dash-hero::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.13);
  pointer-events: none;
}
.dash-hero::before {
  width: 900px;
  height: 300px;
  inset-inline-start: -200px;
  bottom: -200px;
  transform: rotate(-6deg);
}
.dash-hero::after {
  width: 700px;
  height: 260px;
  inset-inline-start: -80px;
  bottom: -190px;
  transform: rotate(-10deg);
  border-color: rgba(18, 211, 245, 0.25);
}
.dash-hero > div {
  position: relative;
  z-index: 1;
  flex: 1;
  min-width: 220px;
}
.dash-hero .hero-mark {
  width: 74px;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.3));
}
.dash-hero .eyebrow {
  color: #7ee8ff;
}
.dash-hero h1 {
  color: #fff;
}
.dash-hero .muted {
  color: #d5dcff !important;
}
.dash-hero .btn {
  position: relative;
  z-index: 1;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.28);
  backdrop-filter: blur(4px);
}
.dash-hero .btn.primary {
  background: #fff;
  color: #0b1160;
  border-color: #fff;
}
.dash-hero .btn .ic {
  color: inherit;
}
.login-art h2 em {
  background: linear-gradient(90deg, #12d3f5, #6a8bff 50%, #c13cf5);
  -webkit-background-clip: text;
  background-clip: text;
}
.panel {
  border-radius: var(--r-l);
}
@media (max-width: 760px) {
  .dash-hero {
    padding: 20px;
  }
  .dash-hero .hero-mark {
    width: 52px;
  }
}

const normNum = s =>

    .trim()
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))

/* تحويل نص عشري إلى عدد صحيح بمقياس 10^p دون المرور بالفاصلة العائمة */
function scaled(v, p) {
  if (typeof v === 'number' && !Number.isFinite(v)) return NaN;
  const s = normNum(typeof v === 'number' ? v.toFixed(Math.min(p + 4, 20)) : v);
  if (s === '') return 0;
  const m = /^([+-]?)(\d*)(?:\.(\d*))?$/.exec(s);
  if (!m || (m[2] === '' && !m[3])) return NaN;
  const frac = m[3] || '',
    keep = frac.slice(0, p).padEnd(p, '0'),
    next = frac.charCodeAt(p) || 48;
  let n = BigInt((m[2] || '0') + keep);
  if (next >= 53) n += 1n;
  const r = Number(m[1] === '-' ? -n : n);
  return Number.isSafeInteger(r) ? r : NaN;
}
const toMinor = v => scaled(v, 2); // هللات

  return (neg ? '-' : '') + i + (p ? '.' + d : '');
};

function mulDiv(a, b, c) {

function allocate(total, weights) {
  const W = weights.reduce((a, b) => a + Math.max(b, 0), 0);
  const n = weights.length;
  if (!n) return [];
  if (!W) {
    const r = new Array(n).fill(0);
    r[0] = total;
    return r;
  }
  const sign = total < 0 ? -1n : 1n,
    T = BigInt(Math.abs(total)),
    big = BigInt(W);
  const res = weights.map(w => (BigInt(Math.max(w, 0)) * T) / big);
  const rem = weights
    .map((w, i) => ({ i, r: (BigInt(Math.max(w, 0)) * T) % big }))
    .sort((a, b) => (a.r < b.r ? 1 : a.r > b.r ? -1 : a.i - b.i));
  let left = T - res.reduce((a, b) => a + b, 0n);

  const w = new Int32Array(64),
    r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < m.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15],
        c = w[i - 2];
      w[i] =
        (w[i - 16] + (r(a, 7) ^ r(a, 18) ^ (a >>> 3)) + w[i - 7] + (r(c, 17) ^ r(c, 19) ^ (c >>> 10))) | 0;
    }
    let [a, b2, c, d, e, f, g, h2] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h2 + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0,
        t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
      h2 = g;
      g = f;
      f = e;
      e = (d + t1) | 0;
      d = c;
      c = b2;
      b2 = a;
      a = (t1 + t2) | 0;
    }
    [a, b2, c, d, e, f, g, h2].forEach((v, i) => (H[i] = (H[i] + v) | 0));
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
function hashPw(pw, salt) {
  let x = salt + ':' + pw;
  for (let i = 0; i < 500; i++) x = sha256(x + salt);
  return x;
}

/* قالب HTML آمن: كل قيمة تُهرَّب تلقائيًا ما لم تكن Safe */
class Safe {
  constructor(s) {
    this.s = s;
  }
  toString() {
    return this.s;
  }
}
const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
  );
const val2 = v =>
  v == null || v === false || v === true
    ? ''
    : v instanceof Safe
      ? v.s
      : Array.isArray(v)
        ? v.map(val2).join('')
        : esc(v);
const h = (st, ...vs) => new Safe(st.reduce((o, s, i) => o + s + (i < vs.length ? val2(vs[i]) : ''), ''));
const raw = s => new Safe(String(s));
const $ = (s, r = document) => r.querySelector(s),
  $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ===== 01-db: مخزن في الذاكرة مع معاملات ذرية وحفظ متسلسل في IndexedDB =====
   كل عملية تُنفَّذ داخل tx(): عند أي خطأ تُسترجع الحالة كاملة (عدادات، قيود، مخزون)
   وعند النجاح تُكتب كل التغييرات في معاملة IndexedDB واحدة. */
const STORES = [
  'meta',
  'users',
  'roles',
  'branches',
  'warehouses',
  'costCenters',
  'accounts',
  'journals',
  'customers',
  'suppliers',
  'items',
  'categories',
  'stockBal',
  'stockMoves',
  'stockDocs',
  'docs',
  'vouchers',
  'cashAccounts',
  'transfers',
  'recons',
  'assets',
  'finDocs',
  'recurring',
  'audit',
  'lots'
];
const DB = (() => {
  const S = {};
  STORES.forEach(s => (S[s] = new Map()));
  let idb = null,
    cur = null,
    queue = Promise.resolve(),
    sandboxed = false,
    chan = null,
    onExt = null,
    lastErr = null,
    ver = 0,
    readOnly = false,
    onRW = null;
  const open = () =>
    new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB غير متاح'));
      const r = indexedDB.open(APP.dbName, 2);
      r.onupgradeneeded = () =>
        STORES.forEach(s => {
          if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' });
        });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('قاعدة البيانات محجوبة بتبويب آخر'));
    });
  const load = () =>
    new Promise((res, rej) => {
      const t = idb.transaction(STORES);
      let n = STORES.length;
      STORES.forEach(s => {
        const q = t.objectStore(s).getAll();
        q.onsuccess = () => {
          S[s].clear();
          q.result.forEach(o => S[s].set(o.id, o));
          if (!--n) res();
        };
        q.onerror = () => rej(q.error);
      });
    });
  async function init() {
    idb = await open();
    await load();
    /* كاتب واحد: أول تبويب يملك القفل، وأي تبويب آخر للقراءة حتى يتحرر القفل */
    if (navigator.locks) {
      await new Promise(res => {
        navigator.locks.request('namaa-writer', { ifAvailable: true }, lock => {
          if (lock) {
            readOnly = false;
            res();
            return new Promise(() => {});
          }
          readOnly = true;
          res();
          navigator.locks.request('namaa-writer', async () => {
            await load();
            ver++;
            readOnly = false;
            onRW && onRW();
            return new Promise(() => {});
          });
        });
      });
    }
    try {
      chan = new BroadcastChannel('namaa-sync');
      chan.onmessage = async () => {
        await load();
        ver++;
        onExt && onExt();
      };
    } catch (e) {}
  }
  function write(sets, dels, wipe) {
    if (!idb) return;
    queue = queue
      .then(
        () =>
          new Promise((res, rej) => {
            const t = idb.transaction(STORES, 'readwrite');
            if (wipe) STORES.forEach(s => t.objectStore(s).clear());
            sets.forEach(([s, o]) => t.objectStore(s).put(o));
            dels.forEach(([s, id]) => t.objectStore(s).delete(id));
            t.oncomplete = () => {
              try {
                chan && chan.postMessage(1);
              } catch (e) {}
              res();
            };
            t.onerror = t.onabort = () => rej(t.error || new Error('تعذر الحفظ'));
          })
      )
      .catch(e => {
        lastErr = e;
        window.dispatchEvent(new CustomEvent('namaa-dberror', { detail: e }));
      });
    return queue;
  }
  const get = (s, id) => S[s].get(id),
    all = s => [...S[s].values()],
    has = (s, id) => S[s].has(id);
  function touch(s, id) {
    ver++;
    const k = s + '\u0000' + id;
    if (!cur) throw new Error('كتابة خارج معاملة');
    if (!cur.undo.has(k)) cur.undo.set(k, [s, id, clone(S[s].get(id))]);
  }
  function put(s, o) {
    if (!o.id) o.id = uid();
    touch(s, o.id);
    S[s].set(o.id, o);
    return o;
  }
  function mut(s, id) {
    const o = S[s].get(id);
    if (!o) fail('السجل غير موجود');
    touch(s, id);
    return o;
  }
  function del(s, id) {
    touch(s, id);
    S[s].delete(id);
  }
  function tx(label, fn) {
    if (cur) return fn();
    if (readOnly && !sandboxed) fail('هذا التبويب للقراءة فقط لأن النظام مفتوح في تبويب آخر');
    cur = { undo: new Map() };
    try {
      const r = fn();
      const c = cur;
      cur = null;
      if (!sandboxed) {
        const sets = [],
          dels = [];
        c.undo.forEach(([s, id]) => {
          const o = S[s].get(id);
          o ? sets.push([s, clone(o)]) : dels.push([s, id]);
        });
        write(sets, dels);
      }
      return r;
    } catch (e) {
      cur.undo.forEach(([s, id, prev]) => {
        prev === undefined ? S[s].delete(id) : S[s].set(id, prev);
      });
      cur = null;
      ver++;
      throw e;
    }
  }
  /* تشغيل سيناريو كامل على نسخة مؤقتة ثم استعادة البيانات دون أي كتابة دائمة */
  function sandbox(fn, empty) {
    const snap = {};
    STORES.forEach(s => {
      snap[s] = S[s];
      S[s] = new Map();
      if (!empty) snap[s].forEach((o, k) => S[s].set(k, clone(o)));
    });
    const was = sandboxed;
    sandboxed = true;
    ver++;
    try {
      return fn();
    } finally {
      STORES.forEach(s => (S[s] = snap[s]));
      sandboxed = was;
      ver++;
    }
  }
  /* يملأ المخازن من نسخة داخل sandbox لفحصها دون لمس البيانات الحية */
  function loadInto(data) {
    STORES.forEach(s => {
      S[s].clear();
      (data[s] || []).forEach(o => S[s].set(o.id, o));
    });
    ver++;
  }
  function exportAll() {
    const o = {};
    STORES.forEach(s => (o[s] = all(s)));
    return o;
  }
  async function replaceAll(data) {
    if (readOnly) fail('هذا التبويب للقراءة فقط');
    loadInto(data);
    const sets = [];
    STORES.forEach(s => S[s].forEach(o => sets.push([s, o])));
    write(sets, [], true);
    await queue;
    if (lastErr) throw lastErr;
  }
  const flush = async () => {
    await queue;
    if (lastErr) {
      const e = lastErr;
      lastErr = null;
      throw e;
    }
  };
  return {
    init,
    get,
    all,
    has,
    put,
    mut,
    del,
    tx,
    sandbox,
    loadInto,
    exportAll,
    replaceAll,
    flush,
    load,
    onExternal: f => (onExt = f),
    onWritable: f => (onRW = f),
    ver: () => ver,
    isReadOnly: () => readOnly
  };
})();

/* تخزين مؤقت يبطل تلقائيًا مع أي تغيير؛ النتائج تُعامل كقراءة فقط */
const cached = (() => {
  const c = new Map();
  let v = -1;
  return (k, f) => {
    if (v !== DB.ver()) {
      c.clear();
      v = DB.ver();
    }
    if (!c.has(k)) c.set(k, f());
    return c.get(k);
  };
})();

function seedChart(rows, st) {
  st.mapping = {};
  rows.forEach(([code, name, type, nature, grp, key, control]) => {
    const parent = rows
      .filter(c => code.startsWith(c[0]) && c[0] !== code)
      .sort((a, b) => b[0].length - a[0].length)[0];
    DB.put('accounts', {
      id: 'a' + code,
      code,
      name,
      parentId: parent ? 'a' + parent[0] : '',
      type,
      nature,
      group: !!grp,
      currency: st.baseCur || 'SAR',
      ccId: '',
      active: true,
      control: control || '',
      sys: !!key
    });
    if (key) st.mapping[key] = 'a' + code;
  });
}

/* دمج الأسطر المتطابقة وتحويل السالب إلى الطرف المقابل */
function normLines(lines) {
  const m = new Map();
  lines.forEach(l => {
    const net = (l.debit || 0) - (l.credit || 0);
    if (!net && !l.keep) return;
    const k = [l.acc, l.cc || '', l.branch || '', l.partyId || '', l.due || '', l.memo || ''].join('|');
    const c = m.get(k);
    if (c) c.net += net;
    else m.set(k, { ...l, net });
  });
  return [...m.values()]
    .filter(l => l.net)
    .map(l => {
      const { net, keep, ...r } = l;
      return { ...r, id: uid(), debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0 };
    });
}
function validateLines(lines) {
  lines.forEach(l => {
    const a = checkAcc(l.acc);
    if (!Number.isSafeInteger(l.debit) || !Number.isSafeInteger(l.credit)) fail('مبلغ غير صالح في القيد');
    if (l.debit && l.credit) fail('لا يجوز أن يحمل السطر مدينًا ودائنًا معًا');
    if (a.control === 'customer' && (l.partyType !== 'customer' || !l.partyId))
      fail(`الحساب ${a.name} يتطلب تحديد العميل`);
    if (a.control === 'supplier' && (l.partyType !== 'supplier' || !l.partyId))
      fail(`الحساب ${a.name} يتطلب تحديد المورد`);
  });
  const d = sum(lines, l => l.debit),
    c = sum(lines, l => l.credit);
  if (lines.length < 2) fail('يجب أن يحتوي القيد على سطرين على الأقل');
  if (d !== c) fail(`القيد غير متوازن: المدين ${fm(d)} والدائن ${fm(c)}`);
  if (d <= 0) fail('إجمالي القيد يجب أن يكون أكبر من صفر');
}
/* القيد الآلي: معرفه مشتق من مصدره، فلا يمكن إنشاؤه مرتين لنفس الحدث */
function postAuto({ date, type = 'auto', source, ref = '', memo = '', lines, branch = '' }) {
  const key = `je:${source.type}:${source.id}:${source.event || 'post'}`;
  if (DB.has('journals', key)) fail(`تم إنشاء قيد لهذا المستند مسبقًا (${DB.get('journals', key).no})`);
  assertOpen(date);
  const L = normLines(lines.map(l => ({ ...l, branch: l.branch || branch })));
  validateLines(L);
  const j = {
    id: key,
    no: nextNo('je'),
    date,
    type,
    status: 'posted',
    source,
    ref,
    memo,
    notes: '',
    lines: L,
    createdBy: Auth.user?.username || 'النظام',
    createdAt: new Date().toISOString(),
    postedAt: new Date().toISOString()
  };
  DB.put('journals', j);
  return j;
}
function reverseJE(jeId, date, memo, extra = []) {
  const o = DB.mut('journals', jeId);
  if (o.status !== 'posted') fail('القيد غير مرحل');
  if (o.reversedBy) fail('سبق عكس هذا القيد');
  if (date < o.date) fail('تاريخ العكس يجب ألا يسبق تاريخ القيد الأصلي');
  const lines = o.lines
    .map(l => {
      const { id, ...r } = l;
      return { ...r, debit: l.credit, credit: l.debit, due: l.due ? date : undefined };
    })
    .concat(extra);
  const j = postAuto({
    date,
    type: 'reversal',
    source: { type: 'reversal', id: o.id, no: o.no, origin: o.source },
    ref: o.no,
    memo: memo || `عكس القيد ${o.no}`,
    lines
  });
  o.reversedBy = j.id;
  return j;
}

function saveJournal(d) {
  need('journal', d.id ? 'edit' : 'add');
  return DB.tx('je', () => {
    if (!isDate(d.date)) fail('حدد تاريخ القيد');
    if (!(d.memo || '').trim()) fail('أدخل بيان القيد');
    const lines = d.lines
      .filter(l => l.acc && (l.debit || l.credit))
      .map(l => ({
        id: l.id || uid(),
        acc: l.acc,
        cc: l.cc || '',
        branch: l.branch || '',
        memo: l.memo || '',
        debit: l.debit || 0,
        credit: l.credit || 0,
        partyType: l.partyType || '',
        partyId: l.partyId || ''
      }));
    if (lines.length < 2) fail('أدخل سطرين على الأقل');
    lines.forEach(l => {
      if (l.debit && l.credit) fail('لا يجوز أن يحمل السطر مدينًا ودائنًا معًا');
      if (l.debit < 0 || l.credit < 0) fail('المبالغ السالبة غير مسموحة');
    });
    let j;
    if (d.id) {
      j = DB.mut('journals', d.id);
      if (j.status !== 'draft') fail('لا يمكن تعديل قيد مرحل');
      if (j.type !== 'manual') fail('لا يمكن تعديل قيد آلي');
    } else
      j = DB.put('journals', {
        id: 'mj:' + uid(),
        no: nextNo('je'),
        type: 'manual',
        status: 'draft',
        source: { type: 'manual' },
        createdBy: Auth.user?.username || 'النظام',
        createdAt: new Date().toISOString()
      });
    Object.assign(j, {
      date: d.date,
      jtype: d.jtype || 'عام',
      ref: d.ref || '',
      memo: d.memo,
      notes: d.notes || '',
      lines,
      attachments: d.attachments || []
    });

/* ---- الأرصدة ---- */
const posted = () => cached('posted', () => DB.all('journals').filter(j => j.status === 'posted'));
const lineIdx = () =>
  cached('lineIdx', () => {
    const all = [],
      byParty = new Map(),
      byAcc = new Map();
    posted().forEach(j =>
      j.lines.forEach(l =>
        all.push({
          ...l,

          ref: j.ref,
          jtype: j.type,

    );

    all.forEach(l => {
      if (l.partyId) {
        (byParty.get(l.partyId) || byParty.set(l.partyId, []).get(l.partyId)).push(l);

/* ترتيب أسطر القيود زمنيًا ثم برقم القيد */
const byDateNo = (a, b) => cmp(a.date, b.date) || cmp(a.no, b.no);
/* أسطر القيود المرحّلة مع فلاتر اختيارية؛ يبدأ من أضيق فهرس متاح */
function linesOf({ from, to, acc: accId, accs, cc, branch, partyType, partyId, noClosing } = {}) {
  const I = lineIdx();
  let base = I.all;
  if (partyId) base = I.byParty.get(partyId) || [];
  else if (accId) base = I.byAcc.get(accId) || [];
  else if (accs) base = accs.flatMap(a => I.byAcc.get(a) || []).sort(byDateNo);
  return base.filter(
    l =>
      !(
        (from && l.date < from) ||
        (to && l.date > to) ||
        (noClosing && l.jtype === 'closing') ||
        (accId && l.acc !== accId) ||
        (cc && l.cc !== cc) ||
        (branch && l.branch !== branch) ||
        (partyType && l.partyType !== partyType)
      )
  );
}
const childrenOf = id =>
  cached('kids', () => {
    const m = new Map();
    DB.all('accounts')
      .sort((a, b) => (a.code < b.code ? -1 : 1))
      .forEach(a => {
        if (a.parentId) (m.get(a.parentId) || m.set(a.parentId, []).get(a.parentId)).push(a);
      });

  }).get(id) || [];

function balances(f = {}) {
  /* يعيد لكل حساب مجموع المدين والدائن */
  return cached('bal:' + JSON.stringify(f), () => {
    const m = {};
    posted().forEach(j => {
      if ((f.from && j.date < f.from) || (f.to && j.date > f.to)) return;
      if (f.noClosing && j.type === 'closing') return;
      j.lines.forEach(l => {
        if (f.cc && l.cc !== f.cc) return;
        if (f.branch && l.branch !== f.branch) return;
        const x = m[l.acc] || (m[l.acc] = { d: 0, c: 0 });
        x.d += l.debit;
        x.c += l.credit;
      });
    });
    return m;
  });
}
const accBal = (id, f) => {
  const b = balances(f || {}),
    ids = leafIds(id);

}; /* مدين موجب */
const partyBal = (type, id, to) =>

/* إضافة فرع تحت حساب فرعي تحوّله إلى تجميعي، بشرط ألا يكون مستخدمًا */
function promoteParentToGroup(p) {
  if (!p || p.group) return;
  if (hasMoves(p.id)) fail('الحساب الأب عليه حركات ولا يمكن تحويله إلى تجميعي');

  DB.mut('accounts', p.id).group = true;
}
function assertNoCycle(p, id) {
  for (let x = p; x; x = x.parentId && DB.get('accounts', x.parentId))
    if (x.id === id) fail('لا يجوز جعل الحساب تابعًا لأحد فروعه');

  if (!d.group && childrenOf(a.id).length) fail('للحساب فروع ولا يمكن تحويله إلى فرعي');

function postOpeningParty(type, id) {
  const st = type === 'customer' ? 'customers' : 'suppliers',
    P = DB.mut(st, id),
    ctrl = acc(type === 'customer' ? 'ar' : 'ap'),
    off = acc('openingOffset');
  const signed = (P.opening || 0) * (type === 'customer' ? 1 : -1); /* العميل مدين، والمورد دائن */
  const prev = P.openingJE && DB.get('journals', P.openingJE);
  if (prev && !prev.reversedBy) {
    if (
      sum(
        prev.lines.filter(l => l.acc === ctrl),
        l => l.debit - l.credit
      ) === signed
    )
      return;
    reverseJE(prev.id, prev.date, 'تعديل رصيد افتتاحي');
    P.openingJE = '';
  }
  if (!signed) return;
  P.opVer = (P.opVer || 0) + 1;
  const date = P.openingDate || fyStart();
  const j = postAuto({
    date,
    type: 'opening',
    source: { type: 'opening-' + type, id, event: 'v' + P.opVer, no: P.code },
    ref: P.code,
    memo: `رصيد افتتاحي: ${P.name}`,
    lines: [
      {
        acc: ctrl,
        debit: signed > 0 ? signed : 0,
        credit: signed < 0 ? -signed : 0,
        partyType: type,
        partyId: id,
        due: date
      },
      { acc: off, debit: signed < 0 ? -signed : 0, credit: signed > 0 ? signed : 0 }
    ]
  });
  P.openingJE = j.id;
}
const fyStart = y => `${y || set().fiscalYear}-${set().fiscalStart}`;
const fyEnd = y => addDays(addMonths(fyStart(y), 12), -1);
function postOpeningGrid(entries, date) {
  need('accounts', 'approve');
  return DB.tx('open', () => {
    const off = acc('openingOffset'),
      rows = entries.filter(e => e.debit || e.credit);
    const st = DB.mut('meta', 'settings');
    const old = st.openingJE;
    if (old && DB.has('journals', old) && !DB.get('journals', old).reversedBy)
      reverseJE(old, DB.get('journals', old).date, 'استبدال الأرصدة الافتتاحية');
    const lines = rows.map(e => {
      const a = checkAcc(e.acc);
      if (a.control) fail(`رصيد ${a.name} يُسجَّل من بطاقته أو مستند المخزون`);
      return { acc: e.acc, debit: e.debit, credit: e.credit };
    });
    const net = sum(lines, l => l.debit - l.credit),
      offBal = accBal(off);
    if (offBal - net !== 0) fail(`الأرصدة الافتتاحية غير متوازنة بفرق ${fm(Math.abs(offBal - net))}`);
    if (net) lines.push({ acc: off, debit: net < 0 ? -net : 0, credit: net > 0 ? net : 0 });
    if (!lines.length) {
      st.openingJE = '';
      st.openingGrid = {};
      return null;
    }
    st.openingVer = (st.openingVer || 0) + 1;
    const j = postAuto({
      date,
      type: 'opening',
      source: { type: 'opening', id: 'grid', event: 'v' + st.openingVer, no: 'افتتاحي' },
      memo: 'الأرصدة الافتتاحية',
      lines
    });
    st.openingJE = j.id;
    st.openingGrid = Object.fromEntries(rows.map(e => [e.acc, { debit: e.debit, credit: e.credit }]));
    logA('اعتماد الأرصدة الافتتاحية', j.no);
    return j;
  });
}
