<style id="app-css">/* ===== نظام تصميم نماء ERP: الهوية الرسمية، وكل القيم من المتغيرات ===== */
:root {
  /* ألوان الهوية */
  --navy: #071b49;
  --navy2: #0b2d6b;
  --blue: #0878f9;
  --cyan: #00c6f0;
  --purple: #8a2be2;
  --teal: #00bfa6;
  --royal: #0878f9;
  --royal-d: #0662cc;
  --gold: #00c6f0;
  --grad-bc: linear-gradient(135deg, #0878f9, #00c6f0);
  --grad-bp: linear-gradient(135deg, #0878f9, #8a2be2);
  --grad-ne: linear-gradient(160deg, #071b49 0%, #0b2d6b 55%, #0a4fb4 100%);
  /* الأسطح والنصوص */
  --bg: #f5f7fa;
  --bg2: #eef2f7;
  --link: #0662cc;
  --card: #fff;
  --card2: #f8fafc;
  --glass: rgba(255, 255, 255, 0.86);
  --ink: #172b4d;
  --ink2: #475569;
  --ink3: #64748b;
  --line: #e2e8f0;
  --line2: #edf1f6;
  --zebra: #fbfcfe;
  --hover: #f0f6ff;
  --head: #f8fafc;
  --input: #fff;
  --tint: rgba(8, 120, 249, 0.09);
  /* حالات */
  --ok: #00a389;
  --ok-bg: #e0f7f3;
  --warn: #c27400;
  --warn-bg: #fff3df;
  --bad: #e5484d;
  --bad-bg: #fdecec;
  /* الرسوم */
  --chart1: #0878f9;
  --chart2: #00bfa6;
  --chart3: #8a2be2;
  --chart4: #a5b4cc;
  --chart5: #00c6f0;
  --chart6: #f5a524;
  /* المقاسات */
  --r-s: 10px;
  --r: 14px;
  --r-l: 18px;
  --sp: 16px;
  --side-w: 264px;
  --top-h: 68px;
  --sh-1: 0 1px 2px rgba(23, 43, 77, 0.04), 0 1px 3px rgba(23, 43, 77, 0.06);
  --sh-2: 0 8px 24px rgba(23, 43, 77, 0.08), 0 2px 6px rgba(23, 43, 77, 0.04);
  --sh-3: 0 24px 48px rgba(7, 27, 73, 0.18);
  --neu: 0 1px 2px rgba(23, 43, 77, 0.05);
  --neu-in: none;
  --font:
    'IBM Plex Sans Arabic', 'Cairo', 'Inter', 'Segoe UI', 'SF Arabic', 'Geeza Pro', 'Noto Sans Arabic',
    Tahoma, Arial, sans-serif;
  --font-head: 'Cairo', 'IBM Plex Sans Arabic', 'Segoe UI', 'Noto Sans Arabic', Tahoma, sans-serif;
  --font-num: 'Inter', 'Plus Jakarta Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}
:root[data-theme='dark'] {
  --royal: #3d97ff;
  --royal-d: #2584f5;
  --link: #7ab8ff;
  --bg: #050f2b;
  --bg2: #081638;
  --card: #0b1a3f;
  --card2: #0f2150;
  --glass: rgba(11, 26, 63, 0.88);
  --ink: #e8eef9;
  --ink2: #b3c0d8;
  --ink3: #8798b6;
  --line: #1c2f5c;
  --line2: #15264e;
  --zebra: #0d1d46;
  --hover: #13285a;
  --head: #0e1f4a;
  --input: #081638;
  --tint: rgba(61, 151, 255, 0.14);
  --ok: #2fd4b5;
  --ok-bg: #0b3a3d;
  --warn: #ffb547;
  --warn-bg: #3b2a10;
  --bad: #ff6b70;
  --bad-bg: #3f1622;
  --chart1: #3d97ff;
  --chart2: #2fd4b5;
  --chart3: #a96bf0;
  --chart4: #4a5f86;
  --chart5: #33d4f5;
  --chart6: #ffb547;
  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh-2: 0 8px 24px rgba(0, 0, 0, 0.35);
  --sh-3: 0 24px 48px rgba(0, 0, 0, 0.55);
  --neu: none;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  font: 15px/1.6 var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: var(--font-head);
  text-wrap: balance;
}
a {
  color: var(--link);
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
[hidden] {
  display: none !important;
}
.num,
td.num,
th.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  text-align: left;
  direction: ltr;
}
input.num {
  text-align: left;
}
:focus-visible {
  outline: 2px solid var(--royal);
  outline-offset: 2px;
}
/* أزرار */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  padding: 8px 16px;
  border-radius: var(--r-s);
  cursor: pointer;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  box-shadow: var(--neu);
  transition:
    background 0.15s,
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.15s var(--ease);
}
.btn .ic {
  width: 16px;
  height: 16px;
  stroke-width: 2.2;
}
.btn:hover {
  background: var(--card2);
  border-color: color-mix(in srgb, var(--royal) 35%, var(--line));
}
.btn:active {
  transform: translateY(1px);
}
.btn.sm {
  padding: 6px 12px;
  font-size: 13.5px;
}
.btn.lg {
  padding: 11px 18px;
  font-size: 15.5px;
}
.btn.primary {
  background: var(--royal);
  border-color: var(--royal);
  color: #fff;
  box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--royal) 70%, transparent);
}
.btn.primary:hover {
  background: var(--royal-d);
  border-color: var(--royal-d);
}
.btn.danger {
  background: var(--bad);
  border-color: var(--bad);
  color: #fff;
}
.btn.ghost-danger {
  color: var(--bad);
  border-color: color-mix(in srgb, var(--bad) 35%, transparent);
}
.btn.block {
  width: 100%;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}
.link {
  background: none;
  border: 0;
  color: var(--link);
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
}
.icon-btn {
  background: none;
  border: 0;
  cursor: pointer;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: inline-grid;
  place-items: center;
  font-size: 16px;
  color: var(--ink2);
  text-decoration: none;
  position: relative;
  transition:
    background 0.15s,
    color 0.15s;
}
.icon-btn:hover {
  background: var(--hover);
  color: var(--royal);
}
.icon-btn .ic {
  width: 20px;
  height: 20px;
}
.ia {
  width: 30px;
  height: 30px;
  display: inline-grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ink3);
  cursor: pointer;
  margin-inline-start: 2px;
  transition:
    background 0.12s,
    color 0.12s;
}
.ia svg {
  width: 17px;
  height: 17px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ia:hover {
  background: var(--tint);
  color: var(--royal);
}
.ia.danger:hover {
  background: var(--bad-bg);
  color: var(--bad);
}
/* حقول */
.fld {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.fld > span {
  font-size: 13px;
  color: var(--ink2);
  font-weight: 600;
}
.fld small {
  color: var(--ink3);
  font-size: 12px;
}
.req {
  color: var(--bad);
}
.fld input,
.fld select,
.fld textarea,
.lines input,
.lines select,
.tbl-q,
.num-grid input,
.mini input,
.mini-s {
  width: 100%;
  background: var(--input);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  padding: 8px 12px;
  min-height: 40px;
  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}
.fld input:hover,
.fld select:hover,
.fld textarea:hover {
  border-color: color-mix(in srgb, var(--royal) 30%, var(--line));
}
.fld input:focus,
.fld select:focus,
.fld textarea:focus,
.lines input:focus,
.lines select:focus,
.tbl-q:focus {
  outline: 0;
  border-color: var(--royal);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--royal) 18%, transparent);
}
.fld input[readonly],
.lines input[readonly] {
  background: var(--card2);
  color: var(--ink2);
}
.chk {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 14px;
}
.chk input {
  accent-color: var(--royal);
  width: 16px;
  height: 16px;
}
.chk.full,
.fld.full {
  grid-column: 1/-1;
}
.grid-form {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}
.form-actions {
  margin-top: 16px;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.img-fld img {
  max-height: 64px;
  display: block;
  margin-bottom: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
/* الافتتاحية والدخول */
#splash {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  background: var(--grad-ne);
  color: #fff;
  transition:
    opacity 0.4s,
    visibility 0.4s;
}
#splash.out {
  opacity: 0;
  visibility: hidden;
}
.sp-stage {
  text-align: center;
  animation: spIn 0.6s var(--ease);
}
.sp-stage img {
  width: 132px;
  filter: drop-shadow(0 18px 30px rgba(0, 198, 240, 0.35));
}
.sp-stage h1 {
  font-size: 40px;
  font-weight: 800;
  margin-top: 12px;
  line-height: 1.1;
}
.sp-stage h1 span {
  font-family: var(--font-num);
  color: var(--cyan);
  letter-spacing: 0.06em;
}
.sp-stage p {
  color: #b9c8e6;
  margin-top: 8px;
}
.sp-load {
  width: 160px;
  height: 3px;
  margin: 22px auto 0;
  background: rgba(255, 255, 255, 0.14);
  border-radius: 9px;
  overflow: hidden;
}
.sp-load i {
  display: block;
  height: 100%;
  width: 40%;
  background: var(--grad-bc);
  border-radius: 9px;
  animation: spLoad 1.1s var(--ease) infinite;
}
@keyframes spIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.96);
  }
}
@keyframes spLoad {
  from {
    transform: translateX(-260%);
  }
  to {
    transform: translateX(260%);
  }
}
#login {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(
      900px 500px at 100% 0%,
      color-mix(in srgb, var(--royal) 10%, transparent),
      transparent 60%
    ),
    var(--bg);
}
.login-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  width: min(1020px, 100%);
  min-height: 600px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--sh-3);
  overflow: hidden;
}
.login-art {
  position: relative;
  background: var(--grad-ne);
  color: #fff;
  padding: 44px 44px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
}
.login-art::before {
  content: '';
  position: absolute;
  width: 460px;
  height: 460px;

  bottom: -220px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0, 198, 240, 0.35), transparent);
}
.login-art::after {
  content: '';
  position: absolute;
  inset-inline: -10% -10%;
  bottom: 70px;
  height: 120px;
  border-top: 2px solid rgba(0, 198, 240, 0.35);
  border-radius: 50%;

}
.la-brand,
.login-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.la-brand img {
  width: 64px;
}
.la-brand span,
.login-logo span,
.side-brand span {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.la-brand b,
.login-logo b,
.side-brand b {
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 30px;
}
.la-brand i,
.login-logo i,
.side-brand i {
  font-style: normal;
  font-family: var(--font-num);
  font-weight: 800;
  letter-spacing: 0.16em;
  font-size: 15px;
  color: var(--cyan);
  margin-top: 4px;
}
.login-art h2 {
  font-size: 32px;
  font-weight: 800;
  line-height: 1.35;
  margin-top: 26px;
  position: relative;
}
.login-art h2 em {
  font-style: normal;
  background: var(--grad-bc);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.login-art > p {
  color: #b9c8e6;
  font-size: 15.5px;
}
.login-art ul {
  list-style: none;
  padding: 0;
  margin: 10px 0 0;
  display: grid;
  gap: 12px;
  position: relative;
}
.login-art li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 500;
}
.login-art li .ic {
  width: 22px;
  height: 22px;
  padding: 4px;
  border-radius: 50%;
  background: var(--grad-bc);
  color: #fff;
  stroke-width: 3;
}
.la-bars {
  direction: ltr;
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 92px;
  position: relative;
}
.la-bars u {
  width: 26px;
  border-radius: 7px 7px 2px 2px;
  background: linear-gradient(180deg, rgba(0, 198, 240, 0.85), rgba(8, 120, 249, 0.25));
}
.la-bars u:nth-child(1) {
  height: 28%;
}
.la-bars u:nth-child(2) {
  height: 44%;
}
.la-bars u:nth-child(3) {
  height: 58%;
}
.la-bars u:nth-child(4) {
  height: 78%;
}
.la-bars u:nth-child(5) {
  height: 100%;
}
.login-box {
  padding: 48px 48px 36px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  justify-content: center;
}
.login-logo {
  display: none;
}
.login-logo img {
  width: 52px;
}
.login-logo b {
  color: var(--navy);
  font-size: 26px;
}
:root[data-theme='dark'] .login-logo b {
  color: #fff;
}
.login-box h1 {
  font-size: 26px;
  font-weight: 800;
}
.login-box .sub {
  color: var(--ink3);
  margin-top: -8px;
  margin-bottom: 6px;
}
.pw {
  position: relative;
  display: block;
}
.pw input {
  padding-inline-end: 64px;
}
.pw .link {
  position: absolute;
  inset-inline-end: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  text-decoration: none;
  font-weight: 600;
}
.demo-note {
  background: var(--tint);
  border: 1px dashed color-mix(in srgb, var(--royal) 40%, transparent);
  padding: 10px 14px;
  border-radius: var(--r-s);
  font-size: 13.5px;
}
.fine {
  font-size: 12.5px;
  color: var(--ink3);
}
/* الهيكل: شريط جانبي داكن بكامل الارتفاع وشريط علوي فاتح */
#app {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  grid-template-rows: var(--top-h) minmax(0, 1fr);
  height: 100dvh;
  transition: grid-template-columns 0.2s var(--ease);
}
[data-nav='mini'] #app {
  --side-w: 80px;
}
.ic {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
/* الشريط العلوي */
#top {
  grid-column: 2;
  grid-row: 1;
  background: var(--glass);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 0;
  padding-inline: 24px;
  min-width: 0;
  z-index: 25;
  position: relative;
}
.brand {
  display: none;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  font-family: var(--font-head);
  font-size: 19px;
  font-weight: 800;
  white-space: nowrap;
  color: var(--navy);
}
:root[data-theme='dark'] .brand {
  color: #fff;
}
.brand img {
  height: 30px;
}
.brand b {
  font-family: var(--font-num);
  color: var(--royal);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.08em;
}
.search {
  position: relative;
  flex: 1;
  max-width: 460px;
  min-width: 80px;
}
.search > .ic {
  position: absolute;
  inset-inline-start: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink3);
  pointer-events: none;
}
.search input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--card2);
  border-radius: 12px;
  padding-block: 9px;
  padding-inline: 40px 42px;
  transition:
    border-color 0.15s,
    box-shadow 0.15s,
    background 0.15s;
}
.search input::placeholder {
  color: var(--ink3);
}
.search input:focus {
  outline: 0;
  background: var(--card);
  border-color: var(--royal);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--royal) 16%, transparent);
}
.search kbd {
  position: absolute;
  inset-inline-end: 10px;
  top: 50%;
  transform: translateY(-50%);
}
#gresults {
  position: absolute;
  top: calc(100% + 8px);
  inset-inline: 0;
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-3);
  z-index: 30;
  max-height: 380px;
  overflow: auto;
  padding: 6px;
}
#gresults a {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 9px;
  text-decoration: none;
  color: var(--ink);
}
#gresults a:hover {
  background: var(--hover);
}
#gresults small {
  color: var(--ink3);
}
#gresults p {
  padding: 10px 12px;
}
.top-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-inline-start: auto;
  min-width: 0;
}
.co {
  white-space: nowrap;
  overflow: hidden;
  max-width: 200px;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink2);
  padding-inline-end: 8px;
  margin-inline-end: 2px;
  border-inline-end: 1px solid var(--line);
}
.co img {
  height: 26px;
  border-radius: 6px;
}
.co strong {
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}
.br-sel {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 0 10px;
  height: 38px;
  color: var(--ink3);
  background: var(--card);
}
.br-sel select {
  border: 0;
  background: none;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  max-width: 150px;
  cursor: pointer;
}
.br-sel select:focus {
  outline: 0;
}
.br-sel:focus-within {
  border-color: var(--royal);
}
.scale {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  height: 34px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}
.scale.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.scale.bad {
  background: var(--bad);
  color: #fff;
}
#clock {
  font-size: 12.5px;
  color: var(--ink3);
  white-space: nowrap;
  padding-inline: 6px;
  font-variant-numeric: tabular-nums;
}
.bell b {
  position: absolute;
  top: 3px;
  inset-inline-end: 3px;
  background: var(--bad);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  min-width: 17px;
  height: 17px;
  line-height: 17px;
  border-radius: 9px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--card);
  font-family: var(--font-num);
}
.user {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 4px 6px 4px 10px;
  cursor: pointer;
  white-space: nowrap;
  line-height: 1.25;
  text-align: start;
  margin-inline-start: 4px;
}
.user:hover {
  background: var(--hover);
}
.av {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--grad-bp);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.02em;
}
.u-t strong {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
}
.u-t small {
  font-size: 12px;
  color: var(--ink3);
}
/* الشريط الجانبي */
#side {
  grid-column: 1;
  grid-row: 1 / 3;
  background:
    radial-gradient(420px 260px at 50% 0%, rgba(8, 120, 249, 0.22), transparent 70%),
    linear-gradient(180deg, #071b49, #061640);
  color: #b9c8e6;
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: 30;
  padding: 0 12px;
}
:root[data-theme='dark'] #side {
  background:
    radial-gradient(420px 260px at 50% 0%, rgba(8, 120, 249, 0.18), transparent 70%),
    linear-gradient(180deg, #040d28, #030a20);
  border-inline-end: 1px solid var(--line);
}
.side-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--top-h);
  padding: 0 8px;
  text-decoration: none;
  color: #fff;
  flex: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  margin-bottom: 10px;
}
.side-brand img {
  width: 44px;
  filter: drop-shadow(0 6px 14px rgba(0, 198, 240, 0.3));
}
.side-brand b {
  font-size: 23px;
}
.side-brand i {
  font-size: 12px;
}
#side nav {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 8px;
}
#side a {
  text-decoration: none;
  color: inherit;
}
.nav-l,
#side summary {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 11px;
  cursor: pointer;
  font-weight: 500;
  font-size: 14.5px;
  list-style: none;
  color: #b9c8e6;
  white-space: nowrap;
  transition:
    background 0.15s,
    color 0.15s;
}
.nav-l .ic,
#side summary .ic {
  width: 20px;
  height: 20px;
  opacity: 0.9;
}
#side summary::-webkit-details-marker {
  display: none;
}
#side summary::after {
  content: '';
  width: 6px;
  height: 6px;
  border: solid currentColor;
  border-width: 0 1.6px 1.6px 0;
  transform: rotate(135deg);
  margin-inline-start: auto;
  transition: transform 0.16s;
  opacity: 0.7;
}
#side details[open] > summary::after {
  transform: rotate(45deg);
}
.nav-l:hover,
#side summary:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
}
#side details.cur > summary {
  color: #fff;
}
#side details.cur > summary .ic {
  color: var(--cyan);
  opacity: 1;
}
.nav-l.on {
  background: var(--grad-bc);
  color: #fff !important;
  box-shadow: 0 8px 20px -8px rgba(0, 198, 240, 0.65);
}
.panel-nav {
  padding: 2px 0 8px;
  animation: navIn 0.16s var(--ease);
}
@keyframes navIn {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
}
.panel-nav a {
  display: block;
  padding: 7px 14px;
  margin-inline-start: 22px;
  border-inline-start: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 13.8px;
  color: #93a6cb !important;
  transition: color 0.15s;
}
.panel-nav a:hover {
  color: #fff !important;
}
.panel-nav a.on {
  color: #fff !important;
  font-weight: 600;
  border-inline-start: 2px solid var(--cyan);
  background: linear-gradient(to left, rgba(0, 198, 240, 0.14), transparent);
  border-start-end-radius: 9px;
  border-end-end-radius: 9px;
}
.panel-nav h3 {
  font-family: var(--font);
  font-size: 11.5px;
  letter-spacing: 0.02em;
  color: #6f84ad;
  margin: 10px 36px 3px 0;
  font-weight: 700;
}
.side-foot {
  flex: none;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  padding: 10px 0 12px;
  display: grid;
  gap: 8px;
}
.side-slogan {
  margin: 0 4px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 13px;
  color: #b9c8e6;
  background: linear-gradient(135deg, rgba(8, 120, 249, 0.25), rgba(138, 43, 226, 0.22));
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.side-slogan b {
  color: #fff;
}
.side-toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  background: none;
  border: 0;
  padding: 8px 12px;
  border-radius: 10px;
  color: #8ea1c7;
  cursor: pointer;
  font-size: 13.5px;
  white-space: nowrap;
}
.side-toggle .ic {
  transition: transform 0.2s;
  transform: rotate(180deg);
}
.side-toggle:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}
.side-note {
  display: none;
}
.menu {
  display: none;
}
[data-nav='mini'] #side {
  padding: 0 10px;
}
[data-nav='mini'] #side nav {
  overflow: visible;
}
[data-nav='mini'] .side-brand {
  justify-content: center;
  padding: 0;
}
[data-nav='mini'] .side-brand span,
[data-nav='mini'] .side-slogan,
[data-nav='mini'] .nav-l span,
[data-nav='mini'] #side summary span,
[data-nav='mini'] #side summary::after,
[data-nav='mini'] .side-toggle span {
  display: none;
}
[data-nav='mini'] .nav-l,
[data-nav='mini'] #side summary {
  justify-content: center;
  padding: 11px;
}
[data-nav='mini'] .side-toggle {
  justify-content: center;
}
[data-nav='mini'] .side-toggle .ic {
  transform: none;
}
[data-nav='mini'] #side details {
  position: relative;
}
[data-nav='mini'] .panel-nav {
  position: absolute;
  top: 0;
  inset-inline-start: calc(100% + 12px);
  width: 250px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-3);
  padding: 8px;
  max-height: 70vh;
  overflow: auto;
  z-index: 40;
}
[data-nav='mini'] .panel-nav a {
  margin: 0;
  border: 0;
  border-radius: 8px;
  color: var(--ink2) !important;
}
[data-nav='mini'] .panel-nav a:hover,
[data-nav='mini'] .panel-nav a.on {
  color: var(--royal) !important;
  background: var(--hover);
}
[data-nav='mini'] .panel-nav h3 {
  margin: 6px 12px 2px;
  color: var(--ink3);
}
/* منطقة المحتوى */
#main {
  grid-column: 2;
  grid-row: 2;
  overflow: auto;
  padding-block: 24px 48px;
  padding-inline: 28px;
  min-width: 0;
}
#main.page-in {
  animation: pageIn 0.22s var(--ease);
}
@keyframes pageIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.page-head h1 {
  font-size: 25px;
  line-height: 1.3;
  font-weight: 800;
  color: var(--ink);
}
.page-head p {
  color: var(--ink3);
  font-size: 13.5px;
}
.head-tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
/* لوحة التحكم والمؤشرات */
.dash-hero {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.eyebrow {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--royal);
}
.dash-hero h1 {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.25;
}
.dash-hero .muted {
  font-size: 13.5px;
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}
.kpi {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas:
    'i t'
    'v v'
    'f f';
  align-items: center;
  gap: 4px 12px;
  padding: 18px 18px 16px;
  border-radius: var(--r-l);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--sh-1);
  text-decoration: none;
  color: var(--ink);
  overflow: hidden;
  min-width: 0;
  transition:
    box-shadow 0.2s,
    transform 0.2s var(--ease),
    border-color 0.2s;
}
.kpi:hover {
  box-shadow: var(--sh-2);
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--royal) 25%, var(--line));
}
.kpi > i {
  grid-area: i;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--grad-bc);
  color: #fff;
  box-shadow: 0 8px 16px -8px rgba(8, 120, 249, 0.6);
}
.kpi > i .ic {
  width: 21px;
  height: 21px;
  stroke-width: 1.9;
}
.kpi.k-pur > i {
  background: linear-gradient(135deg, #00bfa6, #00c6f0);
  box-shadow: 0 8px 16px -8px rgba(0, 191, 166, 0.6);
}
.kpi.k-pro > i {
  background: var(--grad-bp);
  box-shadow: 0 8px 16px -8px rgba(138, 43, 226, 0.55);
}
.kpi.k-exp > i {
  background: linear-gradient(135deg, #0b2d6b, #0878f9);
  box-shadow: 0 8px 16px -8px rgba(11, 45, 107, 0.6);
}
.kpi > span {
  grid-area: t;
  font-size: 13.5px;
  color: var(--ink3);
  font-weight: 600;
}
.kpi strong {
  grid-area: v;
  font-family: var(--font-num);
  font-size: 25px;
  font-weight: 700;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  text-align: right;
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.k-foot {
  grid-area: f;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}
.delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-style: normal;
  font-family: var(--font-num);
  font-size: 12.5px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--line2);
  color: var(--ink3);
  white-space: nowrap;
}
.delta small {
  font-family: var(--font);
  font-weight: 500;
  color: var(--ink3);
  margin-inline-start: 4px;
}
.delta .ic {
  width: 13px;
  height: 13px;
  stroke-width: 2.6;
}
.delta.up {
  background: var(--ok-bg);
  color: var(--ok);
}
.delta.down {
  background: var(--bad-bg);
  color: var(--bad);
}
.spark {
  flex: 0 1 110px;
  min-width: 50px;
  height: 32px;
}
.spark polyline {
  fill: none;
  stroke: var(--royal);
  stroke-width: 2;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.spark polygon {
  fill: color-mix(in srgb, var(--royal) 12%, transparent);
}
.k-pur .spark polyline {
  stroke: var(--teal);
}
.k-pur .spark polygon {
  fill: color-mix(in srgb, var(--teal) 14%, transparent);
}
.k-pro .spark polyline {
  stroke: var(--purple);
}
.k-pro .spark polygon {
  fill: color-mix(in srgb, var(--purple) 12%, transparent);
}
.neg {
  color: var(--bad);
}
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.kpi.sm {
  grid-template-areas:
    'i t'
    'i v';
  padding: 12px 14px;
  gap: 0 12px;
  border-radius: var(--r);
}
.kpi.sm > i {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--tint);
  color: var(--royal);
  box-shadow: none;
}
.kpi.sm > i .ic {
  width: 19px;
  height: 19px;
}
.kpi.sm strong {
  font-size: 17px;
  margin: 0;
}
.kpi.sm > span {
  font-size: 12.5px;
}
.kpi-inv {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 12px 16px;
  border-radius: var(--r);
  background: var(--grad-ne);
  color: #fff;
  text-decoration: none;
  min-width: 0;
  box-shadow: var(--sh-1);
}
.kpi-inv span {
  font-size: 12.5px;
  color: #b9c8e6;
  font-weight: 600;
}
.kpi-inv b {
  font-size: 18px;
  font-weight: 700;
  text-align: right;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpis > * {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 16px;
  box-shadow: var(--sh-1);
  min-width: 0;
}
.kpis span {
  display: block;
  font-size: 13px;
  color: var(--ink3);
  font-weight: 600;
}
.kpis strong {
  font-family: var(--font-num);
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  direction: ltr;
  display: block;
  text-align: right;
}
.dash-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 18px 20px;
  min-width: 0;
  box-shadow: var(--sh-1);
}
.panel h2 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 10px;
}
.p-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 12px;
}
.p-head h2 {
  margin: 0;
}
.p-head small {
  color: var(--ink3);
  font-size: 12.5px;
}
.p-link {
  margin-inline-start: auto;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.p-head .count {
  margin-inline-start: auto;
  min-width: 24px;
  height: 24px;
  border-radius: 99px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  background: var(--bad-bg);
  color: var(--bad);
  padding: 0 7px;
}
.h-note {
  font-size: 12.5px;
  color: var(--ink3);
  font-weight: 400;
  margin-inline-start: 8px;
}
.span2 {
  grid-column: span 2;
}
.muted {
  color: var(--ink3);
  font-size: 14px;
}
.lead {
  font-size: 15.5px;
}
.sec {
  font-size: 17px;
  margin: 22px 0 10px;
}
.panel .btn {
  margin-top: 8px;
}
.chart-box {
  height: 260px;
  position: relative;
}
.chart-box.donut {
  height: 260px;
}
.lsvg {
  display: block;
  direction: ltr;
}
.lsvg .gl {
  stroke: var(--line2);
  stroke-dasharray: 3 4;
}
.lsvg .tk {
  font-size: 11px;
  fill: var(--ink3);
  font-family: var(--font-num);
}
.lsvg [data-tip],
.dn [data-tip] {
  cursor: pointer;
}
.lsvg path[data-tip]:hover {
  opacity: 0.8;
}
.dn-wrap {
  display: flex;
  align-items: center;
  gap: 18px;
  height: 100%;
}
.dn {
  width: 150px;
  flex: none;
}
.dn circle:hover {
  stroke-width: 23;
}
.dn-v {
  font: 700 17px var(--font-num);
  fill: var(--ink);
}
.dn-l {
  font-size: 11px;
  fill: var(--ink3);
  font-family: var(--font);
}
.dn-lg {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 7px;
  flex: 1;
  min-width: 0;
  font-size: 13px;
}
.dn-lg li {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dn-lg i {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  flex: none;
}
.dn-lg span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink2);
}
.dn-lg b {
  font-family: var(--font-num);
  font-weight: 700;
}
.legend {
  display: flex;
  gap: 18px;
  justify-content: center;
  font-size: 12.5px;
  color: var(--ink2);
  height: 30px;
  align-items: center;
}
.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-inline-end: 6px;
  vertical-align: -1px;
}
#tip {
  position: fixed;
  z-index: 120;
  background: var(--navy);
  color: #fff;
  font-size: 12.5px;
  padding: 5px 10px;
  border-radius: 8px;
  pointer-events: none;
  box-shadow: var(--sh-2);
  white-space: nowrap;
}
/* مؤشرات الأداء */
.perf {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 15px;
}
.perf div {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
}
.perf div b {
  font-weight: 700;
}
.perf i {
  display: block;
  height: 7px;
  border-radius: 9px;
  background: var(--line2);
  margin: 6px 0 3px;
  overflow: hidden;
}
.perf u {
  display: block;
  height: 100%;
  border-radius: 9px;
  background: var(--grad-bc);
}
.perf li:nth-child(2) u {
  background: var(--grad-bp);
}
.perf li:nth-child(3) u {
  background: linear-gradient(90deg, #00bfa6, #00c6f0);
}
.perf li:nth-child(4) u {
  background: linear-gradient(90deg, #0b2d6b, #0878f9);
}
.perf small {
  color: var(--ink3);
  font-size: 12px;
}
/* المهام والإجراءات السريعة */
.tasks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.tasks a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 11px;
  text-decoration: none;
  color: var(--ink);
  background: var(--card2);
  border: 1px solid var(--line2);
  font-size: 13.5px;
  transition:
    border-color 0.15s,
    background 0.15s;
}
.tasks a:hover {
  border-color: color-mix(in srgb, var(--royal) 30%, var(--line));
  background: var(--hover);
}
.tasks i {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex: none;
  background: var(--warn-bg);
  color: var(--warn);
}
.tasks .bad i {
  background: var(--bad-bg);
  color: var(--bad);
}
.tasks span {
  min-width: 0;
}
.all-done {
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 26px 0;
  color: var(--ink3);
  font-size: 13.5px;
}
.all-done .ic {
  width: 40px;
  height: 40px;
  padding: 9px;
  border-radius: 50%;
  background: var(--ok-bg);
  color: var(--ok);
  stroke-width: 2.4;
}
.quick {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
}
.q-tile {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 14px 6px 12px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  transition:
    border-color 0.15s,
    box-shadow 0.15s,
    transform 0.15s var(--ease);
}
.q-tile:hover {
  border-color: color-mix(in srgb, var(--royal) 40%, var(--line));
  box-shadow: var(--sh-2);
  transform: translateY(-2px);
}
.q-tile i {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--tint);
  color: var(--royal);
}
.q-tile i .ic {
  width: 20px;
  height: 20px;
}
.panel .tbl-scroll {
  overflow-x: auto;
  margin-inline: -8px;
}
.dash-t td {
  padding-block: 10px;
}
.dash-t .memo {
  color: var(--ink2);
  max-width: min(320px, 40vw);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rows {
  list-style: none;
  margin: 0;
  padding: 0;
}
.rows li {
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 9px 0;
  border-bottom: 1px solid var(--line2);
  font-size: 14px;
}
.rows li:last-child {
  border: 0;
}
.rows span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink2);
}
.rows small {
  color: var(--ink3);
  white-space: nowrap;
}
.rows li > a {
  white-space: nowrap;
  font-weight: 600;
  text-decoration: none;
}
.rows b {
  font-weight: 700;
  margin-inline-start: auto;
  white-space: nowrap;
}
.banner {
  padding: 10px 16px;
  border-radius: var(--r-s);
  margin-bottom: 14px;
  font-size: 14px;
}
.banner.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.banner.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
/* قوالب الدليل */
.tpl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.tpl {
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.tpl.on {
  border-color: var(--royal);
  box-shadow: 0 0 0 3px var(--tint);
}
.tpl header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.tpl h3 {
  font-size: 16px;
}
.tpl-tops {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 4px;
  font-size: 13.5px;
}
.tpl-tops li {
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.tpl-tops b {
  font-family: var(--font-num);
  color: var(--royal);
  min-width: 14px;
}
.tpl-tops small {
  margin-inline-start: auto;
  color: var(--ink3);
}
.tpl .btn {
  margin-top: auto;
  align-self: flex-start;
}
/* جداول */
.tbl-box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 12px;
  box-shadow: var(--sh-1);
}
.tbl-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line2);
  align-items: center;
}
.tbl-q {
  max-width: 260px;
  min-height: 34px;
  padding: 5px 10px;
}
.mini {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--ink3);
}
.mini input,
.mini-s {
  width: auto;
  min-height: 34px;
  padding: 4px 8px;
}
.tbl-end {
  margin-inline-start: auto;
  display: flex;
  gap: 6px;
}
.tbl-box > .tbl-scroll {
  overflow: auto;
  max-height: calc(100dvh - 275px);
}
.modal .tbl-scroll {
  overflow-x: auto;
}
.sched {
  max-height: 320px;
  overflow: auto;
}
.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 14px;
}
.tbl th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--head);
  color: var(--ink2);
  font-weight: 600;
  text-align: right;
  padding: 10px 12px;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}
.tbl th.num {
  text-align: left;
}
th.sortable {
  cursor: pointer;
  user-select: none;
}
th.sortable:hover {
  color: var(--royal);
}
.tbl td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--line2);
  vertical-align: middle;
}
.tbl tbody tr:nth-child(even) td {
  background: var(--zebra);
}
.tbl tbody tr:last-child td {
  border-bottom: 0;
}
.tbl tbody tr:hover td {
  background: var(--hover);
}
.tbl tfoot th {
  position: sticky;
  bottom: 0;
  background: var(--head);
  border-top: 2px solid var(--line);
  border-bottom: 0;
}
.tbl tr.grp td {
  font-weight: 600;
}
.tbl td.acts {
  white-space: nowrap;
  text-align: left;
  width: 1%;
}
.tbl .empty {
  text-align: center;
  color: var(--ink3);
  padding: 34px 12px;
}
.empty .btn {
  margin-top: 10px;
}
.empty-ic {
  width: 54px;
  height: 54px;
  fill: none;
  stroke: var(--ink3);
  stroke-width: 1.5;
  opacity: 0.6;
  margin-bottom: 6px;
}
.thumb {
  width: 34px;
  height: 34px;
  object-fit: cover;
  border-radius: 6px;
}
.tbl.lines td {
  padding: 5px 6px;
  vertical-align: top;
}
.tbl.lines tbody tr:nth-child(even) td,
.tbl.lines tbody tr:hover td {
  background: none;
}
.tbl.lines select {
  min-width: 170px;
}
.tbl.lines input.num {
  min-width: 84px;
}
.tbl.pay input.num {
  min-width: 90px;
}
.avail {
  display: block;
  color: var(--ink3);
  font-size: 11.5px;
  margin-top: 2px;
}
.matrix td,
.matrix th {
  text-align: center;
}
.matrix td:first-child,
.matrix th:first-child {
  text-align: right;
  white-space: nowrap;
}
.pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 8px;
  font-size: 13px;
  color: var(--ink2);
  border-top: 1px solid var(--line2);
}
.tag {
  display: inline-block;
  padding: 1px 10px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
}
.tag.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.tag.warn {
  background: var(--warn-bg);
  color: var(--warn);
}
.tag.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.tag.muted {
  background: var(--line2);
  color: var(--ink2);
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 12px;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-1);
}
.filters .fld {
  width: 190px;
}
.op-info {
  font-size: 14px;
  padding-bottom: 8px;
}
.back {
  font-size: 13.5px;
  display: inline-block;
  margin-bottom: 8px;
}
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
  overflow-x: auto;
}
.tabs button {
  background: none;
  border: 0;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--ink2);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tabs button.on {
  color: var(--royal);
  border-color: var(--gold);
  font-weight: 600;
}
.rep-groups {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.rep-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px 18px;
  box-shadow: var(--sh-1);
}
.rep-groups h2 {
  font-size: 15.5px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--gold);
  margin-bottom: 6px;
}
.rep-groups a {
  display: block;
  padding: 6px 0;
  text-decoration: none;
  border-bottom: 1px solid var(--line2);
  color: var(--ink);
}

/* تطبيع الأرقام العربية والفواصل */
const normNum = s =>
  String(s ?? '')
    .trim()
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g, '.')
    .replace(/[,٬\s]/g, '');

/* تحويل نص عشري إلى عدد صحيح بمقياس 10^p دون المرور بالفاصلة العائمة */
function scaled(v, p) {
  if (typeof v === 'number' && !Number.isFinite(v)) return NaN;
  const s = normNum(typeof v === 'number' ? v.toFixed(Math.min(p + 4, 20)) : v);
  if (s === '') return 0;
  const m = /^([+-]?)(\d*)(?:\.(\d*))?$/.exec(s);
  if (!m || (m[2] === '' && !m[3])) return NaN;
  const frac = m[3] || '',
    keep = frac.slice(0, p).padEnd(p, '0'),
    next = frac.charCodeAt(p) || 48;
  let n = BigInt((m[2] || '0') + keep);
  if (next >= 53) n += 1n;
  const r = Number(m[1] === '-' ? -n : n);
  return Number.isSafeInteger(r) ? r : NaN;
}
const toMinor = v => scaled(v, 2); // هللات
const toQty = v => scaled(v, 3); // أجزاء من الألف
const toRate = v => scaled(v, 6); // سعر الصرف
const toBp = v => scaled(v, 2); // نسبة ×100 (15% = 1500)
const num = (n, p) => {
  const neg = n < 0;
  const a = Math.abs(n),
    f = 10 ** p,
    i = Math.trunc(a / f),
    d = String(a % f).padStart(p, '0');
  return (neg ? '-' : '') + i + (p ? '.' + d : '');
};
const minorStr = n => num(n || 0, 2),
  qtyStr = n => trimZ(num(n || 0, 3)),
  rateStr = n => trimZ(num(n || 0, 6)),

  return s.includes('.') ? s.replace(/\.?0+$/, '') : s;

const group = s => {
  const [i, d] = String(s).split('.');

/* a*b/c بدقة كاملة وتقريب نصف لأعلى بعيدًا عن الصفر */
function mulDiv(a, b, c) {
  if (!c) return 0;
  const A = BigInt(a) * BigInt(b),
    C = BigInt(c),
    neg = A < 0n !== C < 0n,
    x = A < 0n ? -A : A,
    y = C < 0n ? -C : C;
  const q = (2n * x + y) / (2n * y),
    r = Number(q);
  return neg ? -r : r;
}

const toBase = (amt, rate) => mulDiv(amt, rate, 1000000);
/* توزيع مبلغ على أوزان بأسلوب أكبر باقٍ؛ المجموع مطابق تمامًا */
function allocate(total, weights) {
  const W = weights.reduce((a, b) => a + Math.max(b, 0), 0);
  const n = weights.length;
  if (!n) return [];
  if (!W) {
    const r = new Array(n).fill(0);
    r[0] = total;
    return r;
  }
  const sign = total < 0 ? -1n : 1n,
    T = BigInt(Math.abs(total)),
    big = BigInt(W);
  const res = weights.map(w => (BigInt(Math.max(w, 0)) * T) / big);
  const rem = weights
    .map((w, i) => ({ i, r: (BigInt(Math.max(w, 0)) * T) % big }))
    .sort((a, b) => (a.r < b.r ? 1 : a.r > b.r ? -1 : a.i - b.i));
  let left = T - res.reduce((a, b) => a + b, 0n);
  for (let k = 0; left > 0n; k = (k + 1) % n, left--) res[rem[k].i] += 1n;
  return res.map(x => Number(x * sign));
}

const pad2 = n => String(n).padStart(2, '0');

  const d = new Date(s + 'T12:00:00');
  d.setDate(d.getDate() + n);

const addMonths = (s, n) => {
  const [y, m, dd] = s.split('-').map(Number);

/* SHA-256 نقي (يعمل على file:// في كل المتصفحات) */
function sha256(str) {
  const K = [];
  const isP = n => {
    for (let f = 2; f * f <= n; f++) if (n % f === 0) return false;
    return true;
  };
  const H = [];
  for (let n = 2, c = 0; c < 64; n++)
    if (isP(n)) {
      if (c < 8) H.push(((Math.sqrt(n) % 1) * 2 ** 32) | 0);
      K.push(((Math.cbrt(n) % 1) * 2 ** 32) | 0);
      c++;
    }
  const b = new TextEncoder().encode(str),
    l = b.length,
    m = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  m.set(b);
  m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(m.length - 8, Math.floor(l / 2 ** 29));
  dv.setUint32(m.length - 4, l << 3);
  const w = new Int32Array(64),
    r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < m.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15],
        c = w[i - 2];
      w[i] =
        (w[i - 16] + (r(a, 7) ^ r(a, 18) ^ (a >>> 3)) + w[i - 7] + (r(c, 17) ^ r(c, 19) ^ (c >>> 10))) | 0;
    }
    let [a, b2, c, d, e, f, g, h2] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h2 + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0,
        t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
      h2 = g;
      g = f;
      f = e;
      e = (d + t1) | 0;
      d = c;
      c = b2;
      b2 = a;
      a = (t1 + t2) | 0;
    }
    [a, b2, c, d, e, f, g, h2].forEach((v, i) => (H[i] = (H[i] + v) | 0));
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
function hashPw(pw, salt) {
  let x = salt + ':' + pw;
  for (let i = 0; i < 500; i++) x = sha256(x + salt);
  return x;
}

/* قالب HTML آمن: كل قيمة تُهرَّب تلقائيًا ما لم تكن Safe */
class Safe {
  constructor(s) {
    this.s = s;
  }
  toString() {
    return this.s;
  }
}
const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
  );
const val2 = v =>
  v == null || v === false || v === true
    ? ''
    : v instanceof Safe
      ? v.s
      : Array.isArray(v)
        ? v.map(val2).join('')
        : esc(v);
const h = (st, ...vs) => new Safe(st.reduce((o, s, i) => o + s + (i < vs.length ? val2(vs[i]) : ''), ''));
const raw = s => new Safe(String(s));
const $ = (s, r = document) => r.querySelector(s),
  $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ===== 01-db: مخزن في الذاكرة مع معاملات ذرية وحفظ متسلسل في IndexedDB =====
   كل عملية تُنفَّذ داخل tx(): عند أي خطأ تُسترجع الحالة كاملة (عدادات، قيود، مخزون)
   وعند النجاح تُكتب كل التغييرات في معاملة IndexedDB واحدة. */
const STORES = [
  'meta',
  'users',
  'roles',
  'branches',
  'warehouses',
  'costCenters',
  'accounts',
  'journals',
  'customers',
  'suppliers',
  'items',
  'categories',
  'stockBal',
  'stockMoves',
  'stockDocs',
  'docs',
  'vouchers',
  'cashAccounts',
  'transfers',
  'recons',
  'assets',
  'finDocs',
  'recurring',
  'audit',
  'lots'
];
const DB = (() => {
  const S = {};
  STORES.forEach(s => (S[s] = new Map()));
  let idb = null,
    cur = null,
    queue = Promise.resolve(),
    sandboxed = false,
    chan = null,
    onExt = null,
    lastErr = null,
    ver = 0,
    readOnly = false,
    onRW = null;
  const open = () =>
    new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB غير متاح'));
      const r = indexedDB.open(APP.dbName, 2);
      r.onupgradeneeded = () =>
        STORES.forEach(s => {
          if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' });
        });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('قاعدة البيانات محجوبة بتبويب آخر'));
    });
  const load = () =>
    new Promise((res, rej) => {
      const t = idb.transaction(STORES);
      let n = STORES.length;
      STORES.forEach(s => {
        const q = t.objectStore(s).getAll();
        q.onsuccess = () => {
          S[s].clear();
          q.result.forEach(o => S[s].set(o.id, o));
          if (!--n) res();
        };
        q.onerror = () => rej(q.error);
      });
    });
  async function init() {
    idb = await open();
    await load();
    /* كاتب واحد: أول تبويب يملك القفل، وأي تبويب آخر للقراءة حتى يتحرر القفل */
    if (navigator.locks) {
      await new Promise(res => {
        navigator.locks.request('namaa-writer', { ifAvailable: true }, lock => {
          if (lock) {
            readOnly = false;
            res();
            return new Promise(() => {});
          }
          readOnly = true;
          res();
          navigator.locks.request('namaa-writer', async () => {
            await load();
            ver++;
            readOnly = false;
            onRW && onRW();
            return new Promise(() => {});
          });
        });
      });
    }
    try {
      chan = new BroadcastChannel('namaa-sync');
      chan.onmessage = async () => {
        await load();
        ver++;
        onExt && onExt();
      };
    } catch (e) {}
  }
  function write(sets, dels, wipe) {
    if (!idb) return;
    queue = queue
      .then(
        () =>
          new Promise((res, rej) => {
            const t = idb.transaction(STORES, 'readwrite');
            if (wipe) STORES.forEach(s => t.objectStore(s).clear());
            sets.forEach(([s, o]) => t.objectStore(s).put(o));
            dels.forEach(([s, id]) => t.objectStore(s).delete(id));
            t.oncomplete = () => {
              try {
                chan && chan.postMessage(1);
              } catch (e) {}
              res();
            };
            t.onerror = t.onabort = () => rej(t.error || new Error('تعذر الحفظ'));
          })
      )
      .catch(e => {
        lastErr = e;
        window.dispatchEvent(new CustomEvent('namaa-dberror', { detail: e }));
      });
    return queue;
  }
  const get = (s, id) => S[s].get(id),
    all = s => [...S[s].values()],
    has = (s, id) => S[s].has(id);
  function touch(s, id) {
    ver++;
    const k = s + '\u0000' + id;
    if (!cur) throw new Error('كتابة خارج معاملة');
    if (!cur.undo.has(k)) cur.undo.set(k, [s, id, clone(S[s].get(id))]);
  }
  function put(s, o) {
    if (!o.id) o.id = uid();
    touch(s, o.id);
    S[s].set(o.id, o);
    return o;
  }
  function mut(s, id) {
    const o = S[s].get(id);
    if (!o) fail('السجل غير موجود');
    touch(s, id);
    return o;
  }
  function del(s, id) {
    touch(s, id);
    S[s].delete(id);
  }
  function tx(label, fn) {
    if (cur) return fn();
    if (readOnly && !sandboxed) fail('هذا التبويب للقراءة فقط لأن النظام مفتوح في تبويب آخر');
    cur = { undo: new Map() };
    try {
      const r = fn();
      const c = cur;
      cur = null;
      if (!sandboxed) {
        const sets = [],
          dels = [];
        c.undo.forEach(([s, id]) => {
          const o = S[s].get(id);
          o ? sets.push([s, clone(o)]) : dels.push([s, id]);
        });
        write(sets, dels);
      }
      return r;
    } catch (e) {
      cur.undo.forEach(([s, id, prev]) => {
        prev === undefined ? S[s].delete(id) : S[s].set(id, prev);
      });
      cur = null;
      ver++;
      throw e;
    }
  }
  /* تشغيل سيناريو كامل على نسخة مؤقتة ثم استعادة البيانات دون أي كتابة دائمة */
  function sandbox(fn, empty) {
    const snap = {};
    STORES.forEach(s => {
      snap[s] = S[s];
      S[s] = new Map();
      if (!empty) snap[s].forEach((o, k) => S[s].set(k, clone(o)));
    });
    const was = sandboxed;
    sandboxed = true;
    ver++;
    try {
      return fn();
    } finally {
      STORES.forEach(s => (S[s] = snap[s]));
      sandboxed = was;
      ver++;
    }
  }
  /* يملأ المخازن من نسخة داخل sandbox لفحصها دون لمس البيانات الحية */
  function loadInto(data) {
    STORES.forEach(s => {
      S[s].clear();
      (data[s] || []).forEach(o => S[s].set(o.id, o));
    });
    ver++;
  }
  function exportAll() {
    const o = {};
    STORES.forEach(s => (o[s] = all(s)));
    return o;
  }
  async function replaceAll(data) {
    if (readOnly) fail('هذا التبويب للقراءة فقط');
    loadInto(data);
    const sets = [];
    STORES.forEach(s => S[s].forEach(o => sets.push([s, o])));
    write(sets, [], true);
    await queue;
    if (lastErr) throw lastErr;
  }
  const flush = async () => {
    await queue;
    if (lastErr) {
      const e = lastErr;
      lastErr = null;
      throw e;
    }
  };
  return {
    init,
    get,
    all,
    has,
    put,
    mut,
    del,
    tx,
    sandbox,
    loadInto,
    exportAll,
    replaceAll,
    flush,
    load,
    onExternal: f => (onExt = f),
    onWritable: f => (onRW = f),
    ver: () => ver,
    isReadOnly: () => readOnly
  };
})();

/* تخزين مؤقت يبطل تلقائيًا مع أي تغيير؛ النتائج تُعامل كقراءة فقط */
const cached = (() => {
  const c = new Map();
  let v = -1;
  return (k, f) => {
    if (v !== DB.ver()) {
      c.clear();
      v = DB.ver();
    }
    if (!c.has(k)) c.set(k, f());
    return c.get(k);
  };
})();

function seedChart(rows, st) {
  st.mapping = {};
  rows.forEach(([code, name, type, nature, grp, key, control]) => {
    const parent = rows
      .filter(c => code.startsWith(c[0]) && c[0] !== code)
      .sort((a, b) => b[0].length - a[0].length)[0];
    DB.put('accounts', {
      id: 'a' + code,
      code,
      name,
      parentId: parent ? 'a' + parent[0] : '',
      type,
      nature,
      group: !!grp,
      currency: st.baseCur || 'SAR',
      ccId: '',
      active: true,
      control: control || '',
      sys: !!key
    });
    if (key) st.mapping[key] = 'a' + code;
  });
}

/* دمج الأسطر المتطابقة وتحويل السالب إلى الطرف المقابل */
function normLines(lines) {
  const m = new Map();
  lines.forEach(l => {
    const net = (l.debit || 0) - (l.credit || 0);
    if (!net && !l.keep) return;
    const k = [l.acc, l.cc || '', l.branch || '', l.partyId || '', l.due || '', l.memo || ''].join('|');
    const c = m.get(k);
    if (c) c.net += net;
    else m.set(k, { ...l, net });
  });
  return [...m.values()]
    .filter(l => l.net)
    .map(l => {
      const { net, keep, ...r } = l;
      return { ...r, id: uid(), debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0 };
    });
}
function validateLines(lines) {
  lines.forEach(l => {
    const a = checkAcc(l.acc);
    if (!Number.isSafeInteger(l.debit) || !Number.isSafeInteger(l.credit)) fail('مبلغ غير صالح في القيد');
    if (l.debit && l.credit) fail('لا يجوز أن يحمل السطر مدينًا ودائنًا معًا');
    if (a.control === 'customer' && (l.partyType !== 'customer' || !l.partyId))
      fail(`الحساب ${a.name} يتطلب تحديد العميل`);
    if (a.control === 'supplier' && (l.partyType !== 'supplier' || !l.partyId))
      fail(`الحساب ${a.name} يتطلب تحديد المورد`);
  });
  const d = sum(lines, l => l.debit),
    c = sum(lines, l => l.credit);
  if (lines.length < 2) fail('يجب أن يحتوي القيد على سطرين على الأقل');
  if (d !== c) fail(`القيد غير متوازن: المدين ${fm(d)} والدائن ${fm(c)}`);
  if (d <= 0) fail('إجمالي القيد يجب أن يكون أكبر من صفر');
}
/* القيد الآلي: معرفه مشتق من مصدره، فلا يمكن إنشاؤه مرتين لنفس الحدث */
function postAuto({ date, type = 'auto', source, ref = '', memo = '', lines, branch = '' }) {
  const key = `je:${source.type}:${source.id}:${source.event || 'post'}`;
  if (DB.has('journals', key)) fail(`تم إنشاء قيد لهذا المستند مسبقًا (${DB.get('journals', key).no})`);
  assertOpen(date);
  const L = normLines(lines.map(l => ({ ...l, branch: l.branch || branch })));
  validateLines(L);
  const j = {
    id: key,
    no: nextNo('je'),
    date,
    type,
    status: 'posted',
    source,
    ref,
    memo,
    notes: '',
    lines: L,
    createdBy: Auth.user?.username || 'النظام',
    createdAt: new Date().toISOString(),
    postedAt: new Date().toISOString()
  };
  DB.put('journals', j);
  return j;
}
function reverseJE(jeId, date, memo, extra = []) {
  const o = DB.mut('journals', jeId);
  if (o.status !== 'posted') fail('القيد غير مرحل');
  if (o.reversedBy) fail('سبق عكس هذا القيد');
  if (date < o.date) fail('تاريخ العكس يجب ألا يسبق تاريخ القيد الأصلي');
  const lines = o.lines
    .map(l => {
      const { id, ...r } = l;
      return { ...r, debit: l.credit, credit: l.debit, due: l.due ? date : undefined };
    })
    .concat(extra);
  const j = postAuto({
    date,
    type: 'reversal',
    source: { type: 'reversal', id: o.id, no: o.no, origin: o.source },
    ref: o.no,
    memo: memo || `عكس القيد ${o.no}`,
    lines
  });
  o.reversedBy = j.id;
  return j;
}

function saveJournal(d) {

    if (!isDate(d.date)) fail('حدد تاريخ القيد');

/* ---- الأرصدة ---- */
const posted = () => cached('posted', () => DB.all('journals').filter(j => j.status === 'posted'));
const lineIdx = () =>
  cached('lineIdx', () => {
    const all = [],
      byParty = new Map(),
      byAcc = new Map();
    posted().forEach(j =>
      j.lines.forEach(l =>
        all.push({
          ...l,
          date: j.date,

          memo: l.memo || j.memo,
          ref: j.ref,
          jtype: j.type,

    all.forEach(l => {
      if (l.partyId) {
        (byParty.get(l.partyId) || byParty.set(l.partyId, []).get(l.partyId)).push(l);

/* ترتيب أسطر القيود زمنيًا ثم برقم القيد */
const byDateNo = (a, b) => cmp(a.date, b.date) || cmp(a.no, b.no);
/* أسطر القيود المرحّلة مع فلاتر اختيارية؛ يبدأ من أضيق فهرس متاح */
function linesOf({ from, to, acc: accId, accs, cc, branch, partyType, partyId, noClosing } = {}) {
  const I = lineIdx();
  let base = I.all;
  if (partyId) base = I.byParty.get(partyId) || [];
  else if (accId) base = I.byAcc.get(accId) || [];
  else if (accs) base = accs.flatMap(a => I.byAcc.get(a) || []).sort(byDateNo);
  return base.filter(
    l =>
      !(
        (from && l.date < from) ||
        (to && l.date > to) ||
        (noClosing && l.jtype === 'closing') ||
        (accId && l.acc !== accId) ||
        (cc && l.cc !== cc) ||
        (branch && l.branch !== branch) ||
        (partyType && l.partyType !== partyType)
      )
  );
}
const childrenOf = id =>
  cached('kids', () => {
    const m = new Map();
    DB.all('accounts')
      .sort((a, b) => (a.code < b.code ? -1 : 1))
      .forEach(a => {
        if (a.parentId) (m.get(a.parentId) || m.set(a.parentId, []).get(a.parentId)).push(a);
      });

  }).get(id) || [];
const leafIds = id => {

function balances(f = {}) {
  /* يعيد لكل حساب مجموع المدين والدائن */
  return cached('bal:' + JSON.stringify(f), () => {
    const m = {};
    posted().forEach(j => {
      if ((f.from && j.date < f.from) || (f.to && j.date > f.to)) return;
      if (f.noClosing && j.type === 'closing') return;
      j.lines.forEach(l => {
        if (f.cc && l.cc !== f.cc) return;
        if (f.branch && l.branch !== f.branch) return;
        const x = m[l.acc] || (m[l.acc] = { d: 0, c: 0 });
        x.d += l.debit;
        x.c += l.credit;
      });
    });
    return m;
  });
}
const accBal = (id, f) => {
  const b = balances(f || {}),
    ids = leafIds(id);
  return sum(ids, i => (b[i]?.d || 0) - (b[i]?.c || 0));
}; /* مدين موجب */
const partyBal = (type, id, to) =>

const accUsed = id =>

/* إضافة فرع تحت حساب فرعي تحوّله إلى تجميعي، بشرط ألا يكون مستخدمًا */
function promoteParentToGroup(p) {
  if (!p || p.group) return;
  if (hasMoves(p.id)) fail('الحساب الأب عليه حركات ولا يمكن تحويله إلى تجميعي');
  if (p.sys || accUsed(p.id)) fail('الحساب الأب مرتبط بعمليات آلية أو عليه حركات ولا يمكن تحويله إلى تجميعي');
  DB.mut('accounts', p.id).group = true;
}
function assertNoCycle(p, id) {
  for (let x = p; x; x = x.parentId && DB.get('accounts', x.parentId))
    if (x.id === id) fail('لا يجوز جعل الحساب تابعًا لأحد فروعه');
}
function editableAccount(d) {
  const a = DB.mut('accounts', d.id);
  if (d.group && !a.group && hasMoves(a.id)) fail('لا يمكن تحويل حساب عليه حركات إلى تجميعي');
  if (!d.group && childrenOf(a.id).length) fail('للحساب فروع ولا يمكن تحويله إلى فرعي');
  if (a.sys && d.active === false) fail('حساب مرتبط بالعمليات الآلية ولا يمكن تعطيله');

}
function saveAccount(d) {

    const p = d.parentId ? DB.get('accounts', d.parentId) : null;
    if (d.parentId && !p) fail('الحساب الأب غير موجود');
    promoteParentToGroup(p);

function postOpeningParty(type, id) {
  const st = type === 'customer' ? 'customers' : 'suppliers',
    P = DB.mut(st, id),
    ctrl = acc(type === 'customer' ? 'ar' : 'ap'),
    off = acc('openingOffset');
  const signed = (P.opening || 0) * (type === 'customer' ? 1 : -1); /* العميل مدين، والمورد دائن */
  const prev = P.openingJE && DB.get('journals', P.openingJE);
  if (prev && !prev.reversedBy) {
    if (
      sum(
        prev.lines.filter(l => l.acc === ctrl),
        l => l.debit - l.credit
      ) === signed
    )
      return;
    reverseJE(prev.id, prev.date, 'تعديل رصيد افتتاحي');
    P.openingJE = '';
  }
  if (!signed) return;
  P.opVer = (P.opVer || 0) + 1;
  const date = P.openingDate || fyStart();
  const j = postAuto({
    date,
    type: 'opening',
    source: { type: 'opening-' + type, id, event: 'v' + P.opVer, no: P.code },
    ref: P.code,
    memo: `رصيد افتتاحي: ${P.name}`,
    lines: [
      {
        acc: ctrl,
        debit: signed > 0 ? signed : 0,
        credit: signed < 0 ? -signed : 0,
        partyType: type,
        partyId: id,
        due: date
      },
      { acc: off, debit: signed < 0 ? -signed : 0, credit: signed > 0 ? signed : 0 }
    ]
  });
  P.openingJE = j.id;
}
const fyStart = y => `${y || set().fiscalYear}-${set().fiscalStart}`;
const fyEnd = y => addDays(addMonths(fyStart(y), 12), -1);
function postOpeningGrid(entries, date) {
  need('accounts', 'approve');
  return DB.tx('open', () => {
    const off = acc('openingOffset'),
      rows = entries.filter(e => e.debit || e.credit);
    const st = DB.mut('meta', 'settings');
    const old = st.openingJE;
    if (old && DB.has('journals', old) && !DB.get('journals', old).reversedBy)
      reverseJE(old, DB.get('journals', old).date, 'استبدال الأرصدة الافتتاحية');
    const lines = rows.map(e => {
      const a = checkAcc(e.acc);
      if (a.control) fail(`رصيد ${a.name} يُسجَّل من بطاقته أو مستند المخزون`);
      return { acc: e.acc, debit: e.debit, credit: e.credit };
    });
    const net = sum(lines, l => l.debit - l.credit),
      offBal = accBal(off);
    if (offBal - net !== 0) fail(`الأرصدة الافتتاحية غير متوازنة بفرق ${fm(Math.abs(offBal - net))}`);
    if (net) lines.push({ acc: off, debit: net < 0 ? -net : 0, credit: net > 0 ? net : 0 });
    if (!lines.length) {
      st.openingJE = '';
      st.openingGrid = {};
      return null;
    }
    st.openingVer = (st.openingVer || 0) + 1;
    const j = postAuto({
      date,
      type: 'opening',
      source: { type: 'opening', id: 'grid', event: 'v' + st.openingVer, no: 'افتتاحي' },
      memo: 'الأرصدة الافتتاحية',
      lines
    });
    st.openingJE = j.id;
    st.openingGrid = Object.fromEntries(rows.map(e => [e.acc, { debit: e.debit, credit: e.credit }]));
    logA('اعتماد الأرصدة الافتتاحية', j.no);
    return j;
  });
}

/* ينشئ قيد الإقفال؛ منفصلة عن closeYear حتى تختبر بيئة الاختبار سنة جارية */
function closeYearEntries(y) {
  need('periods', 'approve');
  return DB.tx('cy', () => {
    const from = fyStart(y),
      to = fyEnd(y),
      key = `je:yearclose:${y}:post`;
    if (DB.has('journals', key) && !DB.get('journals', key).reversedBy) fail('تم إقفال هذه السنة مسبقًا');
    const b = balances({ from, to, noClosing: true }),
      L = [];
    let net = 0;
    DB.all('accounts')
      .filter(a => !a.group && (a.type === 'revenue' || a.type === 'expense'))
      .forEach(a => {
        const x = b[a.id];
        if (!x) return;
        const n = x.d - x.c;
        if (n) {
          L.push({ acc: a.id, debit: n < 0 ? -n : 0, credit: n > 0 ? n : 0 });
          net += n;
        }
      });
    if (!L.length) fail('لا توجد إيرادات أو مصروفات لإقفالها');
    L.push({ acc: acc('retained'), debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0 });
    const st = DB.mut('meta', 'settings');
    const event = DB.has('journals', key) ? 'v' + Date.now() : 'post';
    const j = postAuto({
      date: to,
      type: 'closing',
      source: { type: 'yearclose', id: String(y), event, no: String(y) },
      memo: `إقفال السنة المالية ${y}`,
      lines: L
    });
    st.closedThrough = to;
    st.fiscalYear = Number(y) + 1;
    logA('إقفال سنة مالية', String(y));
    return j;
  });
}

const invAccOf = i => i.invAcc || acc('inventory'),

function moveSeq() {
  const st = DB.mut('meta', 'settings');
  st.moveSeq = (st.moveSeq || 0) + 1;
  return st.moveSeq;
}
function stockRow(itemId, whId) {
  const k = balKey(itemId, whId);
  return DB.has('stockBal', k)
    ? DB.mut('stockBal', k)
    : DB.put('stockBal', { id: k, itemId, whId, qty: 0, value: 0, lastDate: '' });
}
function checkStockDate(b, date, item) {
  if (!set().allowBackdateStock && b.lastDate && date < b.lastDate)
    fail(
      `الصنف ${item.name}: توجد حركة أحدث بتاريخ ${b.lastDate}؛ لا يمكن تسجيل حركة أقدم لأنها تغيّر متوسط التكلفة`
    );
}
/* التشغيلات والأرقام التسلسلية: كل حركة لصنف متتبَّع يجب أن تحدد تفاصيلها */
let pendingLots = null;
const lotId = (i, w, no) => i + '|' + w + '|' + no;
function applyLots(b, qty) {
  const it = DB.get('items', b.itemId);
  if (!it.track || it.track === 'none' || !qty) return null;
  const L = pendingLots;
  if (!L || !L.length)
    fail(`حدد ${it.track === 'serial' ? 'الأرقام التسلسلية' : 'التشغيلات'} للصنف ${it.name}`);
  if (sum(L, x => x.qty) !== Math.abs(qty)) fail(`مجموع التفاصيل لا يساوي كمية الصنف ${it.name}`);
  L.forEach(x => {
    if (!x.no) fail('رقم التشغيلة مطلوب');
    if (it.track === 'serial' && x.qty !== 1000) fail('الرقم التسلسلي لوحدة واحدة فقط');
    const id = lotId(b.itemId, b.whId, x.no);
    if (qty > 0) {
      if (
        it.track === 'serial' &&
        DB.all('lots').some(z => z.itemId === b.itemId && z.no === x.no && z.qty > 0)
      )
        fail(`الرقم التسلسلي ${x.no} موجود مسبقًا`);
      const z = DB.has('lots', id)
        ? DB.mut('lots', id)
        : DB.put('lots', { id, itemId: b.itemId, whId: b.whId, no: x.no, qty: 0, exp: x.exp || '' });
      z.qty += x.qty;
      if (x.exp) z.exp = x.exp;
    } else {
      const z = DB.has('lots', id) && DB.mut('lots', id);
      if (!z || z.qty < x.qty) fail(`التشغيلة ${x.no} غير متوفرة بهذه الكمية`);
      z.qty -= x.qty;
    }
  });
  return L.map(x => ({ ...x }));
}
/* حركة مخزنية على رصيد صنف في مخزن؛ at = { date, src, memo } يصف المصدر */
function addMove(b, qty, value, { date, src, memo }) {
  const lots = applyLots(b, qty);
  b.qty += qty;
  b.value += value;
  if (date > b.lastDate) b.lastDate = date;
  return DB.put('stockMoves', {
    id: uid(),
    seq: moveSeq(),
    date,
    itemId: b.itemId,
    whId: b.whId,
    qty,
    value,
    balQty: b.qty,
    balValue: b.value,
    srcType: src.type,
    srcId: src.id,
    srcNo: src.no,
    memo: memo || '',
    lots
  });
}
function stockIn(itemId, whId, qty, value, at) {
  const item = DB.get('items', itemId);
  if (qty <= 0) fail('الكمية يجب أن تكون أكبر من صفر');
  if (value < 0) fail('القيمة لا يمكن أن تكون سالبة');
  const b = stockRow(itemId, whId);
  checkStockDate(b, at.date, item);
  addMove(b, qty, value, at);
  return value;
}
/* صرف: يعيد {cost, variance}. variance يظهر عند تكلفة مفروضة (مرتجع/إلغاء) لا تطابق الرصيد */
function stockOut(itemId, whId, qty, at, forced) {
  const item = DB.get('items', itemId),
    b = stockRow(itemId, whId);
  if (qty <= 0) fail('الكمية يجب أن تكون أكبر من صفر');
  checkStockDate(b, at.date, item);
  if (qty > b.qty) fail(`الكمية غير متوفرة من ${item.name}: المتاح ${fq(b.qty)} والمطلوب ${fq(qty)}`);
  const cost = forced == null ? (qty === b.qty ? b.value : mulDiv(b.value, qty, b.qty)) : forced;
  let actual = cost;
  if (qty === b.qty) actual = b.value;
  else if (actual > b.value) actual = b.value;
  addMove(b, -qty, -actual, at);
  return { cost: actual, variance: actual - cost };
}
/* تعديل قيمة دون كمية (فرق سعر فاتورة عن الاستلام). يعيد الجزء المطبق */
function stockValueAdj(itemId, whId, diff, at) {
  const b = stockRow(itemId, whId);
  if (!diff || !b.qty) return 0;
  const d = Math.max(diff, -b.value);
  if (!d) return 0;
  addMove(b, 0, d, at);
  return d;
}
/* عكس حركات مستند: يعيد أسطر القيد الموازنة لأي فرق تقييم */
function reverseMoves(srcType, srcId, date, src) {
  const undo = { date, src, memo: 'إلغاء' };
  const ms = DB.all('stockMoves')
      .filter(m => m.srcType === srcType && m.srcId === srcId && !m.reversed)
      .sort((a, b) => b.seq - a.seq),
    extra = [];
  ms.forEach(m => {
    DB.mut('stockMoves', m.id).reversed = true;
    const item = DB.get('items', m.itemId);
    pendingLots = m.lots || null;
    if (m.qty > 0) {
      const r = stockOut(m.itemId, m.whId, m.qty, undo, m.value);
      if (r.variance) {
        extra.push(
          { acc: invAccOf(item), credit: r.variance, debit: 0 },
          { acc: acc('stockVar'), debit: r.variance, credit: 0 }
        );
      }
    } else if (m.qty < 0) stockIn(m.itemId, m.whId, -m.qty, -m.value, undo);
    else {
      const d = stockValueAdj(m.itemId, m.whId, -m.value, undo),
        v = -m.value - d;
      if (v)
        extra.push(
          { acc: invAccOf(item), debit: -v, credit: 0 },
          { acc: acc('stockVar'), debit: v, credit: 0 }
        );
    }
  });
  return extra;
}
/* ---- المستندات المخزنية ---- */
const STOCK_TYPES = {
  opening: 'رصيد افتتاحي',
  receipt: 'إذن استلام',
  issue: 'إذن صرف',
  transfer: 'تحويل بين المخازن',
  adjust: 'تسوية مخزنية',
  count: 'جرد'
};
function saveStockDoc(d) {
  need('stock', d.id ? 'edit' : 'add');
  return DB.tx('sd', () => {
    if (!STOCK_TYPES[d.type]) fail('نوع المستند غير صحيح');
    if (!isDate(d.date)) fail('حدد التاريخ');
    if (!d.whId) fail('حدد المخزن');
    if (d.type === 'transfer' && (!d.toWhId || d.toWhId === d.whId)) fail('حدد مخزنًا مختلفًا للتحويل');
    const lines = (d.lines || []).filter(l => l.itemId);
    if (!lines.length) fail('أضف صنفًا واحدًا على الأقل');
    lines.forEach(l => {
      const it = DB.get('items', l.itemId);
      if (d.type === 'count' && it.track && it.track !== 'none')
        fail(`الصنف ${it.name} متتبَّع؛ استخدم تسوية مخزنية بتحديد التشغيلات`);
      if (it.type !== 'stock') fail(`${it.name} صنف خدمي بلا مخزون`);
      if (!Number.isSafeInteger(l.qty)) fail('كمية غير صالحة');
      if (d.type === 'adjust' || d.type === 'count') {
        if (l.qty < 0 && d.type === 'count') fail('الكمية المعدودة لا تكون سالبة');
      } else if (l.qty <= 0) fail(`أدخل كمية صحيحة للصنف ${it.name}`);
      if (l.cost < 0) fail('التكلفة لا تكون سالبة');
    });
    if (new Set(lines.map(l => l.itemId)).size !== lines.length) fail('لا تكرر الصنف في المستند نفسه');
    let s;
    if (d.id) {
      s = DB.mut('stockDocs', d.id);
      if (s.status !== 'draft') fail('لا يمكن تعديل مستند معتمد');
    } else
      s = DB.put('stockDocs', {
        id: uid(),
        no: nextNo('st'),
        status: 'draft',
        createdBy: Auth.user?.username || ''
      });
    Object.assign(s, {
      type: d.type,
      date: d.date,
      whId: d.whId,
      toWhId: d.toWhId || '',
      contraAcc: d.contraAcc || '',
      ccId: d.ccId || '',
      notes: d.notes || '',
      lines: lines.map(l => ({
        id: l.id || uid(),
        itemId: l.itemId,
        qty: l.qty,
        cost: l.cost || 0,
        lots: l.lots || null
      }))
    });
    return s;
  });
}
function approveStockDoc(id) {
  need('stock', 'approve');
  return DB.tx('sa', () => {
    const s = DB.mut('stockDocs', id);
    if (s.status !== 'draft') fail('المستند معتمد مسبقًا');
    assertOpen(s.date);
    inScope({ whId: s.whId });
    const src = { type: 'stock', id: s.id, no: s.no },
      J = [],
      branch = DB.get('warehouses', s.whId)?.branchId || '',
      title = STOCK_TYPES[s.type];
    const contra = s.type === 'opening' ? acc('openingOffset') : s.contraAcc || acc('stockVar');
    const inn = (l, val) => {
      const it = DB.get('items', l.itemId);
      stockIn(l.itemId, s.whId, l.qty2 || l.qty, val, { date: s.date, src, memo: title });
      J.push(
        { acc: invAccOf(it), debit: val, credit: 0 },
        { acc: contra, debit: 0, credit: val, cc: s.ccId }
      );
    };
    const out = (l, q) => {
      const it = DB.get('items', l.itemId),
        r = stockOut(l.itemId, s.whId, q, { date: s.date, src, memo: title });
      J.push(
        { acc: invAccOf(it), debit: 0, credit: r.cost },
        { acc: contra, debit: r.cost, credit: 0, cc: s.ccId }
      );
    };
    s.lines.forEach(l => {
      const it = DB.get('items', l.itemId);
      pendingLots = l.lots || null;
      if (s.type === 'opening' || s.type === 'receipt') inn(l, mulDiv(l.cost, l.qty, 1000));
      else if (s.type === 'issue') out(l, l.qty);
      else if (s.type === 'transfer') {
        const r = stockOut(l.itemId, s.whId, l.qty, { date: s.date, src, memo: 'تحويل صادر' });
        stockIn(l.itemId, s.toWhId, l.qty, r.cost, { date: s.date, src, memo: 'تحويل وارد' });
        l.cost = mulDiv(r.cost, 1000, l.qty);
      } else {
        /* adjust: l.qty فرق موقّع؛ count: l.qty المعدود */
        const cur = stockOf(l.itemId, s.whId).qty,
          diff = s.type === 'count' ? l.qty - cur : l.qty;
        l.bookQty = cur;
        l.diff = diff;
        if (diff > 0)
          inn(
            { ...l, qty2: diff },
            mulDiv(l.cost || avgCost(l.itemId, s.whId) || it.buyPrice || 0, diff, 1000)
          );
        else if (diff < 0) out(l, -diff);
      }
    });
    if (s.type === 'adjust' && !s.lines.some(l => l.diff)) fail('لا توجد فروق لتسويتها');
    const sumD = sum(J, l => l.debit);
    if (sumD > 0) {
      const j = postAuto({
        date: s.date,
        source: { type: 'stock', id: s.id, no: s.no },
        ref: s.no,
        memo: title + ' ' + s.no,
        lines: J,
        branch
      });
      s.jeId = j.id;
    }
    s.status = 'approved';
    s.approvedBy = Auth.user?.username || '';
    logA('اعتماد ' + title, s.no);
    return s;
  });
}
function cancelStockDoc(id, date) {
  need('stock', 'cancel');
  return DB.tx('sc', () => {
    const s = DB.mut('stockDocs', id);
    if (s.status !== 'approved') fail('المستند غير معتمد');
    assertOpen(date);
    const src = { type: 'stock-cancel', id: s.id, no: s.no },
      extra = reverseMoves('stock', s.id, date, src);
    if (s.jeId) reverseJE(s.jeId, date, `إلغاء ${s.no}`, extra);
    s.status = 'cancelled';
    logA('إلغاء مستند مخزني', s.no);
    return s;
  });
}

/* كشف حساب برصيد متحرك؛ مبني على القيود نفسها فيطابق الأستاذ دائمًا */
function statement(type, id, from, to) {
  const open = from
    ? sum(linesOf({ partyType: type, partyId: id, to: addDays(from, -1) }), l => l.debit - l.credit)
    : 0;
  let running = open;
  const rows = linesOf({ partyType: type, partyId: id, from, to }).map(l => {
    running += l.debit - l.credit;
    return {
      date: l.date,
      no: l.no,
      ref: l.ref,
      memo: l.memo,
      debit: l.debit,
      credit: l.credit,
      bal: running,
      jeId: l.jeId
    };
  });
  return { open, rows, close: running };
}
/* أعمار الديون: FIFO للحركات المقابلة؛ المجموع يساوي الرصيد الفعلي */
function agingOf(type, id, asOf) {
  const sign = type === 'customer' ? 1 : -1,
    L = linesOf({ partyType: type, partyId: id, to: asOf });
  const open = [];
  let credit = 0;
  L.forEach(l => {
    const a = (l.debit - l.credit) * sign;
    if (a > 0) open.push({ date: l.due || l.date, amt: a });
    else credit += -a;
  });
  open.sort((a, b) => (a.date < b.date ? -1 : 1));
  open.forEach(o => {
    const t = Math.min(o.amt, credit);
    o.amt -= t;
    credit -= t;
  });
  const b = { current: 0, d30: 0, d60: 0, d90: 0, over: 0, advance: credit };
  open.forEach(o => {
    const n = diffDays(asOf, o.date);
    if (n <= 0) b.current += o.amt;
    else if (n <= 30) b.d30 += o.amt;
    else if (n <= 60) b.d60 += o.amt;
    else if (n <= 90) b.d90 += o.amt;
    else b.over += o.amt;
  });
  b.total = b.current + b.d30 + b.d60 + b.d90 + b.over - credit;
  return b;
}

const DOC_KINDS = {

  so: { t: 'أمر بيع', mod: 'sales', side: 'customer', price: 1, wh: 1, next: ['delivery', 'si'] },

    wh: 1,
    pay: 1,
    next: ['sr', 'cn', 'dn']
  },
  sr: { t: 'مرتجع مبيعات', mod: 'sales', side: 'customer', price: 1, wh: 1, pay: 1 },
  cn: { t: 'إشعار دائن', mod: 'sales', side: 'customer', price: 1, free: 1 },

  rfq: { t: 'عرض سعر مورد', mod: 'purchases', side: 'supplier', price: 1, wh: 1, next: ['po'] },
  po: { t: 'أمر شراء', mod: 'purchases', side: 'supplier', price: 1, wh: 1, next: ['grn', 'pi'] },
  grn: { t: 'استلام مخزني', mod: 'purchases', side: 'supplier', price: 1, wh: 1, next: ['pi'] },
  pi: { t: 'فاتورة مشتريات', mod: 'purchases', side: 'supplier', price: 1, wh: 1, pay: 1, next: ['pret'] },
  pret: { t: 'مرتجع مشتريات', mod: 'purchases', side: 'supplier', price: 1, wh: 1, pay: 1 }
};
const isRet = k => k === 'sr' || k === 'pret';
const remaining = d => (d.totals?.totalBase || 0) - (d.paid || 0) - (d.credited || 0);
function propOf(total, taken, qty, doneQty, q) {
  return doneQty + q === qty ? total - taken : mulDiv(total, q, qty);
}
/* حساب المستند: كل المبالغ أعداد صحيحة، وأسطر الأساس تُجمع لتطابق الإجمالي تمامًا */
function calcDoc(d) {
  const rate = d.currency && d.currency !== set().baseCur ? d.rate || 0 : 1000000;
  const L = d.lines;
  if (isRet(d.kind) && d.srcId) {
    const src = DB.get('docs', d.srcId);
    L.forEach(l => {
      const o = src.lines.find(x => x.id === l.srcLineId);
      if (!o) fail('سطر المصدر غير موجود');
      const dq = o.done || 0,
        t = o.taken || {};
      l.net = propOf(o.net, t.net || 0, o.qty, dq, l.qty);
      l.tax = propOf(o.tax, t.tax || 0, o.qty, dq, l.qty);
      l.netBase = propOf(o.netBase, t.netBase || 0, o.qty, dq, l.qty);
      l.taxBase = propOf(o.taxBase, t.taxBase || 0, o.qty, dq, l.qty);
      l.gross = l.net;
      l.disc = 0;
      l.grossBase = l.netBase;
      l.total = l.net + l.tax;
      if (o.cost != null) l.cost = propOf(o.cost, t.cost || 0, o.qty, dq, l.qty);
    });

/* سلسلة المستندات كاملة: يصعد للجذر ثم ينزل لكل ما تفرع عنه */
function docChain(id) {
  let root = DB.get('docs', id),
    g = 0;
  while (root.srcId && DB.has('docs', root.srcId) && g++ < 20) root = DB.get('docs', root.srcId);
  const kids = cached('docKids', () => {
      const m = new Map();
      DB.all('docs').forEach(d => {
        const ps = new Set([d.srcId, ...d.lines.map(l => l.srcDocId)].filter(Boolean));
        ps.forEach(p => (m.get(p) || m.set(p, []).get(p)).push(d));
      });
      return m;
    }),
    seen = new Set(),
    out = [];
  const walk = (d, lv) => {
    if (seen.has(d.id)) return;
    seen.add(d.id);
    out.push({ d, lv });
    (kids.get(d.id) || []).sort((a, b) => (a.date < b.date ? -1 : 1)).forEach(k => walk(k, lv + 1));
  };
  walk(root, 0);
  return out;
}

function voucherParty(v) {

    .filter(d => d.kind === k && d.partyId === id && d.status === 'approved' && remaining(d) > 0)

function allocVoucher(v, manual) {
  const p = voucherParty(v);
  if (!p) return;
  const incomingToInvoice =
    (v.kind === 'R' && p[0] === 'customer') || (v.kind === 'P' && p[0] === 'supplier');
  if (!incomingToInvoice) return;
  let left = v.amountBase - sum(v.allocs || [], a => a.amt);
  v.allocs = v.allocs || [];
  const apply = (inv, amt) => {
    if (amt <= 0) return;
    const x = DB.mut('docs', inv.id);
    if (amt > remaining(x)) fail(`التخصيص يتجاوز المتبقي على ${x.no}`);
    x.paid = (x.paid || 0) + amt;
    v.allocs.push({ docId: x.id, amt });
    left -= amt;
  };
  if (manual)
    manual.forEach(m => {
      const i = DB.get('docs', m.docId);
      if (m.amt > left) fail('التخصيص أكبر من مبلغ السند');
      apply(i, m.amt);

    openInvoices(p[0], p[1]).forEach(i => {

    const contra = voucherContra(v, p);
