function closeYearEntries(y) {
  need('periods', 'approve');
  return DB.tx('cy', () => {
    const from = fyStart(y),
      to = fyEnd(y),
      key = `je:yearclose:${y}:post`;
    if (DB.has('journals', key) && !DB.get('journals', key).reversedBy) fail('تم إقفال هذه السنة مسبقًا');
    const b = balances({ from, to, noClosing: true }),
      L = [];
    let net = 0;
    DB.all('accounts')
      .filter(a => !a.group && (a.type === 'revenue' || a.type === 'expense'))
      .forEach(a => {
        const x = b[a.id];
        if (!x) return;
        const n = x.d - x.c;
        if (n) {
          L.push({ acc: a.id, debit: n < 0 ? -n : 0, credit: n > 0 ? n : 0 });
          net += n;
        }
      });
    if (!L.length) fail('لا توجد إيرادات أو مصروفات لإقفالها');
    L.push({ acc: acc('retained'), debit: net > 0 ? net : 0, credit: net < 0 ? -net : 0 });
    const st = DB.mut('meta', 'settings');
    const event = DB.has('journals', key) ? 'v' + Date.now() : 'post';
    const j = postAuto({
      date: to,
      type: 'closing',
      source: { type: 'yearclose', id: String(y), event, no: String(y) },
      memo: `إقفال السنة المالية ${y}`,
      lines: L
    });
    st.closedThrough = to;
    st.fiscalYear = Number(y) + 1;
    logA('إقفال سنة مالية', String(y));
    return j;
  });

/* التشغيلات والأرقام التسلسلية: كل حركة لصنف متتبَّع يجب أن تحدد تفاصيلها */

  L.forEach(x => {
    if (!x.no) fail('رقم التشغيلة مطلوب');
    if (it.track === 'serial' && x.qty !== 1000) fail('الرقم التسلسلي لوحدة واحدة فقط');
    const id = lotId(b.itemId, b.whId, x.no);
    if (qty > 0) {
      if (
        it.track === 'serial' &&
        DB.all('lots').some(z => z.itemId === b.itemId && z.no === x.no && z.qty > 0)
      )
        fail(`الرقم التسلسلي ${x.no} موجود مسبقًا`);
      const z = DB.has('lots', id)
        ? DB.mut('lots', id)
        : DB.put('lots', { id, itemId: b.itemId, whId: b.whId, no: x.no, qty: 0, exp: x.exp || '' });
      z.qty += x.qty;
      if (x.exp) z.exp = x.exp;
    } else {
      const z = DB.has('lots', id) && DB.mut('lots', id);
      if (!z || z.qty < x.qty) fail(`التشغيلة ${x.no} غير متوفرة بهذه الكمية`);
      z.qty -= x.qty;
    }
  });
  return L.map(x => ({ ...x }));
}
/* حركة مخزنية على رصيد صنف في مخزن؛ at = { date, src, memo } يصف المصدر */
function addMove(b, qty, value, { date, src, memo }) {
  const lots = applyLots(b, qty);
  b.qty += qty;
  b.value += value;
  if (date > b.lastDate) b.lastDate = date;
  return DB.put('stockMoves', {
    id: uid(),
    seq: moveSeq(),
    date,
    itemId: b.itemId,
    whId: b.whId,
    qty,
    value,
    balQty: b.qty,
    balValue: b.value,
    srcType: src.type,
    srcId: src.id,
    srcNo: src.no,
    memo: memo || '',
    lots
  });
}
function stockIn(itemId, whId, qty, value, at) {
  const item = DB.get('items', itemId);
  if (qty <= 0) fail('الكمية يجب أن تكون أكبر من صفر');
  if (value < 0) fail('القيمة لا يمكن أن تكون سالبة');
  const b = stockRow(itemId, whId);
  checkStockDate(b, at.date, item);
  addMove(b, qty, value, at);
  return value;
}
/* صرف: يعيد {cost, variance}. variance يظهر عند تكلفة مفروضة (مرتجع/إلغاء) لا تطابق الرصيد */
function stockOut(itemId, whId, qty, at, forced) {
  const item = DB.get('items', itemId),
    b = stockRow(itemId, whId);
  if (qty <= 0) fail('الكمية يجب أن تكون أكبر من صفر');
  checkStockDate(b, at.date, item);
  if (qty > b.qty) fail(`الكمية غير متوفرة من ${item.name}: المتاح ${fq(b.qty)} والمطلوب ${fq(qty)}`);
  const cost = forced == null ? (qty === b.qty ? b.value : mulDiv(b.value, qty, b.qty)) : forced;
  let actual = cost;
  if (qty === b.qty) actual = b.value;
  else if (actual > b.value) actual = b.value;
  addMove(b, -qty, -actual, at);
  return { cost: actual, variance: actual - cost };
}
/* تعديل قيمة دون كمية (فرق سعر فاتورة عن الاستلام). يعيد الجزء المطبق */
function stockValueAdj(itemId, whId, diff, at) {
  const b = stockRow(itemId, whId);
  if (!diff || !b.qty) return 0;
  const d = Math.max(diff, -b.value);
  if (!d) return 0;
  addMove(b, 0, d, at);
  return d;
}
/* عكس حركات مستند: يعيد أسطر القيد الموازنة لأي فرق تقييم */
function reverseMoves(srcType, srcId, date, src) {
  const undo = { date, src, memo: 'إلغاء' };
  const ms = DB.all('stockMoves')
      .filter(m => m.srcType === srcType && m.srcId === srcId && !m.reversed)
      .sort((a, b) => b.seq - a.seq),
    extra = [];
  ms.forEach(m => {
    DB.mut('stockMoves', m.id).reversed = true;
    const item = DB.get('items', m.itemId);
    pendingLots = m.lots || null;
    if (m.qty > 0) {
      const r = stockOut(m.itemId, m.whId, m.qty, undo, m.value);
      if (r.variance) {
        extra.push(
          { acc: invAccOf(item), credit: r.variance, debit: 0 },
          { acc: acc('stockVar'), debit: r.variance, credit: 0 }
        );
      }
    } else if (m.qty < 0) stockIn(m.itemId, m.whId, -m.qty, -m.value, undo);
    else {
      const d = stockValueAdj(m.itemId, m.whId, -m.value, undo),
        v = -m.value - d;
      if (v)
        extra.push(
          { acc: invAccOf(item), debit: -v, credit: 0 },
          { acc: acc('stockVar'), debit: v, credit: 0 }
        );
    }
  });
  return extra;
}
/* ---- المستندات المخزنية ---- */
const STOCK_TYPES = {

function approveStockDoc(id) {
  need('stock', 'approve');
  return DB.tx('sa', () => {
    const s = DB.mut('stockDocs', id);
    if (s.status !== 'draft') fail('المستند معتمد مسبقًا');
    assertOpen(s.date);
    inScope({ whId: s.whId });
    const src = { type: 'stock', id: s.id, no: s.no },
      J = [],
      branch = DB.get('warehouses', s.whId)?.branchId || '',
      title = STOCK_TYPES[s.type];
    const contra = s.type === 'opening' ? acc('openingOffset') : s.contraAcc || acc('stockVar');
    const inn = (l, val) => {
      const it = DB.get('items', l.itemId);
      stockIn(l.itemId, s.whId, l.qty2 || l.qty, val, { date: s.date, src, memo: title });
      J.push(
        { acc: invAccOf(it), debit: val, credit: 0 },
        { acc: contra, debit: 0, credit: val, cc: s.ccId }
      );
    };
    const out = (l, q) => {
      const it = DB.get('items', l.itemId),
        r = stockOut(l.itemId, s.whId, q, { date: s.date, src, memo: title });
      J.push(
        { acc: invAccOf(it), debit: 0, credit: r.cost },
        { acc: contra, debit: r.cost, credit: 0, cc: s.ccId }
      );
    };
    s.lines.forEach(l => {
      const it = DB.get('items', l.itemId);
      pendingLots = l.lots || null;
      if (s.type === 'opening' || s.type === 'receipt') inn(l, mulDiv(l.cost, l.qty, 1000));
      else if (s.type === 'issue') out(l, l.qty);
      else if (s.type === 'transfer') {
        const r = stockOut(l.itemId, s.whId, l.qty, { date: s.date, src, memo: 'تحويل صادر' });
        stockIn(l.itemId, s.toWhId, l.qty, r.cost, { date: s.date, src, memo: 'تحويل وارد' });
        l.cost = mulDiv(r.cost, 1000, l.qty);
      } else {
        /* adjust: l.qty فرق موقّع؛ count: l.qty المعدود */
        const cur = stockOf(l.itemId, s.whId).qty,
          diff = s.type === 'count' ? l.qty - cur : l.qty;
        l.bookQty = cur;
        l.diff = diff;
        if (diff > 0)
          inn(
            { ...l, qty2: diff },
            mulDiv(l.cost || avgCost(l.itemId, s.whId) || it.buyPrice || 0, diff, 1000)
          );
        else if (diff < 0) out(l, -diff);
      }
    });
    if (s.type === 'adjust' && !s.lines.some(l => l.diff)) fail('لا توجد فروق لتسويتها');
    const sumD = sum(J, l => l.debit);
    if (sumD > 0) {
      const j = postAuto({
        date: s.date,
        source: { type: 'stock', id: s.id, no: s.no },
        ref: s.no,
        memo: title + ' ' + s.no,
        lines: J,
        branch
      });
      s.jeId = j.id;
    }
    s.status = 'approved';
    s.approvedBy = Auth.user?.username || '';
    logA('اعتماد ' + title, s.no);
    return s;
  });
}

/* كشف حساب برصيد متحرك؛ مبني على القيود نفسها فيطابق الأستاذ دائمًا */
function statement(type, id, from, to) {
  const open = from
    ? sum(linesOf({ partyType: type, partyId: id, to: addDays(from, -1) }), l => l.debit - l.credit)
    : 0;
  let running = open;
  const rows = linesOf({ partyType: type, partyId: id, from, to }).map(l => {
    running += l.debit - l.credit;
    return {
      date: l.date,
      no: l.no,
      ref: l.ref,
      memo: l.memo,
      debit: l.debit,
      credit: l.credit,
      bal: running,
      jeId: l.jeId
    };
  });
  return { open, rows, close: running };
}
/* أعمار الديون: FIFO للحركات المقابلة؛ المجموع يساوي الرصيد الفعلي */
function agingOf(type, id, asOf) {
  const sign = type === 'customer' ? 1 : -1,
    L = linesOf({ partyType: type, partyId: id, to: asOf });
  const open = [];
  let credit = 0;
  L.forEach(l => {
    const a = (l.debit - l.credit) * sign;
    if (a > 0) open.push({ date: l.due || l.date, amt: a });
    else credit += -a;
  });
  open.sort((a, b) => (a.date < b.date ? -1 : 1));
  open.forEach(o => {
    const t = Math.min(o.amt, credit);
    o.amt -= t;
    credit -= t;
  });
  const b = { current: 0, d30: 0, d60: 0, d90: 0, over: 0, advance: credit };
  open.forEach(o => {
    const n = diffDays(asOf, o.date);
    if (n <= 0) b.current += o.amt;
    else if (n <= 30) b.d30 += o.amt;
    else if (n <= 60) b.d60 += o.amt;
    else if (n <= 90) b.d90 += o.amt;
    else b.over += o.amt;
  });
  b.total = b.current + b.d30 + b.d60 + b.d90 + b.over - credit;
  return b;
}

const DOC_KINDS = {
  quote: { t: 'عرض سعر', mod: 'sales', side: 'customer', price: 1, next: ['so', 'si'] },
  so: { t: 'أمر بيع', mod: 'sales', side: 'customer', price: 1, wh: 1, next: ['delivery', 'si'] },
  delivery: { t: 'إذن تسليم', mod: 'sales', side: 'customer', price: 1, wh: 1, next: ['si'] },
  si: {
    t: 'فاتورة مبيعات',
    mod: 'sales',
    side: 'customer',
    price: 1,
    wh: 1,
    pay: 1,
    next: ['sr', 'cn', 'dn']
  },
  sr: { t: 'مرتجع مبيعات', mod: 'sales', side: 'customer', price: 1, wh: 1, pay: 1 },
  cn: { t: 'إشعار دائن', mod: 'sales', side: 'customer', price: 1, free: 1 },
  dn: { t: 'إشعار مدين', mod: 'sales', side: 'customer', price: 1, free: 1 },
  pr: { t: 'طلب شراء', mod: 'purchases', side: null, wh: 1, next: ['rfq', 'po'] },
  rfq: { t: 'عرض سعر مورد', mod: 'purchases', side: 'supplier', price: 1, wh: 1, next: ['po'] },
  po: { t: 'أمر شراء', mod: 'purchases', side: 'supplier', price: 1, wh: 1, next: ['grn', 'pi'] },
  grn: { t: 'استلام مخزني', mod: 'purchases', side: 'supplier', price: 1, wh: 1, next: ['pi'] },
  pi: { t: 'فاتورة مشتريات', mod: 'purchases', side: 'supplier', price: 1, wh: 1, pay: 1, next: ['pret'] },
  pret: { t: 'مرتجع مشتريات', mod: 'purchases', side: 'supplier', price: 1, wh: 1, pay: 1 }
};
const isRet = k => k === 'sr' || k === 'pret';
const remaining = d => (d.totals?.totalBase || 0) - (d.paid || 0) - (d.credited || 0);
function propOf(total, taken, qty, doneQty, q) {
  return doneQty + q === qty ? total - taken : mulDiv(total, q, qty);
}
/* حساب المستند: كل المبالغ أعداد صحيحة، وأسطر الأساس تُجمع لتطابق الإجمالي تمامًا */
function calcDoc(d) {
  const rate = d.currency && d.currency !== set().baseCur ? d.rate || 0 : 1000000;
  const L = d.lines;
  if (isRet(d.kind) && d.srcId) {
    const src = DB.get('docs', d.srcId);
    L.forEach(l => {
      const o = src.lines.find(x => x.id === l.srcLineId);
      if (!o) fail('سطر المصدر غير موجود');
      const dq = o.done || 0,
        t = o.taken || {};
      l.net = propOf(o.net, t.net || 0, o.qty, dq, l.qty);
      l.tax = propOf(o.tax, t.tax || 0, o.qty, dq, l.qty);
      l.netBase = propOf(o.netBase, t.netBase || 0, o.qty, dq, l.qty);
      l.taxBase = propOf(o.taxBase, t.taxBase || 0, o.qty, dq, l.qty);
      l.gross = l.net;
      l.disc = 0;
      l.grossBase = l.netBase;
      l.total = l.net + l.tax;
      if (o.cost != null) l.cost = propOf(o.cost, t.cost || 0, o.qty, dq, l.qty);
    });
  } else {
    L.forEach(l => {
      l.gross = mulDiv(l.price || 0, l.uqty ?? l.qty, 1000);
      l.disc = pctOf(l.gross, l.discBp || 0);
      l.net = l.gross - l.disc;
    });
    const hd = d.discount || 0,
      base = sum(L, l => l.net);
    if (hd > base) fail('الخصم أكبر من قيمة المستند');
    if (hd < 0) fail('الخصم لا يكون سالبًا');
    const parts = allocate(
      hd,
      L.map(l => l.net)
    );
    L.forEach((l, i) => {
      l.disc += parts[i];
      l.net -= parts[i];
      l.tax = pctOf(l.net, l.taxBp || 0);
      l.total = l.net + l.tax;
      l.grossBase = toBase(l.gross, rate);
      l.netBase = toBase(l.net, rate);
      l.taxBase = toBase(l.tax, rate);
    });
  }
  const T = k => sum(L, l => l[k]);
  d.totals = {
    gross: T('gross'),
    disc: T('disc'),
    net: T('net'),
    tax: T('tax'),
    total: T('total'),
    grossBase: T('grossBase'),
    netBase: T('netBase'),
    taxBase: T('taxBase'),
    discBase: T('grossBase') - T('netBase'),
    totalBase: T('netBase') + T('taxBase')
  };
  return d;
}
/* ---- حفظ المستند: تحقق، ثم إنشاء أو تعديل المسودة ---- */
function validateDocHead(d, K) {
  if (!isDate(d.date)) fail('حدد التاريخ');

      ccId: s.ccId,

      repId: '',

      paidNow: 0

      qty: rem,

    kind,
    date: today(),
    partyId: sideOK ? s.partyId : '',

    branchId: s.branchId,
    ccId: s.ccId,
    currency: s.currency,
    rate: s.rate,
    repId: s.repId,
    discount:
      isRet(kind) || !s.discount
        ? 0

            s.discount,
            sum(lines, l => mulDiv(l.price || 0, l.qty, 1000)),

      .filter(l => l.srcDocId)

/* سلسلة المستندات كاملة: يصعد للجذر ثم ينزل لكل ما تفرع عنه */
function docChain(id) {
  let root = DB.get('docs', id),
    g = 0;
  while (root.srcId && DB.has('docs', root.srcId) && g++ < 20) root = DB.get('docs', root.srcId);
  const kids = cached('docKids', () => {
      const m = new Map();
      DB.all('docs').forEach(d => {
        const ps = new Set([d.srcId, ...d.lines.map(l => l.srcDocId)].filter(Boolean));
        ps.forEach(p => (m.get(p) || m.set(p, []).get(p)).push(d));
      });
      return m;
    }),
    seen = new Set(),
    out = [];
  const walk = (d, lv) => {
    if (seen.has(d.id)) return;
    seen.add(d.id);
    out.push({ d, lv });
    (kids.get(d.id) || []).sort((a, b) => (a.date < b.date ? -1 : 1)).forEach(k => walk(k, lv + 1));
  };
  walk(root, 0);
  return out;
}

function voucherParty(v) {

function openInvoices(type, id) {

    .filter(d => d.kind === k && d.partyId === id && d.status === 'approved' && remaining(d) > 0)

function allocVoucher(v, manual) {
  const p = voucherParty(v);
  if (!p) return;
  const incomingToInvoice =
    (v.kind === 'R' && p[0] === 'customer') || (v.kind === 'P' && p[0] === 'supplier');
  if (!incomingToInvoice) return;
  let left = v.amountBase - sum(v.allocs || [], a => a.amt);
  v.allocs = v.allocs || [];
  const apply = (inv, amt) => {
    if (amt <= 0) return;
    const x = DB.mut('docs', inv.id);
    if (amt > remaining(x)) fail(`التخصيص يتجاوز المتبقي على ${x.no}`);
    x.paid = (x.paid || 0) + amt;
    v.allocs.push({ docId: x.id, amt });
    left -= amt;
  };
  if (manual)
    manual.forEach(m => {
      const i = DB.get('docs', m.docId);
      if (m.amt > left) fail('التخصيص أكبر من مبلغ السند');
      apply(i, m.amt);

    openInvoices(p[0], p[1]).forEach(i => {
      if (left > 0) apply(i, Math.min(left, remaining(i)));
    });
}
/* الطرف المقابل للنقدية: حساب العملاء/الموردين للأطراف، أو الحساب المختار أو الافتراضي */

function depSchedule(a) {

    } else amt = i === a.life - 1 ? dep - acc2 : mulDiv(dep, 1, a.life);

  const out = sum(linesOf({ acc: acc('vatOut'), from: f.from, to: f.to }), l => l.credit - l.debit),
    inp = sum(linesOf({ acc: acc('vatIn'), from: f.from, to: f.to }), l => l.debit - l.credit);
  const S = docsOf('si', f),
    Rr = docsOf('sr', f),
    PI = docsOf('pi', f),
    Pr = docsOf('pret', f);
  const CN = docsOf('cn', f),
    DN = docsOf('dn', f),
    FD = DB.all('finDocs').filter(
      x => x.status === 'approved' && x.tax && (!f.from || x.date >= f.from) && (!f.to || x.date <= f.to)
    ),
    fb = k =>
      sum(
        FD.filter(x => k.includes(x.kind)),
        x => x.amount
      );
  return {
    out,
    inp,
    net: out - inp,
    salesBase:
      sum(S, d => d.totals.netBase) -
      sum([...Rr, ...CN], d => d.totals.netBase) +
      sum(DN, d => d.totals.netBase) +
      fb(['income', 'deferred']),
    purchBase: sum(PI, d => d.totals.netBase) - sum(Pr, d => d.totals.netBase) + fb(['expense', 'prepaid'])
  };
}
/* فحص سلامة شامل */
function healthCheck() {
  const R = [];
  const ok = (t, c, d) => R.push({ t, ok: !!c, d: d || '' });
  const J = posted();
  const bad = J.filter(j => sum(j.lines, l => l.debit) !== sum(j.lines, l => l.credit));
  ok('كل القيود المرحلة متوازنة', !bad.length, bad.map(j => j.no).join('، '));
  const tb = trialBalance();
  ok('ميزان المراجعة متطابق', tb.balanced, `مدين ${fm(tb.T.md)} / دائن ${fm(tb.T.mc)}`);
  const bs = balanceSheet(today());
  ok(
    'الميزانية العمومية متوازنة',
    bs.balanced,
    `الأصول ${fm(bs.A)} / الالتزامات وحقوق الملكية ${fm(bs.L + bs.E)}`
  );
  const ar = accBal(acc('ar')),
    arS = sum(DB.all('customers'), c => partyBal('customer', c.id));
  ok('حساب العملاء يطابق كشوف العملاء', ar === arS, `الأستاذ ${fm(ar)} / الكشوف ${fm(arS)}`);
  const ap = -accBal(acc('ap')),
    apS = -sum(DB.all('suppliers'), c => partyBal('supplier', c.id));
  ok('حساب الموردين يطابق كشوف الموردين', ap === apS, `الأستاذ ${fm(ap)} / الكشوف ${fm(apS)}`);
  const invA = [
    ...new Set(
      DB.all('items')
        .filter(i => i.type === 'stock')
        .map(invAccOf)
    )
  ];
  if (!invA.includes(acc('inventory'))) invA.push(acc('inventory'));
  const inv = sum(invA, i => accBal(i)),
    st = sum(DB.all('stockBal'), b => b.value);
  ok('حساب المخزون يطابق تقييم المخزون', inv === st, `الأستاذ ${fm(inv)} / التقييم ${fm(st)}`);
  const replay = {};
  DB.all('stockMoves')
    .sort((a, b) => a.seq - b.seq)
    .forEach(m => {
      const k = balKey(m.itemId, m.whId),
        x = replay[k] || (replay[k] = { q: 0, v: 0 });
      x.q += m.qty;
      x.v += m.value;
    });
  ok(
    'أرصدة المخزون تطابق إعادة تشغيل الحركات',
    DB.all('stockBal').every(b => (replay[b.id]?.q || 0) === b.qty && (replay[b.id]?.v || 0) === b.value)
  );
  ok(
    'لا توجد كميات مخزون سالبة',
    DB.all('stockBal').every(b => b.qty >= 0 && b.value >= 0)
  );
  const docBad = DB.all('docs').filter(
    d =>
      d.status === 'approved' &&
      ['si', 'pi', 'sr', 'pret', 'cn', 'dn', 'grn'].includes(d.kind) &&
      !(d.jeId && DB.has('journals', d.jeId))
  );
  ok('كل مستند معتمد مرتبط بقيد', !docBad.length, docBad.map(d => d.no).join('، '));
  const allocM = new Map();
  DB.all('vouchers').forEach(v => {
    if (v.status === 'approved')
      (v.allocs || []).forEach(a => allocM.set(a.docId, (allocM.get(a.docId) || 0) + a.amt));
  });
  const paidBad = DB.all('docs').filter(
    d =>
      (d.kind === 'si' || d.kind === 'pi') &&
      d.status === 'approved' &&
      (d.paid || 0) !== (allocM.get(d.id) || 0)
  );
  ok('المدفوع على الفواتير يطابق تخصيص السندات', !paidBad.length, paidBad.map(d => d.no).join('، '));
  const off = accBal(acc('openingOffset'));
  ok(
    'الأرصدة الافتتاحية متوازنة',
    off === 0,
    off ? `فرق ${fm(Math.abs(off))} في حساب الأرصدة الافتتاحية` : ''
  );
  return R;
}

function monthRows(y) {
  const S = monthlySeries(y);
  return MONTHS.map((m, i) => ({
    m,
    sales: S.sales[i],
    exp: S.sales[i] - S.profit[i],
    profit: S.profit[i],
    chg: i && S.sales[i - 1] ? pctStr(S.sales[i], S.sales[i - 1]) : ''
  }));
}
const pctStr = (a, b) => (b ? (((a - b) / Math.abs(b)) * 100).toFixed(1) + '%' : '');
function ratios(asOf, from) {
  const b = balances({ to: asOf }),
    bal = a => (b[a]?.d || 0) - (b[a]?.c || 0),
    L = DB.all('accounts').filter(a => !a.group),
    sumCode = (pre, s) =>
      sum(
        L.filter(a => a.code.startsWith(pre)),
        a => bal(a.id)
      ) * s;
  const ca = sumCode('11', 1),
    cl = sumCode('21', -1),
    inv = accBal(acc('inventory'), { to: asOf }),
    cash = sum(DB.all('cashAccounts'), c => accBal(c.accountId, { to: asOf })),
    is = incomeStatement({ from, to: asOf }),
    bs = balanceSheet(asOf),
    ar = accBal(acc('ar'), { to: asOf }),
    x = (n, d, p = 2) => (d ? (n / d).toFixed(p) : '-'),
    pc = (n, d) => (d ? ((n / d) * 100).toFixed(1) + '%' : '-'),
    days = Math.max(1, diffDays(asOf, from) + 1);
  return [
    ['السيولة', null],
    ['نسبة التداول', x(ca, cl)],
    ['النسبة السريعة', x(ca - inv, cl)],
    ['نسبة النقدية', x(cash, cl)],
    ['رأس المال العامل', null, ca - cl],
    ['الربحية', null],
    ['هامش مجمل الربح', pc(is.gross, is.R)],
    ['هامش صافي الربح', pc(is.net, is.R)],
    ['العائد على الأصول', pc(is.net, bs.A)],
    ['العائد على حقوق الملكية', pc(is.net, bs.E)],
    ['كفاءة التشغيل', null],
    ['متوسط أيام التحصيل', x(ar * days, is.R, 0)],
    ['معدل دوران المخزون', x(is.C, inv)],
    ['نسبة الالتزامات إلى الأصول', pc(bs.L, bs.A)]
  ].map(r => ({ label: r[0], val: r[1], amt: r[2], b: r[1] === null && r[2] == null }));
}

      T(
        'إنشاء الشركة وشجرة الحسابات',
        DB.all('accounts').length === COA_TEMPLATES[tpl].rows.length && set().company.name,
        COA_TEMPLATES[tpl].name

      T(

      );
      T('ضريبة المخرجات والمدخلات', accBal(acc('vatOut')) === -54000 && accBal(acc('vatIn')) === 67500);
      const dbl = [
        () => approveDoc(r.si.id),

      ].every(f => {

const emps = () =>

function ensureRoles() {
  if (!DB.get('roles', 'admin') || DB.isReadOnly()) return;
  DB.tx('roles', () => {
    const D = defaultRoles(),
      st = DB.mut('meta', 'settings');
    if (!st.numbering.dn) st.numbering.dn = ['DBN-', 1];
    D.forEach(r => {
      const cur = DB.get('roles', r.id);
      if (!cur) {
        DB.put('roles', r);
        return;
      }
      if (cur.rv2) return;
      const m = DB.mut('roles', r.id);
      m.name = r.name;
      m.rv2 = true;
      for (const k in m.perms)
        if (m.perms[k].includes('approve') && !m.perms[k].includes('cancel')) m.perms[k].push('cancel');
      if (r.perms.sensitive) m.perms.sensitive = r.perms.sensitive;
      if (!m.perms.hr && r.perms.hr) m.perms.hr = r.perms.hr;
    });

function saveEmployee(d) {
  need('hr', d.id ? 'edit' : 'add');
  return DB.tx('emp', () => {
    if (!(d.name || '').trim()) fail('أدخل اسم الموظف');
    if (!(d.salary >= 0)) fail('الراتب غير صالح');
    if ((d.allow || 0) < 0) fail('البدلات لا تكون سالبة');
    const list = emps();
    const code = (d.code || '').trim() || 'EMP-' + String(list.length + 1).padStart(3, '0');
    if (list.some(e => e.code === code && e.id !== d.id)) fail('كود الموظف مستخدم مسبقًا');
    const e = d.id ? DB.mut('meta', d.id) : DB.put('meta', { id: 'emp:' + uid(), kind: 'employee' });
    const { id, kind, ...r } = d;
    Object.assign(e, r, { code, name: d.name.trim(), active: d.active !== false });

    return e;
  });
}
function deleteEmployee(id) {
  need('hr', 'delete');
  DB.tx('empd', () => {
    if (payrolls().some(p => p.lines.some(l => l.empId === id)))
      fail('للموظف مسيرات رواتب؛ يمكنك تعطيله بدلًا من ذلك');

function draftPayroll(month) {
  need('hr', 'add');
  return DB.tx('pd', () => {
    if (!/^\d{4}-\d{2}$/.test(month || '')) fail('حدد الشهر');
    const id = 'payroll:' + month,
      old = DB.get('meta', id);
    if (old && old.status !== 'cancelled') fail(`مسير ${month} موجود مسبقًا`);
    const L = emps()
      .filter(e => e.active !== false)
      .map(e => ({
        empId: e.id,
        name: e.name,
        ccId: e.ccId || '',
        basic: e.salary || 0,
        allow: e.allow || 0,
        bonus: 0,
        ded: 0
      }));
    if (!L.length) fail('أضف موظفًا نشطًا أولًا');
    const p = old ? DB.mut('meta', id) : DB.put('meta', { id, kind: 'payroll', month });
    Object.assign(p, { ver: (p.ver || 0) + (old ? 1 : 0), status: 'draft', lines: L, jeId: '' });
    return p;
  });
}
const payNet = l => l.basic + l.allow + (l.bonus || 0) - (l.ded || 0);
function savePayroll(id, lines) {
  need('hr', 'edit');
  return DB.tx('ps', () => {
    const p = DB.mut('meta', id);
    if (p.status !== 'draft') fail('لا يعدل المسير بعد الاعتماد');
    lines.forEach(l => {
      if (l.bonus < 0 || l.ded < 0 || Number.isNaN(l.bonus) || Number.isNaN(l.ded)) fail('قيمة غير صالحة');
      if (payNet(l) < 0) fail(`صافي راتب ${l.name} سالب`);
    });
    p.lines = lines;
    return p;
  });
}
function approvePayroll(id) {
  need('hr', 'approve');
  return DB.tx('pa', () => {
    const p = DB.mut('meta', id);
    if (p.status !== 'draft') fail('المسير معتمد مسبقًا');
    const total = sum(p.lines, payNet);
    if (!(total > 0)) fail('إجمالي المسير صفر');
    const J = p.lines
      .filter(l => payNet(l))
      .map(l => ({ acc: acc('salaries'), debit: payNet(l), credit: 0, cc: l.ccId }));
    J.push({ acc: acc('salariesDue'), debit: 0, credit: total });
    const no = 'رواتب ' + p.month;
    p.jeId = postAuto({
      date: monthEnd(p.month + '-01'),
      source: { type: 'payroll', id: p.id, event: 'v' + (p.ver || 0), no },
      ref: no,
      memo: `مسير ${no}`,
      lines: J
    }).id;
    p.status = 'approved';
    p.total = total;
    logA('اعتماد مسير رواتب', p.month);
    return p;
  });
}
function cancelPayroll(id, date) {
  need('hr', 'approve');
  return DB.tx('pc', () => {
    const p = DB.mut('meta', id);
    if (p.status !== 'approved') fail('المسير غير معتمد');
    reverseJE(p.jeId, date, `إلغاء مسير ${p.month}`);
    p.status = 'cancelled';
    logA('إلغاء مسير رواتب', p.month);
    return p;
  });
}

const FIELD_INPUTS = {
  select: (f, v, a) =>
    h`<select ${a} ${f.chg ? h`data-chg="${f.chg}"` : ''}>${optsHtml(typeof f.opts === 'function' ? f.opts() : f.opts, v, f.blank)}</select>`,

  image: (f, v) =>

  files: (f, v) =>

  text: (f, v, a) => h`<input type="text" ${a} value="${v || ''}" ${f.ph ? h`placeholder="${f.ph}"` : ''}>`,
  number: (f, v, a) => h`<input type="text" inputmode="decimal" class="num" ${a} value="${fmtIn(f, v)}">`
};
function field(f, v) {
  const attrs = h`name="${f.k}" id="f-${f.k}" ${f.req ? raw('required') : ''} ${f.ro ? raw('readonly') : ''}`;
  if (f.type === 'check')
    return h`<label class="chk ${f.full ? 'full' : ''}"><input type="checkbox" ${attrs} ${v ? raw('checked') : ''}><span>${f.t}</span></label>`;
  const make = FIELD_INPUTS[f.type] || (NUM_FIELDS[f.type] ? FIELD_INPUTS.number : FIELD_INPUTS.text);
  return h`<label class="fld ${f.full ? 'full' : ''}"><span>${f.t}${f.req ? h`<b class="req" aria-hidden="true"> *</b>` : ''}</span>${make(f, v, attrs)}${f.hint ? h`<small>${f.hint}</small>` : ''}</label>`;
}
/* قيمة حقل واحد من النموذج بعد التحويل والتحقق */
function readField(f, el) {
  if (f.type === 'check') return el.checked;
  if (f.type === 'files') return JSON.parse(el.value || '[]');
  const spec = NUM_FIELDS[f.type];
  if (!spec) return typeof el.value === 'string' ? el.value.trim() : el.value;
  const v = spec.parse(el.value);
  if (Number.isNaN(v)) fail(`قيمة غير صالحة في «${f.t}»`);
  return v;
}
function readFields(fields, root) {
  const o = {};
  fields.forEach(f => {
    const el = root.querySelector(`[name="${f.k}"]`);
    if (!el) return;
    const v = readField(f, el);
    if (f.req && (v === '' || v == null)) fail(`الحقل «${f.t}» مطلوب`);
    o[f.k] = v;
  });
  return o;
}

function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = () => {
        toast('تعذرت قراءة الصورة', 'err');
        rej(new AppError('صورة غير صالحة'));
      };
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)),
          c = document.createElement('canvas');
        c.width = im.width * k;
        c.height = im.height * k;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/png'));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
CHG.files = async el => {

  }
  const fresh = lastHash !== location.hash;
  lastHash = location.hash;
  /* التقارير تُحسب بعد إظهار مؤشر التحميل حتى لا تتجمد الواجهة */
  if (route.name === 'report' && fresh && !skipSkel) {
    main.innerHTML = '<div class="skeleton"><i></i><i></i><i></i><i></i></div>';
    Busy.on();
    const hash = location.hash;
    setTimeout(() => {
      Busy.off();
      if (location.hash === hash) {
        skipSkel = true;
        try {
          render();
        } finally {
          skipSkel = false;
        }
      }
    }, 20);
    return;
  }
  try {
    main.innerHTML = fn(...route.args).s;
    if (fresh) {
      main.scrollTop = 0;
      main.classList.remove('page-in');
      void main.offsetWidth;
      main.classList.add('page-in');
    }
    AFTER[route.name] && AFTER[route.name](...route.args, fresh);

    if (!(e instanceof AppError)) console.error(e);

function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    const gr = $('#gresults');
    if (gr && !gr.hidden && !e.target.closest('.search')) gr.hidden = true;
    const sm = e.target.closest('#side summary');
    if (sm) {
      const d = sm.parentElement,
        k = d.dataset.k;
      navOpen = d.open ? '-' : k;
      $$('#side details[open]').forEach(x => {
        if (x !== d) x.open = false;
      });
    } else if (document.documentElement.dataset.nav === 'mini' && !e.target.closest('#side'))
      $$('#side details[open]').forEach(x => (x.open = false));
    if (el && !el.disabled) {
      const f = ACT[el.dataset.act];
      if (f) {
        if (el.tagName === 'BUTTON' || el.getAttribute('href') === '#') e.preventDefault();
        f(el.dataset, el);
      } else console.error('إجراء غير معرف', el.dataset.act);
    }
    if (e.target.closest('#side a')) $('#app').classList.remove('side-open');
  });
  const chg = e => {
    const el = e.target.closest('[data-chg]');
    if (!el) return;
    const f = CHG[el.dataset.chg];
    if (f) f(el, e);
  };
  document.addEventListener('change', e => {
    if (e.target.matches('.tbl-q,#gsearch')) return;
    chg(e);
  });
  document.addEventListener('input', e => {
    if (e.target.matches('.tbl-q,#gsearch')) chg(e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (ModalStack.length) closeModal();
    }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) {
      e.preventDefault();
      const f = ACT[e.target.dataset.enter];
      f && f(e.target.dataset, e.target);
    }
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      const fm2 = e.target.closest('form[data-enter]');
      if (fm2) {
        e.preventDefault();
        ACT[fm2.dataset.enter]?.();
      }
    }
  });
  document.addEventListener('submit', e => e.preventDefault());
  window.addEventListener('hashchange', () => {
    closeAll();
    render();
  });
  setInterval(tickClock, 30000);
  window.addEventListener('namaa-dberror', e => {
    toast('تعذر حفظ البيانات في المتصفح: ' + (e.detail?.message || ''), 'err');
  });
  DB.onExternal(() => {
    if (Auth.user && !ModalStack.length) render();
  });
  DB.onWritable(() => {
    toast('أصبح هذا التبويب قابلًا للتعديل');
    if (Auth.user) render();
  });
}

const xesc = s =>
  String(s ?? '')
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')
    .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
/* رقم العمود (من صفر) إلى اسمه في Excel: 0→A، 26→AA */
const colName = i => {
  let s = '',
    n = i + 1;
  while (n > 0) {
    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = (n - m - 1) / 26;
  }
  return s;
};
/* sheets: [{name, rows:[[...]], widths}] ؛ الخلية {v, n:true, b:true} أو قيمة بسيطة */
async function makeXlsx(sheets) {
  const z = new JSZip();
  z.file(
    '[Content_Types].xml',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`
  );
  z.file(
    '_rels/.rels',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`
  );
  z.file(
    'xl/workbook.xml',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${sheets.map((s, i) => `<sheet name="${xesc(s.name.slice(0, 31).replace(/[\\/*?:\[\]]/g, ' '))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`
  );
  z.file(
    'xl/_rels/workbook.xml.rels',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`
  );
  z.file(
    'xl/styles.xml',
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00;[Red]-#,##0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE6EEEC"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`
  );
  sheets.forEach((s, i) => {
    const body = s.rows
      .map(
        (r, ri) =>
          `<row r="${ri + 1}">${r
            .map((c, ci) => {
              const o = c && typeof c === 'object' ? c : { v: c };
              if (o.v == null || o.v === '') return '';
              const ref = colName(ci) + (ri + 1);
              if (typeof o.v === 'number' || o.n)
                return `<c r="${ref}" s="${o.b ? 3 : o.int ? 0 : 2}"><v>${o.v}</v></c>`;
              return `<c r="${ref}" t="inlineStr" s="${o.h ? 1 : o.b ? 4 : 0}"><is><t xml:space="preserve">${xesc(o.v)}</t></is></c>`;
            })
            .join('')}</row>`
      )
      .join('');
    const maxC = Math.max(1, ...s.rows.map(r => r.length));
    z.file(
      `xl/worksheets/sheet${i + 1}.xml`,
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><cols><col min="1" max="${maxC}" width="20" customWidth="1"/></cols><sheetData>${body}</sheetData></worksheet>`
    );
  });
  return z.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    compression: 'DEFLATE'
  });
}
/* قراءة xlsx أو csv إلى صفوف كائنات حسب عناوين السطر الأول */
async function readSheet(file) {
  if (/\.csv$/i.test(file.name)) {
    const t = (await file.text()).replace(/^﻿/, '');
    return tableToObjs(parseCSV(t));
  }
  if (!/\.xlsx$/i.test(file.name)) fail('استخدم ملف xlsx أو csv');
  const z = await JSZip.loadAsync(file),
    P = new DOMParser();
  const sheetF = z.file('xl/worksheets/sheet1.xml') || z.file(/xl\/worksheets\/sheet.*\.xml/)[0];
  if (!sheetF) fail('الملف لا يحتوي على ورقة بيانات');
  const ssF = z.file('xl/sharedStrings.xml');
  let ss = [];
  if (ssF) {
    const d = P.parseFromString(await ssF.async('string'), 'application/xml');
    ss = [...d.getElementsByTagName('si')].map(si =>
      [...si.getElementsByTagName('t')].map(t => t.textContent).join('')
    );
  }
  const d = P.parseFromString(await sheetF.async('string'), 'application/xml'),
    rows = [];
  [...d.getElementsByTagName('row')].forEach(r => {
    const row = [];
    [...r.getElementsByTagName('c')].forEach(c => {
      const m = /^([A-Z]+)/.exec(c.getAttribute('r') || '');
      let idx = row.length;
      if (m) {
        idx = 0;
        for (const ch of m[1]) idx = idx * 26 + ch.charCodeAt(0) - 64;
        idx--;
      }
      const t = c.getAttribute('t'),
        v = c.getElementsByTagName('v')[0];
      let val = '';
      if (t === 's') val = ss[Number(v?.textContent)] ?? '';
      else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else val = v?.textContent ?? '';
      row[idx] = val;
    });
    rows.push(row);
  });
  return tableToObjs(rows);
}
function parseCSV(t) {
  const R = [];
  let r = [],
    c = '',
    q = false;
  for (let i = 0; i < t.length; i++) {
    const x = t[i];
    if (q) {
      if (x === '"') {
        if (t[i + 1] === '"') {
          c += '"';
          i++;
        } else q = false;
      } else c += x;
    } else if (x === '"') q = true;
    else if (x === ',') {
      r.push(c);
      c = '';
    } else if (x === '\n') {
      r.push(c.replace(/\r$/, ''));
      R.push(r);
      r = [];
      c = '';
    } else c += x;
  }
  if (c || r.length) {
    r.push(c);
    R.push(r);
  }
  return R;
}
function tableToObjs(rows) {
  const hdr = (rows[0] || []).map(x => String(x ?? '').trim());
  return rows
    .slice(1)
    .filter(r => r.some(v => String(v ?? '').trim()))
    .map(r => Object.fromEntries(hdr.map((k, i) => [k, String(r[i] ?? '').trim()])));
}

/* PDF: ترسم الصفحة كما يراها المتصفح (فتبقى العربية سليمة) ثم تُلفّ JPEG داخل ملف PDF */
function printCss() {
  return $('#app-css').textContent;
}
async function nodeToCanvas(node, widthPx) {
  const breaks = $$('tr,.pdf-keep', node).map(
    e => e.getBoundingClientRect().bottom - node.getBoundingClientRect().top
  );
  const w = widthPx,
    hgt = Math.ceil(node.scrollHeight) + 70,
    scale = 2;
  const inner = new XMLSerializer().serializeToString(node);
  const css = printCss();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hgt}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="background:#fff;width:${w}px"><style>${css.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</style>${inner}</div></foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = () => rej(new Error('svg'));
  });
  const c = document.createElement('canvas');
  c.width = w * scale;
  c.height = hgt * scale;
  const x = c.getContext('2d');
  x.fillStyle = '#fff';
  x.fillRect(0, 0, c.width, c.height);
  x.scale(scale, scale);
  x.drawImage(img, 0, 0);
  c.toDataURL('image/jpeg', 0.5); /* يكشف منع القراءة في بعض المتصفحات */
  return { canvas: c, breaks: breaks.map(b => Math.round(b * scale)), scale };
}
function jpegPagesToPdf(pages) {
  /* pages: [{bytes,w,h}] A4 */
  const PW = 595.28,
    PH = 841.89,
    enc = new TextEncoder(),
    parts = [],
    off = [];
  let pos = 0;
  const push = b => {
    const u = typeof b === 'string' ? enc.encode(b) : b;
    parts.push(u);
    pos += u.length;
  };
  const obj = (n, fn) => {
    off[n] = pos;
    push(`${n} 0 obj\n`);
    fn();
    push('\nendobj\n');
  };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const n = pages.length,
    total = 2 + n * 3;
  obj(1, () => push('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2, () => push(`<</Type/Pages/Count ${n}/Kids[${pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}]>>`));
  pages.forEach((p, i) => {
    const pg = 3 + i * 3,
      ct = pg + 1,
      im = pg + 2,
      m = 24,
      sw = PW - 2 * m,
      sh = (sw * p.h) / p.w,
      y = PH - m - sh;
    obj(pg, () =>
      push(
        `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${PW} ${PH}]/Resources<</XObject<</I ${im} 0 R>>>>/Contents ${ct} 0 R>>`
      )
    );
    const cs = `q ${sw.toFixed(2)} 0 0 ${sh.toFixed(2)} ${m} ${y.toFixed(2)} cm /I Do Q`;
    obj(ct, () => {
      push(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
    });
    obj(im, () => {
      push(
        `<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.bytes.length}>>\nstream\n`
      );
      push(p.bytes);
      push('\nendstream');
    });
  });
  const xref = pos;
  push(`xref\n0 ${total + 1}\n0000000000 65535 f \n`);
  for (let i = 1; i <= total; i++) push(String(off[i]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<</Size ${total + 1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
const b64bytes = u => {
  const s = atob(u.split(',')[1]),
    a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
};
async function htmlToPdf(html) {
  const host = document.createElement('div');
  host.className = 'pdf-host';
  host.innerHTML = `<div class="doc-print">${html}</div>`;
  document.body.append(host);
  try {
    const node = host.firstChild,
      W = 794;
    const { canvas, breaks } = await nodeToCanvas(node, W);
    const pageH = Math.floor((canvas.width * (841.89 - 48)) / (595.28 - 48)),
      pages = [];
    let y = 0;
    while (y < canvas.height - 4) {
      let end = y + pageH;
      if (end < canvas.height) {
        const b = breaks.filter(v => v > y + 100 && v <= end).pop();
        if (b) end = b;
      } else end = canvas.height;
      const c = document.createElement('canvas');
      c.width = canvas.width;
      c.height = end - y;
      const x = c.getContext('2d');
      x.fillStyle = '#fff';
      x.fillRect(0, 0, c.width, c.height);
      x.drawImage(canvas, 0, -y);
      pages.push({ bytes: b64bytes(c.toDataURL('image/jpeg', 0.9)), w: c.width, h: c.height });
      y = end;
    }
    return jpegPagesToPdf(pages);
  } finally {
    host.remove();
  }
}
async function exportPdf(html, name) {
  Busy.on();
  try {
    const b = await htmlToPdf(html);
    download(b, name + '.pdf');
    toast('تم إنشاء ملف PDF');
    return b;
  } catch (e) {
    console.warn('PDF fallback', e);
    toast('هذا المتصفح لا يسمح بإنشاء PDF مباشرة؛ اختر «حفظ بصيغة PDF» من نافذة الطباعة', 'warn');
    printHtml(html);
  } finally {
    Busy.off();
  }
}
function printHtml(html, opt = {}) {
  const r = $('#print-root'),
    sz = opt.thermal ? 'size:80mm auto;margin:2mm' : `size:${set().print.paper || 'A4'};margin:12mm`;
  const st = document.createElement('style');
  st.textContent = `@media print{@page{${sz}}}`;
  document.head.append(st);
  r.innerHTML = `<div class="doc-print ${opt.thermal ? 'thermal' : ''}">${html}</div>`;
  document.body.classList.add('printing');
  const done = () => {
    document.body.classList.remove('printing');
    r.innerHTML = '';
    st.remove();
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  window.print();
  setTimeout(() => {
    if (document.body.classList.contains('printing') && !matchMedia('print').matches) done();
  }, 1500);
}
async function shareFile(blob, name) {
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try {
      await navigator.share({ files: [f], title: name });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  download(blob, name);
  toast('المشاركة غير مدعومة هنا؛ تم تنزيل الملف لإرساله');
}

const sparkSvg = d => {
  const W = 120,
    H = 34,
    mx = Math.max(...d),
    mn = Math.min(...d),
    r = mx - mn || 1,
    P = d.map((v, i) => [(W * i) / Math.max(1, d.length - 1), H - 3 - ((v - mn) * (H - 6)) / r]);
  const line = P.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${H} ${line} ${W},${H}"/><polyline points="${line}"/></svg>`;
};
/* شارة التغير عن الشهر السابق؛ في المصروفات الانخفاض هو الجيد */
function deltaBadge(trend, tone) {
  const n = trend.length,
    prev = trend[n - 2],
    dl = prev ? ((trend[n - 1] - prev) / Math.abs(prev)) * 100 : null;
  if (dl == null) return h`<em class="delta">${pctTxt(null)}<small>عن ${MONTHS[n - 2]}</small></em>`;
  const good = tone === 'exp' ? dl <= 0 : dl >= 0;
  return h`<em class="delta ${good ? 'up' : 'down'}">${icon(dl >= 0 ? 'up' : 'down')}${pctTxt(Math.abs(dl))}<small>عن ${MONTHS[n - 2]}</small></em>`;
}

function lineSetItem(l, itemId) {
  l.itemId = itemId;
  const it = DB.get('items', itemId);
  if (!it) return;
  l.price = (DOC_KINDS[DF.kind].mod === 'sales' ? it.sellPrice : it.buyPrice) || 0;

/* الكمية بالوحدة الأساسية لا تتجاوز المتبقي في المستند المصدر؛ يعيد false عند القص */
function lineWithinSource(l, base) {
  if (!l.srcLineId) return true;
  const o = srcLine(l),
    rem = o.qty - (o.done || 0);
  if (base <= rem) return true;
  toast(`المتبقي في المصدر ${fq(rem)}`, 'err');
  l.qty = rem;
  if (l.factor) l.uqty = mulDiv(rem, 1000, l.factor);
  return false;
}
const LINE_PARSERS = { qty: toQty, price: toMinor, discBp: toBp, taxBp: toBp };
/* قيمة رقمية في السطر؛ الكمية تُحوّل من وحدة البيع إلى الوحدة الأساسية */
function lineSetNumber(l, k, text) {
  const p = LINE_PARSERS[k](text);
  if (Number.isNaN(p) || p < 0) return toast('قيمة غير صالحة', 'err');
  if (k !== 'qty') {
    l[k] = p;
    return;
  }
  const base = l.factor ? mulDiv(p, l.factor, 1000) : p;
  if (!lineWithinSource(l, base)) return;
  if (l.factor) l.uqty = p;
  l.qty = base;
  delete l.lots;
}

/* ===== 26-pages-reports: تعريف التقارير وعرضها وتصديرها ===== */
const colMoney = (k, t) => ({ k, t, type: 'money' }),
  colQty = (k, t) => ({ k, t, type: 'qty' }),
  colText = (k, t) => ({ k, t });
const secRows = (title, list, sign = 1) => [
  { label: title, b: 1 },
  ...list.map(x => ({
    label: `${x.a.code} ${x.a.name}`,
    indent: 1,
    amt: x.v * sign,
    href: '#/ledger/' + x.a.id
  }))
];
const allParties = (t, f) =>
  DB.all(t === 'customer' ? 'customers' : 'suppliers').filter(p => !f.party || p.id === f.party);
const REPORTS = [
  {
    id: 'journal',
    g: 'acc',
    t: 'دفتر اليومية',
    f: ['period', 'account', 'branch', 'cc'],
    run: f => {
      const L = linesOf({
        from: f.from,
        to: f.to,
        branch: f.branch,
        cc: f.cc,
        accs: f.account ? leafIds(f.account) : undefined
      });
      return {
        cols: [
          colText('date', 'التاريخ'),
          colText('no', 'القيد'),
          colText('name', 'الحساب'),
          colText('memo', 'البيان'),
          colMoney('debit', 'مدين'),
          colMoney('credit', 'دائن')
        ],
        rows: L.map(l => ({ ...l, name: accName(l.acc) })),
        foot: { name: 'الإجمالي', debit: sum(L, l => l.debit), credit: sum(L, l => l.credit) }
      };
    }
  },
  {
    id: 'gl',
    g: 'acc',
    t: 'دفتر الأستاذ العام',
    f: ['period', 'account', 'branch', 'cc'],
    need: 'account',
    run: f => {
      const id = f.account;
      const ids = leafIds(id),
        op = f.from
          ? sum(
              linesOf({ accs: ids, to: addDays(f.from, -1), branch: f.branch, cc: f.cc }),
              l => l.debit - l.credit
            )
          : 0;
      let r = op;
      const rows = linesOf({ accs: ids, from: f.from, to: f.to, branch: f.branch, cc: f.cc }).map(l => {
        r += l.debit - l.credit;
        return {
          date: l.date,
          no: l.no,
          ref: l.ref,
          memo: l.memo,
          debit: l.debit,
          credit: l.credit,
          bal: r,
          href: `#/journal/${l.jeId}`
        };
      });
      return {
        cols: [
          colText('date', 'التاريخ'),
          colText('no', 'القيد'),
          colText('ref', 'المرجع'),
          colText('memo', 'البيان'),
          colMoney('debit', 'مدين'),
          colMoney('credit', 'دائن'),
          colMoney('bal', 'الرصيد')
        ],
        rows: [{ memo: 'رصيد أول المدة', bal: op, b: 1 }, ...rows],
        foot: { memo: 'الإجمالي', debit: sum(rows, x => x.debit), credit: sum(rows, x => x.credit), bal: r }
      };
    }
  },
  {
    id: 'subledger',
    g: 'acc',
    t: 'دفتر الأستاذ المساعد',
    f: ['period', 'partyType', 'party'],
    need: 'party',
    run: f => {
      const S = statement(f.partyType || 'customer', f.party, f.from, f.to);
      return {
        cols: [
          colText('date', 'التاريخ'),
          colText('no', 'القيد'),
          colText('ref', 'المرجع'),
          colText('memo', 'البيان'),
          colMoney('debit', 'مدين'),
          colMoney('credit', 'دائن'),
          colMoney('bal', 'الرصيد')
        ],
        rows: [
          { memo: 'رصيد أول المدة', bal: S.open, b: 1 },
          ...S.rows.map(x => ({ ...x, href: '#/journal/' + x.jeId }))
        ],
        foot: {
          memo: 'الإجمالي',
          debit: sum(S.rows, x => x.debit),
          credit: sum(S.rows, x => x.credit),
          bal: S.close
        }
      };
    }
  },
  {
    id: 'tb',
    g: 'acc',
    t: 'ميزان المراجعة بالأرصدة والحركات',
    f: ['period', 'branch', 'cc', 'level'],
    run: f => {
      const t = trialBalance(f);
      return {
        cols: [
          colText('code', 'الرقم'),
          colText('name', 'الحساب'),
          colMoney('od', 'افتتاحي مدين'),
          colMoney('oc', 'افتتاحي دائن'),
          colMoney('md', 'حركة مدين'),
          colMoney('mc', 'حركة دائن'),
          colMoney('cd', 'ختامي مدين'),
          colMoney('cc', 'ختامي دائن')
        ],
        rows: t.rows
          .filter(r => !f.level || (f.level === 'leaf' ? !r.b : r.indent < Number(f.level)))
          .map(r => ({ ...r, b: r.b && f.level !== 'leaf', href: '#/ledger/' + r.accId })),
        foot: { name: 'الإجمالي', ...t.T },
        status: t.balanced ? ['ok', 'الميزان متطابق'] : ['bad', 'الميزان غير متطابق']
      };
    }
  },
  {
    id: 'is',
    g: 'fs',
    t: 'قائمة الدخل',
    f: ['period', 'branch', 'cc'],
    run: f => {
      const s = incomeStatement(f);
      return {
        cols: [colText('label', 'البند'), colMoney('amt', 'المبلغ')],
        rows: [
          ...secRows('الإيرادات', s.rev),
          { label: 'صافي الإيرادات', amt: s.R, b: 1 },
          ...secRows('تكلفة المبيعات', s.cogs),
          { label: 'مجمل الربح', amt: s.gross, b: 1 },
          ...secRows('المصروفات', s.opex),
          { label: 'إجمالي المصروفات', amt: s.O, b: 1 }
        ],
        foot: { label: 'صافي الربح', amt: s.net }
      };
    }
  },
  {
    id: 'bs',
    g: 'fs',
    t: 'الميزانية العمومية',
    f: ['asof'],
    run: f => {
      const b = balanceSheet(f.to);
      return {
        cols: [colText('label', 'البند'), colMoney('amt', 'المبلغ')],
        rows: [
          ...secRows('الأصول', b.assets),
          { label: 'إجمالي الأصول', amt: b.A, b: 1 },
          ...secRows('الالتزامات', b.liab),
          { label: 'إجمالي الالتزامات', amt: b.L, b: 1 },
          ...secRows('حقوق الملكية', b.eq),
          { label: 'أرباح الفترة غير المقفلة', indent: 1, amt: b.pl },
          { label: 'إجمالي حقوق الملكية', amt: b.E, b: 1 }
        ],
        foot: { label: 'الالتزامات وحقوق الملكية', amt: b.L + b.E },
        status: b.balanced ? ['ok', 'الميزانية متوازنة'] : ['bad', 'الميزانية غير متوازنة']
      };
    }
  },
  {
    id: 'cf',
    g: 'fs',
    t: 'قائمة التدفقات النقدية',
    f: ['period'],
    run: f => {
      const c = cashFlow(f),
        sec = (t, o, v) => [
          { label: t, b: 1 },
          ...Object.entries(o).map(([k, a]) => ({ label: k, indent: 1, amt: a })),
          { label: 'صافي ' + t, amt: v, b: 1 }
        ];
      return {
        cols: [colText('label', 'البند'), colMoney('amt', 'المبلغ')],
        rows: [
          { label: 'النقدية أول الفترة', amt: c.openB, b: 1 },
          ...sec('الأنشطة التشغيلية', c.cat.op, c.O),
          ...sec('الأنشطة الاستثمارية', c.cat.inv, c.I),
          ...sec('الأنشطة التمويلية', c.cat.fin, c.F),
          { label: 'صافي التغير في النقدية', amt: c.net, b: 1 }
        ],
        foot: { label: 'النقدية آخر الفترة', amt: c.closeB },
        status: c.check ? ['ok', 'مطابقة لأرصدة النقدية'] : ['bad', 'غير مطابقة']
      };
    }
  },
  {
    id: 'eq',
    g: 'fs',
    t: 'قائمة التغيرات في حقوق الملكية',
    f: ['period'],
    run: f => {
      const e = equityChanges(f);
      return {
        cols: [
          colText('name', 'البند'),
          colMoney('open', 'أول الفترة'),
          colMoney('add', 'إضافات'),
          colMoney('red', 'تخفيضات'),
          colMoney('close', 'آخر الفترة')
        ],
        rows: [...e.rows, e.plRow],
        foot: {
          name: 'إجمالي حقوق الملكية',
          open: sum(e.rows, r => r.open) + e.plRow.open,
          add: sum(e.rows, r => r.add) + e.plRow.add,
          red: sum(e.rows, r => r.red) + e.plRow.red,
          close: e.total
        },
        status: e.ok ? ['ok', 'مطابقة للميزانية العمومية'] : ['bad', 'غير مطابقة للميزانية']
      };
    }
  },
  {
    id: 'vat',
    g: 'fs',
    t: 'ملخص ضريبة القيمة المضافة',
    f: ['period'],
    run: f => {
      const v = vatReport(f);
      return {
        cols: [colText('label', 'البند'), colMoney('base', 'الأساس'), colMoney('amt', 'الضريبة')],
        rows: [
          { label: 'المبيعات (المخرجات)', base: v.salesBase, amt: v.out },
          { label: 'المشتريات والمصروفات (المدخلات)', base: v.purchBase, amt: v.inp }
        ],
        foot: { label: 'الصافي المستحق', amt: v.net }
      };
    }
  },
  {
    id: 'sales',
    g: 'op',
    t: 'تقرير المبيعات',
    f: ['period', 'customer', 'branch', 'cc'],
    run: f => {
      const S = ['si', 'sr', 'cn', 'dn']
          .flatMap(k => docsOf(k, { ...f, party: f.customer }))
          .sort((a, b) => (a.date < b.date ? -1 : 1)),
        s = d => (d.kind === 'si' || d.kind === 'dn' ? 1 : -1);
      return {
        cols: [
          colText('date', 'التاريخ'),
          colText('no', 'الرقم'),
          colText('type', 'النوع'),
          colText('p', 'العميل'),
          colMoney('net', 'الصافي'),
          colMoney('tax', 'الضريبة'),
          colMoney('tot', 'الإجمالي')
        ],
        rows: S.map(d => ({
          date: d.date,
          no: d.no,
          type: DOC_KINDS[d.kind].t,
          p: partyName(d),
          net: s(d) * d.totals.netBase,
          tax: s(d) * d.totals.taxBase,
          tot: s(d) * d.totals.totalBase
        })),

function saveUser(d) {
  need('users', d.id ? 'edit' : 'add');
  return DB.tx('u', () => {
    const un = normUser(d.username);
    if (!un) fail('أدخل اسم المستخدم');
    if (DB.all('users').some(u => u.username === un && u.id !== d.id)) fail('اسم المستخدم مستخدم مسبقًا');
    if (!d.id && !d.password) fail('أدخل كلمة المرور');
    if (d.password && d.password.length < 6) fail('كلمة المرور 6 أحرف على الأقل');
    const u = d.id ? DB.mut('users', d.id) : DB.put('users', { id: uid(), salt: uid() });
    const wasAdmin = u.roleId === 'admin' && u.active;
    Object.assign(u, { username: un, name: d.name, roleId: d.roleId, active: !!d.active });
    Object.assign(u, {
      scopeBranch: d.scopeBranch || '',
      scopeWh: d.scopeWh || '',
      limit: d.limit || 0,
      denyAcc: d.denyAcc || ''
    });
    if (d.password) {
      u.salt = d.salt2 || uid();
      u.hash = d.hash2 || hashPw(d.password, u.salt);
      u.mustChange = false;
    }
    if (wasAdmin && !DB.all('users').some(x => x.roleId === 'admin' && x.active))
      fail('يجب أن يبقى مدير واحد نشط على الأقل');
    logA(d.id ? 'تعديل مستخدم' : 'إضافة مستخدم', un);
    if (Auth.user?.id === u.id) Auth.user = u;
    return u;
  });
}

function importRows(k, rows, opts = {}) {
  return DB.tx('imp', () => {
    const G = (r, x) => r[x] ?? '',

        if (Number.isNaN(n)) fail(`السطر ${i + 2}: قيمة غير صالحة «${v}»`);

    if (miss.length) fail(`أعمدة ناقصة: ${miss.join('، ')}`);
    if (IMPORTERS[k]) {
      const result = IMPORTERS[k](rows, opts);
      logA('استيراد', IMPORTS[k][0]);
      return result;
    }
    if (k === 'customers' || k === 'suppliers') {
      const t = k === 'customers' ? 'customer' : 'supplier';
      rows.forEach((r, i) => {
        if (!G(r, 'الاسم')) fail(`السطر ${i + 2}: الاسم مطلوب`);

          saveParty(t, {
            code: G(r, 'الكود'),
            name: G(r, 'الاسم'),

            terms: parseInt(normNum(G(r, 'مدة السداد')) || '0', 10),
            currency: set().baseCur,

            openingDate: fyStart(),

        } catch (e) {
          fail(`السطر ${i + 2}: ${e.message}`);

      });
    } else if (k === 'items')
      rows.forEach((r, i) => {
        if (!G(r, 'الاسم')) fail(`السطر ${i + 2}: الاسم مطلوب`);
        try {
          saveItem({
            code: G(r, 'الكود'),
            barcode: G(r, 'الباركود'),
            name: G(r, 'الاسم'),
            unit: G(r, 'الوحدة'),
            buyPrice: m(G(r, 'سعر الشراء'), i),
            sellPrice: m(G(r, 'سعر البيع'), i),
            reorder: toQty(G(r, 'حد إعادة الطلب')),
            taxBp: G(r, 'نسبة الضريبة') === '' ? set().vatBp : toBp(G(r, 'نسبة الضريبة')),
            type: 'stock',
            categoryId: DB.all('categories')[0]?.id
          });
        } catch (e) {

      });

        const it = DB.all('items').find(x => x.code === G(r, 'كود الصنف'));
        if (!it) fail(`السطر ${i + 2}: الصنف غير موجود`);

        return { itemId: it.id, qty: q, cost: m(G(r, 'تكلفة الوحدة'), i) };
      });

    logA('استيراد', IMPORTS[k][0]);
    return rows.length;
  });
}

const Charts = {};
/* سلاسل لوحة التحكم الشهرية، مقيدة بالفرع المعروض إن وُجد */
function dashSeries(br = '') {
  const y = set().fiscalYear,
    lim = y === new Date().getFullYear() ? new Date().getMonth() + 1 : 12,
    Z = () => Array(12).fill(0),
    mOf = d => +d.slice(5, 7) - 1,
    inBr = d => !br || d.branchId === br,
    f = { from: y + '-01-01', to: y + '-12-31' },
    cash = new Set(DB.all('cashAccounts').map(c => c.accountId)),
    S = {
      sales: Z(),
      purch: Z(),
      rev: Z(),
      cost: Z(),
      profit: Z(),
      exp: Z(),
      cin: Z(),
      cout: Z(),
      inv: Z(),
      col: Z()
    };
  const addDocs = (k, key, sg) =>
    docsOf(k, f)
      .filter(inBr)
      .forEach(d => (S[key][mOf(d.date)] += sg * d.totals.netBase));
  addDocs('si', 'sales', 1);
  addDocs('sr', 'sales', -1);
  addDocs('cn', 'sales', -1);
  addDocs('pi', 'purch', 1);
  addDocs('pret', 'purch', -1);
  docsOf('si', f)
    .filter(inBr)
    .forEach(d => (S.inv[mOf(d.date)] += d.totals.totalBase));
  for (let m = 0; m < lim; m++) {
    const mm = String(m + 1).padStart(2, '0'),
      is = incomeStatement({ from: `${y}-${mm}-01`, to: `${y}-${mm}-31`, branch: br });
    S.rev[m] = is.R;
    S.cost[m] = is.C + is.O;
    S.profit[m] = is.net;
    S.exp[m] = is.O;
  }
  posted().forEach(j => {
    if (!j.date.startsWith(y + '-') || j.type === 'closing' || j.type === 'opening') return;
    if (j.lines.every(l => cash.has(l.acc))) return;
    const n = sum(
      j.lines.filter(l => cash.has(l.acc) && (!br || l.branch === br)),
      l => l.debit - l.credit
    );
    if (n > 0) S.cin[mOf(j.date)] += n;
    else S.cout[mOf(j.date)] -= n;
  });
  DB.all('vouchers')
    .filter(
      v =>
        v.kind === 'R' &&
        v.status === 'approved' &&
        ['customer', 'advance'].includes(v.category) &&
        v.date.startsWith(y + '-') &&
        (!br || DB.get('cashAccounts', v.cashAccId)?.branchId === br)
    )
    .forEach(v => (S.col[mOf(v.date)] += v.amountBase));
  const out = { labels: MONTHS.slice(0, lim) };
  Object.keys(S).forEach(k => (out[k] = S[k].slice(0, lim)));
  return out;
}

function topCustomers(br, n = 5) {

    .forEach(d => (T[d.partyId] = (T[d.partyId] || 0) + d.totals.netBase));

    top = L.slice(0, n).map(([id, v]) => [nameOf('customers', id) || 'عميل نقدي', v]),
    rest = sum(L.slice(n), x => x[1]);

  return top;
}

function drawChartJs(box, id, sp) {

      }))
    },
    options: {

      cutout: donut ? '68%' : undefined,
      animation: calm() ? false : { duration: 500 },
      interaction: { mode: donut ? 'nearest' : 'index', intersect: donut },

  for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));

/* ===== 29-2-snapshots: اللقطات الاحتياطية التلقائية في قاعدة منفصلة ===== */
const Snap = {
  KEEP: 7,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('namaa_snapshots', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('snaps', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async list() {
    const db = await this.open();
    return new Promise(res => {
      const q = db.transaction('snaps').objectStore('snaps').getAll();
      q.onsuccess = () => {
        db.close();
        res(q.result.map(({ body, ...m }) => m).sort((a, b) => (a.at < b.at ? 1 : -1)));
      };
    });
  },
  async get(id) {
    const db = await this.open();
    return new Promise(res => {
      const q = db.transaction('snaps').objectStore('snaps').get(id);
      q.onsuccess = () => {
        db.close();
        res(q.result);
      };
    });
  },
  async create(reason) {
    const body = JSON.stringify(DB.exportAll()),
      rec = {
        id: new Date().toISOString(),
        at: new Date().toISOString(),
        reason,
        size: body.length,
        checksum: sha256(body),
        body
      };
    const db = await this.open();
    await new Promise((res, rej) => {
      const t = db.transaction('snaps', 'readwrite');
      t.objectStore('snaps').put(rec);
      t.oncomplete = res;
      t.onerror = () => rej(t.error);
    });
    db.close();
    const all = await this.list(),
      extra = all.filter(s => s.reason === 'نسخة يومية').slice(this.KEEP);
    if (extra.length) {
      const d2 = await this.open();
      const t = d2.transaction('snaps', 'readwrite');
      extra.forEach(s => t.objectStore('snaps').delete(s.id));
      await new Promise(r => (t.oncomplete = r));
      d2.close();
    }
    if (!DB.isReadOnly()) DB.tx('sn', () => logA('نسخة احتياطية تلقائية', reason));
    return rec;
  },
  async auto() {
    if (DB.isReadOnly()) return;
    const st = set();
    if (st.appVersion !== APP.version) {
      if (st.appVersion && DB.all('journals').length) await this.create('قبل التحديث إلى ' + APP.version);
      DB.tx('v', () => {
        DB.mut('meta', 'settings').appVersion = APP.version;
      });
    }
    const L = await this.list();
    if (DB.all('journals').length && !L.some(s => s.reason === 'نسخة يومية' && s.at.slice(0, 10) === today()))
      await this.create('نسخة يومية');
  }
};
/* اختبار سلامة نسخة: تُحمَّل في بيئة معزولة ويُعاد عليها فحص السلامة كاملًا */
function verifyData(data) {
  return DB.sandbox(() => {
    DB.loadInto(data);
    const u = Auth.user;
    Auth.user = null;
    try {
      const H = healthCheck().filter(c => c.t !== 'الأرصدة الافتتاحية متوازنة'),
        T = trialBalance({});
      return {
        ok: H.every(c => c.ok),
        bad: H.filter(c => !c.ok).map(c => c.t),
        journals: DB.all('journals').length,
        docs: DB.all('docs').length,
        debit: T.T.md

    } finally {
      Auth.user = u;
    }
  }, true);
}

/* ===== 29-7-security: الأمان: تشفير كلمات المرور، القفل، انتهاء الجلسة ===== */
const PBKDF2_N = 210000;
async function pwDerive(pw, salt) {
  if (!crypto.subtle) return null;
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, [
    'deriveBits'
  ]);
  const b = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: PBKDF2_N },
    k,
    256
  );
  return 'p2:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const pwMake = async (pw, salt) => (await pwDerive(pw, salt)) || hashPw(pw, salt);
const pwCheck = async (u, pw) =>
  u.hash.startsWith('p2:') ? (await pwDerive(pw, u.salt)) === u.hash : hashPw(pw, u.salt) === u.hash;
ACT.login = async () => {
  if (ACT.login.busy) return;
  ACT.login.busy = true;
  Busy.on();
  try {
    const name = normUser($('#l-user').value),
      p = $('#l-pass').value,
      x = DB.all('users').find(a => a.username === name),
      now = Date.now();
    if (x && (x.lockUntil || 0) > now)
      return toast(`الحساب مقفل مؤقتًا؛ حاول بعد ${Math.ceil((x.lockUntil - now) / 60000)} دقيقة`, 'err');
    if (!window.isSecureContext && x?.hash.startsWith('p2:'))
      return toast(
        'افتح النظام عبر رابط آمن يبدأ بـ https أو عبر localhost؛ تسجيل الدخول لا يعمل على http العادي',
        'err'
      );
    const ok = x && x.active && (await pwCheck(x, p));
    if (!ok) {
      if (x && !DB.isReadOnly())
        DB.tx('f', () => {
          const m = DB.mut('users', x.id);
          m.fails = (m.fails || 0) + 1;
          if (m.fails >= 5) {
            m.lockUntil = now + 300000;
            m.fails = 0;
            logA('قفل حساب بعد محاولات فاشلة', m.username);
          }
        });
      return toast('اسم المستخدم أو كلمة المرور غير صحيحة', 'err');
    }
    if (!DB.isReadOnly()) {
      const up = x.hash.startsWith('p2:') ? null : await pwMake(p, x.salt);
      DB.tx('ok', () => {
        const m = DB.mut('users', x.id);
        m.fails = 0;
        m.lockUntil = 0;
        if (up) m.hash = up;
        logA('تسجيل دخول', m.username);
      });
      await DB.flush();
    }
    enterApp(DB.get('users', x.id));
    Snap.auto().catch(e => console.warn(e));
  } finally {
    ACT.login.busy = false;
    Busy.off();
  }
};

/* يقبل: 2026-03-15، 15/03/2026، أو الرقم التسلسلي لتواريخ Excel */
function normDate(value) {
  const text = normNum(value).replace(/\//g, '-');
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(text)) {
    const [y, m, d] = text.split('-').map(Number);
    return `${y}-${pad2(m)}-${pad2(d)}`;
  }
  if (/^\d{1,2}-\d{1,2}-\d{4}$/.test(text)) {
    const [d, m, y] = text.split('-').map(Number);
    return `${y}-${pad2(m)}-${pad2(d)}`;
  }
  if (/^\d{5}(\.\d+)?$/.test(text)) {
    const base = new Date(1899, 11, 30, 12);
    base.setDate(base.getDate() + Math.floor(Number(text)));
    return isoOf(base);
  }
  return '';
}

/* أدوات قراءة السطر برسائل خطأ تذكر رقم السطر في الملف */
function rowReader(row, index) {
  const line = index + 2;
  const err = msg => fail(`السطر ${line}: ${msg}`);
  const text = col => String(row[col] ?? '').trim();
  const money = col => {
    const n = toMinor(text(col));
    if (Number.isNaN(n)) err(`قيمة غير صالحة في «${col}»`);
    return n;
  };
  const date = (col, fallback) => {
    if (!text(col)) return fallback ?? err(`«${col}» مطلوب`);
    return normDate(text(col)) || err(`تاريخ غير صالح «${text(col)}»`);
  };
  return { line, err, text, money, date };
}

/* طبيعة الحساب من النص: مدين/دائن أو D/C؛ null عند نص غير مفهوم */
const natureOf = t => {
  if (/^(مدين|d)$/i.test(t)) return 'D';
  if (/^(دائن|c)$/i.test(t)) return 'C';
  return null;
};
const defaultNature = type => (['asset', 'expense'].includes(type) ? 'D' : 'C');

/* خلية اختيارية بقيم محددة: فارغة → null، غير مفهومة → خطأ في السطر */
function coaCell(r, col, parse, unknown) {
  const t = r.text(col);
  if (!t) return null;
  return parse(t) || r.err(`${unknown} «${t}»`);
}
/* صف دليل حسابات → بيانات الحساب؛ الفرع يرث النوع من أبيه */
function coaRowData(r, accounts) {
  const code = normNum(r.text('رقم الحساب')) || r.err('رقم الحساب مطلوب'),
    parentCode = normNum(r.text('رقم الحساب الأب')),
    parent = parentCode ? accounts.get(parentCode) : null;
  if (parentCode && !parent) r.err(`الحساب الأب ${parentCode} غير موجود في الملف أو الدليل`);
  const textType = coaCell(r, 'النوع', t => ACC_TYPE_BY_NAME[t], 'نوع غير معروف'),
    type = parent?.type || textType || r.err('حدد النوع للحساب الرئيسي'),
    nature = coaCell(r, 'الطبيعة', natureOf, 'طبيعة غير معروفة'),
    existing = accounts.get(code);
  return {
    existing,
    data: {
      ...(existing || {}),
      code,
      name: r.text('اسم الحساب') || r.err('اسم الحساب مطلوب'),
      parentId: parent ? parent.id : '',
      type,
      nature: nature || existing?.nature || parent?.nature || defaultNature(type),
      group: flag(r, 'تجميعي', existing?.group || false),
      active: flag(r, 'نشط', existing?.active !== false),
      currency: existing?.currency || set().baseCur
    }
  };
}

function importCoa(rows) {
  let added = 0,

  coaOrder(rows).forEach(({ row, i }) => {

    if (existing) updated++;

}

function importTrialBalance(rows, opts) {
  const date = opts.date || fyStart();
  if (!isDate(date)) fail('تاريخ الأرصدة غير صالح');
  const accounts = byCode('accounts');
  const net = new Map();
  let skippedGroups = 0;
  rows.forEach((row, i) => {
    const r = rowReader(row, i);
    const code = normNum(r.text('رقم الحساب'));
    if (!code || /إجمالي/.test(code)) return;
    const a = accounts.get(code);
    if (!a) r.err(`الحساب ${code} غير موجود؛ استورد دليل الحسابات أولًا`);
    const amount = r.money('مدين') - r.money('دائن');
    if (a.group) {
      skippedGroups++;
      return;
    }
    net.set(a.id, (net.get(a.id) || 0) + amount);
  });
  const total = sum([...net.values()]);
  if (total !== 0)
    fail(`الميزان غير متوازن: الفرق ${fm(Math.abs(total))} لصالح ${total > 0 ? 'المدين' : 'الدائن'}`);
  const offset = acc('openingOffset');
  const entries = [];
  net.forEach((amount, id) => {
    const a = DB.get('accounts', id);
    if (id === offset) return;
    if (a.control) {
      const current = accBal(id, { to: date });
      if (current !== amount)
        fail(
          `رصيد ${a.name} في الملف ${fm(amount)} لا يطابق المسجل ${fm(current)}؛ استورد ${a.control === 'inventory' ? 'أرصدة المخزون' : a.control === 'customer' ? 'العملاء' : 'الموردين'} بأرصدتهم الافتتاحية أولًا`
        );
      return;
    }
    if (amount) entries.push({ acc: id, debit: amount > 0 ? amount : 0, credit: amount < 0 ? -amount : 0 });
  });
  postOpeningGrid(entries, date);
  return { count: rows.length, note: skippedGroups ? `تُجوهلت ${skippedGroups} حسابات تجميعية` : '' };
}

function importInvoices(rows, opts) {
