    DB.all('items').flatMap(it => [[it.code, it], ...(it.barcode ? [[it.barcode, it]] : [])])
  );
  const warehouse = whOpts()[0]?.[0];
  const groups = groupBy(rows, (row, i) => {
    const r = rowReader(row, i);
    const kind =
      KIND_BY_NAME[r.text('النوع')] || r.err(`النوع يجب أن يكون بيع أو شراء، وليس «${r.text('النوع')}»`);
    return `${kind}|${r.text('رقم المرجع') || r.err('رقم المرجع مطلوب')}`;
  });
  const created = [];
  groups.forEach((members, key) => {
    const [kind, ref] = key.split('|');
    const first = rowReader(members[0].row, members[0].i);
    if (DB.all('docs').some(d => d.kind === kind && (d.no === ref || d.importRef === ref)))
      first.err(`الفاتورة ${ref} مسجلة مسبقًا ولن تُستورد مرتين`);
    const party = parties[kind].get(first.text('كود الطرف'));
    if (!party)
      first.err(`${kind === 'si' ? 'العميل' : 'المورد'} بالكود «${first.text('كود الطرف')}» غير موجود`);
    const date = first.date('التاريخ');
    const lines = members.map(({ row, i }) => {
      const r = rowReader(row, i);
      const item = items.get(r.text('كود الصنف'));
      if (!item) r.err(`الصنف «${r.text('كود الصنف')}» غير موجود`);
      const qty = toQty(r.text('الكمية'));
      if (!(qty > 0)) r.err('الكمية يجب أن تكون أكبر من صفر');
      return {
        itemId: item.id,
        desc: item.name,
        qty,
        price: r.money('السعر'),
        discBp: r.text('الخصم %') ? toBp(r.text('الخصم %')) : 0,
        taxBp: r.text('الضريبة %') ? toBp(r.text('الضريبة %')) : (item.taxBp ?? set().vatBp)
      };
    });
    try {
      const doc = saveDoc({
        kind,
        formId: `imp:${kind}:${ref}`,
        date,
        due: first.date('الاستحقاق', date),
        partyId: party.id,
        whId: warehouse,
        currency: set().baseCur,
        discount: first.money('خصم الفاتورة'),
        supplierNo: kind === 'pi' ? first.text('رقم فاتورة المورد') : '',
        notes: first.text('ملاحظات'),
        payMethod: 'credit',
        paidNow: 0,
        lines
      });
      DB.mut('docs', doc.id).importRef = ref;
      created.push(doc);
    } catch (e) {
      first.err(`${ref}: ${e.message}`);
    }
  });
  if (opts.approve)
    /* الاعتماد بترتيب التاريخ، والمشتريات قبل المبيعات في اليوم نفسه، حتى يتوفر المخزون */
    created
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.kind === 'pi' ? -1 : 1))
      .forEach(d => {
        try {
          approveDoc(d.id);
        } catch (e) {
          fail(`اعتماد ${d.importRef}: ${e.message}`);
        }
      });
  return { count: rows.length, note: `${created.length} فاتورة${opts.approve ? ' معتمدة' : ' كمسودات'}` };
}

function importJournals(rows, opts) {
  const accounts = byCode('accounts');
  const centers = byCode('costCenters');
  const parties = { customer: byCode('customers'), supplier: byCode('suppliers') };
  const groups = groupBy(
    rows,
    (row, i) => rowReader(row, i).text('رقم المرجع') || rowReader(row, i).err('رقم المرجع مطلوب')
  );
  const created = [];
  groups.forEach((members, ref) => {
    const first = rowReader(members[0].row, members[0].i);
    if (DB.all('journals').some(j => j.no === ref || j.importRef === ref))
      first.err(`القيد ${ref} مسجل مسبقًا ولن يُستورد مرتين`);
    const lines = members.map(({ row, i }) => {
      const r = rowReader(row, i);
      const a = accounts.get(normNum(r.text('رقم الحساب')));
      if (!a) r.err(`الحساب ${r.text('رقم الحساب')} غير موجود`);
      const line = { acc: a.id, debit: r.money('مدين'), credit: r.money('دائن'), memo: '' };
      const cc = r.text('كود مركز التكلفة');
      if (cc) line.cc = centers.get(cc)?.id || r.err(`مركز التكلفة ${cc} غير موجود`);
      if (a.control === 'customer' || a.control === 'supplier') {
        const p = parties[a.control].get(r.text('كود الطرف'));
        if (!p) r.err(`الحساب ${a.name} يتطلب كود ${a.control === 'customer' ? 'عميل' : 'مورد'} صحيحًا`);
        Object.assign(line, { partyType: a.control, partyId: p.id });
      }
      return line;
    });
    try {
      const j = saveJournal({
        date: first.date('التاريخ'),
        jtype: 'عام',
        ref,
        memo: first.text('البيان'),
        lines
      });
      DB.mut('journals', j.id).importRef = ref;
      if (opts.approve) postJournal(j.id);
      created.push(j);
    } catch (e) {
      first.err(`${ref}: ${e.message}`);
    }
  });
  return { count: rows.length, note: `${created.length} قيد${opts.approve ? ' مرحّل' : ' كمسودات'}` };
}

const IMPORTERS = {
  coa: importCoa,
  tb: importTrialBalance,
  invoices: importInvoices,
  journals: importJournals
};

/* ---------- المصدِّرات ---------- */
const head = cols => cols.map(v => ({ v, h: 1 }));
const cellMoney = minor => ({ v: Number(minorStr(minor)), n: 1 });
const qtyCell = q => ({ v: Number(qtyStr(q)), n: 1, int: 1 });
const EXPORTS = {
  coa: () => ({
    name: 'دليل الحسابات',
    rows: [
      head([...COA_COLS, 'المستوى', 'الرصيد']),
      ...DB.all('accounts')
        .sort((a, b) => (a.code < b.code ? -1 : 1))
        .map(a => [
          a.code,
          a.name,
          DB.get('accounts', a.parentId)?.code || '',
          ACC_TYPES[a.type],
          a.nature === 'D' ? 'مدين' : 'دائن',
          a.group ? 'نعم' : 'لا',
          a.active ? 'نعم' : 'لا',
          { v: levelOf(a), n: 1, int: 1 },
          cellMoney(accBal(a.id))
        ])
    ]
  }),
  tb: () => {
    const t = trialBalance({});
    return {
      name: 'ميزان المراجعة',
      rows: [
        head(TB_COLS),
        ...t.rows.filter(r => !r.b).map(r => [r.code, r.name, cellMoney(r.cd), cellMoney(r.cc)]),
        [{ v: 'الإجمالي', b: 1 }, '', { ...cellMoney(t.T.cd), b: 1 }, { ...cellMoney(t.T.cc), b: 1 }]
      ]
    };
  },
  invoices: () => ({
    name: 'الفواتير',
    rows: [
      head([...INV_COLS, 'الحالة']),
      ...DB.all('docs')
        .filter(d => d.kind === 'si' || d.kind === 'pi')
        .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.no < b.no ? -1 : 1))
        .flatMap(d =>
          d.lines.map((l, i) => [
            d.no,
            d.kind === 'si' ? 'بيع' : 'شراء',
            d.date,
            d.due || '',
            DB.get(d.kind === 'si' ? 'customers' : 'suppliers', d.partyId)?.code || '',
            d.supplierNo || '',
            DB.get('items', l.itemId)?.code || '',
            qtyCell(l.qty),
            cellMoney(l.factor ? mulDiv(l.price, 1000, l.factor) : l.price),
            { v: Number(bpStr(l.discBp || 0)), n: 1 },
            { v: Number(bpStr(l.taxBp || 0)), n: 1 },
            i ? '' : cellMoney(d.discount || 0),
            i ? '' : d.notes || '',
            { draft: 'مسودة', approved: 'معتمد', cancelled: 'ملغي' }[d.status]
          ])
        )
    ]
  }),
  journals: () => ({
    name: 'القيود',
    rows: [
      head([...JE_COLS, 'الحالة', 'المصدر']),
      ...DB.all('journals')
        .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.no < b.no ? -1 : 1))
        .flatMap(j =>
          j.lines.map(l => [
            j.no,
            j.date,
            j.memo,
            DB.get('accounts', l.acc)?.code || '',
            l.partyId
              ? DB.get(l.partyType === 'customer' ? 'customers' : 'suppliers', l.partyId)?.code || ''
              : '',
            DB.get('costCenters', l.cc)?.code || '',
            cellMoney(l.debit),
            cellMoney(l.credit),
            j.status === 'posted' ? 'مرحل' : 'مسودة',
            j.type === 'manual' ? 'يدوي' : 'آلي'
          ])
        )
    ]
  }),
  customers: () => ({
    name: 'العملاء',
    rows: [
      head([...IMPORTS.customers[1], 'الرصيد الحالي']),
      ...DB.all('customers').map(c => [
        c.code,
        c.name,
        c.phone || '',
        c.email || '',
        c.address || '',
        c.taxNo || '',
        cellMoney(c.creditLimit || 0),
        { v: Number(c.terms || 0), n: 1, int: 1 },
        cellMoney(c.opening || 0),
        cellMoney(partyBal('customer', c.id))
      ])
    ]
  }),
  suppliers: () => ({
    name: 'الموردون',
    rows: [
      head([...IMPORTS.suppliers[1], 'الرصيد الحالي']),
      ...DB.all('suppliers').map(c => [
        c.code,
        c.name,
        c.phone || '',
        c.email || '',
        c.address || '',
        c.taxNo || '',
        { v: Number(c.terms || 0), n: 1, int: 1 },
        cellMoney(c.opening || 0),
        cellMoney(-partyBal('supplier', c.id))
      ])
    ]
  }),
  items: () => ({
    name: 'الأصناف',
    rows: [
      head([...IMPORTS.items[1], 'الكمية الحالية', 'القيمة الحالية']),
      ...DB.all('items').map(i => [
        i.code,
        i.barcode || '',
        i.name,
        i.unit || '',
        cellMoney(i.buyPrice || 0),
        cellMoney(i.sellPrice || 0),
        qtyCell(i.reorder || 0),
        { v: Number(bpStr(i.taxBp ?? 0)), n: 1 },
        qtyCell(itemQty(i.id)),
        cellMoney(itemValue(i.id))
      ])
    ]
  })
};
const EXPORT_LABELS = {
  coa: 'دليل الحسابات',
  tb: 'ميزان المراجعة',
  invoices: 'الفواتير',
  journals: 'القيود',
  customers: 'العملاء',
  suppliers: 'الموردون',
  items: 'الأصناف'
};
const EXPORT_PERM = {
  coa: 'accounts',
  tb: 'finreports',
  invoices: 'sales',
  journals: 'journal',
  customers: 'customers',
  suppliers: 'suppliers',
  items: 'items'
};
const canExport = k => can('backup', 'export') || can(EXPORT_PERM[k], 'export');
const exportPanel = () =>
  h`<section class="panel span2"><h2>تصدير إلى Excel</h2><p class="muted">الملف المصدَّر بالأعمدة نفسها التي يقبلها الاستيراد، فيمكن تعديله ثم استيراده في شركة أخرى.</p><div class="exp-row">${Object.entries(EXPORT_LABELS).map(([k, t]) => (canExport(k) ? btn(t, 'expOne', { k }) : ''))}${can('backup', 'export') ? btn('كل الجداول في ملف واحد', 'bkXlsx', {}, 'primary') : ''}</div></section>`;
ACT.expOne = d =>
  run(async () => {
    if (!canExport(d.k)) fail('ليست لديك صلاحية التصدير');
    const sheet = EXPORTS[d.k]();
    download(await makeXlsx([sheet]), `${sheet.name}-${today()}.xlsx`);
    DB.tx('ex', () => logA('تصدير', sheet.name));
  }, 'تم تصدير الملف');
ACT.bkXlsx = () =>
  run(async () => {
    need('backup', 'export');
    download(await makeXlsx(Object.values(EXPORTS).map(f => f())), `florix-data-${today()}.xlsx`);
    DB.tx('ex', () => logA('تصدير', 'كل الجداول'));
  }, 'تم تصدير البيانات');

/* ---------- ربط الاستيراد بالصفحة ---------- */
const importOpts = k => ({
  date: $('#imp-date-tb')?.value,
  approve: !!$(`#imp-approve-${k}`)?.checked
});
CHG.impFile = async el => {
  const file = el.files[0],
    k = el.dataset.k;
  if (!file) return;
  const opts = importOpts(k);
  const r = await run(async () => {
    need('backup', 'add');
    const rows = await readSheet(file);
    return importRows(k, rows, opts);
  });
  el.value = '';
  if (r) {
    toast(`تم استيراد ${r.count ?? r} سطر${r.note ? '؛ ' + r.note : ''}`);
    refresh();
  }
};
